<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}

<script type="module">
// Σενάριο 9 «Το Τριώνυμο στο Κέντρο Καινοτομίας» (Α΄ Λυκείου, §3.3 και §4.2) — Σταθμός 4: Το καλάθι
// Κέντρο Καινοτομίας Θεσσαλίας. Τρεις βολές από το σημείο (0, 2) προς ένα καλάθι με το κέντρο του στεφανιού
// σε οριζόντια απόσταση 5 m και ύψος 3 m. Η τροχιά κάθε βολής είναι η παραβολή h(x) = αx² + βx + 2 και η μπάλα
// βρίσκεται στο ύψος του καλαθιού όταν αx² + βx + 2 = 3: δύο φορές αν Δ > 0, μία αν Δ = 0, καμία αν Δ < 0.
// Με g = 10 m/s² η οριζόντια ταχύτητα v δίνεται από το α = −g/(2v²): 5 m/s στη Βολή Α, √20 m/s στις Β και Γ.
// Μονάδα μήκους: 1 μέτρο. Προβολή 3D και VR σε κλίμακα 1:1, AR πάνω στο θρανίο σε κλίμακα 1:20.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const G = 10;                                        // επιτάχυνση της βαρύτητας (m/s²)
const KALATHI = new THREE.Vector3(5, 3, 0);          // κέντρο του στεφανιού
const R_MPALA = 0.12;                                // ακτίνα της μπάλας
const ANAMONI = 0.3, ANAPAUSI = 1.2;                 // η μπάλα περιμένει στη ρίψη και μένει στο έδαφος πριν από την επόμενη βολή
const V_DIXTY = 2.5;                                 // κατακόρυφη ταχύτητα με την οποία η μπάλα βγαίνει από το δίχτυ (m/s)
const AR_SCALE = 1 / 20;                             // κλίμακα της σκηνής στο AR
const SCENE_C = new THREE.Vector3(3.5, 0, 0);        // κέντρο της σκηνής, που στο AR μπαίνει 0,85 m μπροστά στον χρήστη
const STAND = new THREE.Vector3(SCENE_C.x, 0, 6);    // θέση του χρήστη στο VR: 6 m από το επίπεδο του γηπέδου, απέναντι από το κέντρο του
const ACC = '#f97316';

const f = (x, d) => x.toFixed(d).replace('.', ',');
const rad = THREE.MathUtils.degToRad;
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

// ------------------------------------------------------------------ οι τρεις βολές
const VOLES = [
  { onoma: 'Α', a: -0.2, b: 1.2, col: 0xf97316 },
  { onoma: 'Β', a: -0.25, b: 1, col: 0xfacc15 },
  { onoma: 'Γ', a: -0.25, b: 0.5, col: 0x38bdf8 }
];
VOLES.forEach(v => {
  v.h = x => v.a * x * x + v.b * x + 2;
  v.vx = Math.sqrt(-G / (2 * v.a));                                         // 5 m/s και √20 m/s
  v.riza = h0 => (-v.b - Math.sqrt(v.b * v.b - 4 * v.a * (2 - h0))) / (2 * v.a);   // θετική λύση της h(x) = h0
  v.xEdafos = v.riza(0);                                                    // εκεί που η παραβολή φτάνει στο έδαφος
  if (v.onoma === 'Α') {
    v.tKalathi = KALATHI.x / v.vx;                                          // 1 s ως το στεφάνι
    v.tauPtosis = (-V_DIXTY + Math.sqrt(V_DIXTY * V_DIXTY + 2 * G * (KALATHI.y - R_MPALA))) / G;
    v.tEnd = v.tKalathi + v.tauPtosis;
    v.xTelos = KALATHI.x;                                                   // η τροχιά τελειώνει στο στεφάνι
  } else {
    v.tEnd = v.riza(R_MPALA) / v.vx;                                        // ως εκεί που η μπάλα ακουμπά το έδαφος
    v.xTelos = v.xEdafos;
  }
  v.kyklos = ANAMONI + v.tEnd + ANAPAUSI;
});
// η θέση της μπάλας τη στιγμή t του κύκλου (επιστρέφει και τον χρόνο πτήσης ως εκείνη τη στιγμή)
function thesiMpalas(v, t, out) {
  const s = t - ANAMONI;
  if (s <= 0) { out.set(0, 2, 0); return 0; }
  if (v.onoma === 'Α' && s > v.tKalathi) {
    // μετά το στεφάνι: το δίχτυ κόβει την οριζόντια κίνηση και η μπάλα πέφτει
    const tau = Math.min(s - v.tKalathi, v.tauPtosis);
    out.set(KALATHI.x + 0.06 * (1 - Math.exp(-tau / 0.012)), KALATHI.y - V_DIXTY * tau - G / 2 * tau * tau, 0);
  } else {
    const x = v.vx * Math.min(s, v.tEnd);
    out.set(x, v.h(x), 0);
  }
  return Math.min(s, v.tEnd);
}

// καταστάσεις: ποια βολή δείχνει η καθεμία
const STATE_VOLI = [0, 1, 2, 0, 0];
const HINTS = [
  '<b>Βολή Α:</b> h(x) = −0,2x² + 1,2x + 2. Η μπάλα φτάνει στο ύψος του καλαθιού, 3 m, δύο φορές: όταν ανεβαίνει, στο x = 1, και όταν κατεβαίνει, στο x = 5, όπου είναι το καλάθι. Η εξίσωση −0,2x² + 1,2x + 2 = 3 γίνεται x² − 6x + 5 = 0, με Δ = 16 &gt; 0. Καλάθι γίνεται μόνο με τη δεύτερη ρίζα: στην πρώτη η μπάλα ανεβαίνει και θα χτυπούσε το στεφάνι από κάτω.',
  '<b>Βολή Β:</b> h(x) = −0,25x² + x + 2. Η μπάλα μόλις αγγίζει τα 3 m, μία φορά, στην κορυφή της τροχιάς (x = 2). Η εξίσωση γίνεται x² − 4x + 4 = 0, με Δ = 0: μία διπλή ρίζα. Στο x = 5 η μπάλα είναι ήδη στα 0,75 m.',
  '<b>Βολή Γ:</b> h(x) = −0,25x² + 0,5x + 2. Το ψηλότερο σημείο της τροχιάς είναι στα 2,25 m, οπότε η μπάλα δεν φτάνει ποτέ τα 3 m. Η εξίσωση γίνεται x² − 2x + 4 = 0, με Δ = −12 &lt; 0: καμία ρίζα. Η μπάλα πέφτει στο έδαφος στο x = 4.',
  '<b>Η κορυφή και ο άξονας:</b> στη Βολή Α οι ρίζες x₁ = 1 και x₂ = 5 έχουν άθροισμα 6 και γινόμενο 5 (τύποι του Vieta για την x² − 6x + 5 = 0). Απέχουν το ίδιο από την ευθεία x = 3, τον άξονα συμμετρίας της παραβολής, πάνω στον οποίο βρίσκεται η κορυφή (3; 3,8).',
  '<b>Πάνω από τα 3 m:</b> η μπάλα της Βολής Α είναι ψηλότερα από το καλάθι μόνο ανάμεσα στις ρίζες: −0,2x² + 1,2x + 2 &gt; 3 ⇔ x² − 6x + 5 &lt; 0 ⇔ (x − 1)(x − 5) &lt; 0 ⇔ 1 &lt; x &lt; 5.'
];
// αδιάσπαστα κενά γύρω από τα σύμβολα σχέσεων, πριν από τις μονάδες και μέσα στα ζεύγη συντεταγμένων
// (ζεύγος με δεκαδικό γράφεται με «; », π.χ. (3; 3,8), ζεύγος ακεραίων με «, », π.χ. (5, 3))
const hintHTML = k => HINTS[k].replace(/ (=|≈|⇔|&gt;|&lt;) /g, ' $1 ').replace(/(\d) m\b/g, '$1 m')
  .replace(/\(([−-]?\d+(?:,\d+)?)([;,]) ([−-]?\d+(?:,\d+)?)\)/g, '($1$2\u00a0$3)');
const PANELS = [
  ['Βολή Α: Δ > 0', '−0,2x² + 1,2x + 2 = 3 ⇔ x² − 6x + 5 = 0', 'Δ = 16 > 0: δύο ρίζες, x = 1 και x = 5'],
  ['Βολή Β: Δ = 0', '−0,25x² + x + 2 = 3 ⇔ x² − 4x + 4 = 0', 'Δ = 0: μία διπλή ρίζα, x = 2'],
  ['Βολή Γ: Δ < 0', '−0,25x² + 0,5x + 2 = 3 ⇔ x² − 2x + 4 = 0', 'Δ = −12 < 0: καμία ρίζα'],
  ['Η κορυφή και ο άξονας', 'S = x₁ + x₂ = 6, P = x₁x₂ = 5', 'Άξονας συμμετρίας x = 3, κορυφή (3; 3,8)'],
  ['Πάνω από τα 3 m: 1 < x < 5', 'x² − 6x + 5 < 0 ⇔ (x − 1)(x − 5) < 0', 'Ανάμεσα στις ρίζες x₁ = 1 και x₂ = 5']
];

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;

const FIT = [V(-1.55, 0, 1.6), V(-1.55, 0, -1.6), V(-1.6, 3.24, 0), V(-1.0, 4.75, 0), V(7.0, 4.75, 0)];
const FIT_LAND = [V(8.5, 0, 1.6), V(8.5, 0, -1.6)], FIT_PORT = [V(7.2, 0, 1.6), V(7.2, 0, -1.6)];
const TGT0 = V(3.2, 2.1, 0);
const VIEW_DIR = new THREE.Vector3(-0.2, 0.22, 1).normalize();  // από το πλάι, λίγο από ψηλά και από την πλευρά του παίκτη
let barBottom = 62, dockTop = 600, touched = false;

const hintEl = document.getElementById('hint');
function dockTopMax() {                   // το ψηλότερο σημείο των κουμπιών, με τη μεγαλύτερη από τις υποδείξεις
  const dock = document.getElementById('dock'), keep = hintEl.innerHTML;
  let top = dock.getBoundingClientRect().top;
  for (let k = 0; k < HINTS.length; k++) { hintEl.innerHTML = hintHTML(k); top = Math.min(top, dock.getBoundingClientRect().top); }
  hintEl.innerHTML = keep;
  return top;
}
function layoutView() {
  const W = window.innerWidth, Hh = window.innerHeight;
  barBottom = Math.round(document.getElementById('bar').getBoundingClientRect().bottom);
  dockTop = Math.round(dockTopMax());
  // το κέντρο της εικόνας μετακινείται στο μέσο του ελεύθερου χώρου ανάμεσα στη μπάρα και στα κουμπιά
  const dy = Math.max(0, Math.round(Hh / 2 - (barBottom + dockTop) / 2));
  const FH = Hh + 2 * dy;
  camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(rad(FOV / 2)) * FH / Hh));
  camera.aspect = W / FH;
  if (dy) camera.setViewOffset(W, FH, 0, 2 * dy, W, Hh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if (!renderer.xr.isPresenting) setLabelScale(W / Hh < 1 ? 1.15 : 1);
}
function homeView() {
  const W = window.innerWidth, Hh = window.innerHeight;
  // το ελεύθερο ορθογώνιο σε κανονικοποιημένες συντεταγμένες της οθόνης (−1 έως 1)
  const yTop = 1 - 2 * (barBottom + 6) / Hh, yBot = 1 - 2 * (dockTop - 6) / Hh;
  const yMid = (yTop + yBot) / 2, hy = 0.95 * (yTop - yBot) / 2, hx = 0.95;
  const pts = FIT.concat(W >= Hh ? FIT_LAND : FIT_PORT);
  // η απόσταση της κάμερας διορθώνεται μέχρι οι γωνίες της σκηνής να χωρούν ακριβώς στο ορθογώνιο
  let D = 16;
  for (let it = 0; it < 8; it++) {
    camera.position.copy(VIEW_DIR).multiplyScalar(D).add(TGT0);
    camera.lookAt(TGT0);
    camera.updateMatrixWorld();
    let r = 0;
    for (const c of pts) {
      const p = c.clone().project(camera);
      r = Math.max(r, Math.abs(p.x) / hx, Math.abs(p.y - yMid) / Math.max(hy, 0.05));
    }
    D = THREE.MathUtils.clamp(D * r, controls.minDistance, controls.maxDistance);
  }
  camera.position.copy(VIEW_DIR).multiplyScalar(D).add(TGT0);
  controls.target.copy(TGT0);
  controls.update();
}

function textTexture(lines, opt = {}) {
  const w = opt.w || 1024, h = opt.h || 256;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (opt.bg) {
    ctx.fillStyle = opt.bg;
    const r = 36;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
    ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath(); ctx.fill();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gap = opt.gap || h / (lines.length + 0.4);
  lines.forEach((ln, i) => {
    let size = ln.size || 64;
    const font = s => `${ln.weight || 600} ${s}px "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif`;
    ctx.font = font(size);
    while (size > 18 && ctx.measureText(ln.t).width > w - 2 * (opt.pad || 30)) { size -= 2; ctx.font = font(size); }
    ctx.fillStyle = ln.color || '#eaf1f8';
    ctx.fillText(ln.t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// ετικέτα με ύψος σε μέτρα, πάντα στραμμένη προς τον θεατή και ορατή μπροστά από τα άλλα αντικείμενα
function labelTexture(text, color) {
  const size = 120, pad = 40;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const font = `700 ${size}px "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif`;
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 2 * pad, h = Math.ceil(size * 1.5);
  cv.width = w; cv.height = h;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 20;
  ctx.strokeStyle = 'rgba(14,20,32,.88)';
  ctx.strokeText(text, w / 2, h / 2);
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return { tex, aspect: w / h };
}
function label(text, color, height) {
  const { tex, aspect } = labelTexture(text, color);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  sp.renderOrder = 20;
  sp.userData = { text, color, h: height, aspect, k: 1, big: true };
  sp.scale.set(height * aspect, height, 1);
  return sp;
}
function fitLabel(sp) { const u = sp.userData; sp.scale.set(u.h * u.k * u.aspect, u.h * u.k, 1); }

// ------------------------------------------------------------------ βοηθητικά γεωμετρίας
const UP = new THREE.Vector3(0, 1, 0);
function bar(a, b, r, mat) {               // κύλινδρος από το a στο b
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10, 1), mat);
  placeBar(m, a, b);
  return m;
}
function placeBar(m, a, b) {
  const len = Math.max(a.distanceTo(b), 1e-6);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
  m.scale.set(1, len, 1);
}
function dashed(r, mat, n = 14) {          // διακεκομμένη γραμμή από n τμήματα
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) g.add(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 8, 1), mat));
  g.userData.n = n;
  return g;
}
function placeDashed(g, a, b) {
  const n = g.userData.n;
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 0.55) / n;
    placeBar(g.children[i], a.clone().lerp(b, t0), a.clone().lerp(b, t1));
  }
}
function tube(pts, r, mat, seg) {
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg || Math.max(8, pts.length * 2), r, 8, false), mat);
}
function sfaira(c, r, mat, seg = 16) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(6, Math.round(seg * 0.6))), mat);
  m.position.copy(c);
  return m;
}
function kouti(sx, sy, sz, c, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  m.position.copy(c);
  return m;
}
function parabola(v, x0, x1, n = 80) {     // σημεία της τροχιάς για x από x0 έως x1
  const pts = [];
  for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; pts.push(V(x, v.h(x), 0)); }
  return pts;
}

for (const r of [[0, 0, 0], [Math.PI / 2, 0, 0], [0, Math.PI / 2, 0]]) {
  const s = new THREE.Mesh(new THREE.TorusGeometry(R_MPALA * 1.004, 0.004, 4, 48), M.seam);
  s.rotation.set(...r);
  mpala.add(s);
}
world.add(mpala);
const skia = new THREE.Mesh(new THREE.CircleGeometry(R_MPALA, 24), M.shadow);
skia.rotation.x = -Math.PI / 2;
world.add(skia);

// ------------------------------------------------------------------ πίνακας με τις τιμές (στο XR)
// Αδιαφανής πίνακας: κρύβει ό,τι βρίσκεται πίσω του. Έχει την ίδια σειρά σχεδίασης με τις ετικέτες, οπότε σχεδιάζονται
// με βάση την απόσταση (οι ετικέτες πίσω από τον πίνακα πρώτα, όσες είναι μπροστά του μετά), και με έλεγχο βάθους,
// ώστε ένα στερεό αντικείμενο μπροστά από τον πίνακα να τον καλύπτει.
const panel = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.66), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, depthTest: true, side: THREE.DoubleSide }));
panel.renderOrder = 20;
panel.visible = false;
scene.add(panel);
let panelKey = '';
function setPanel(lines) {
  const key = JSON.stringify(lines);
  if (key === panelKey) return;
  panelKey = key;
  if (panel.material.map) panel.material.map.dispose();
  panel.material.map = textTexture(lines.map((t, i) => ({ t, size: i ? 56 : 66, color: i ? '#eaf1f8' : ACC, weight: i ? 600 : 700 })),
    { w: 1280, h: 352, bg: 'rgb(14,20,32)', gap: 100, pad: 80 });          // κάθε γραμμή χωρά με περιθώριο 80 px δεξιά και αριστερά
  panel.material.needsUpdate = true;
}

// ------------------------------------------------------------------ κατάσταση
let current = 0, tLoop = 0;
function select(k) {
  current = (k + HINTS.length) % HINTS.length;
  document.querySelectorAll('#segS button').forEach(b => b.classList.toggle('on', +b.dataset.k === current));
  hintEl.innerHTML = hintHTML(current);
  setPanel(PANELS[current]);
  perState.forEach(o => { o.visible = o.userData.st.includes(current); });
  tubes[0].material = current === 4 ? dimA : tubeMat[0];
  tLoop = 0;                               // η μπάλα ξαναρχίζει από το σημείο ρίψης
}
document.querySelectorAll('#segS button').forEach(b => b.onclick = () => select(+b.dataset.k));
function next() { select(current + 1); }
{
  const q = parseInt(new URLSearchParams(location.search).get('k'), 10);
  select(Number.isFinite(q) && q >= 0 && q < HINTS.length ? q : 0);
}
layoutView();
homeView();
const pB = new THREE.Vector3();
function animate(dt) {
  const v = VOLES[STATE_VOLI[current]];
  tLoop = (tLoop + dt) % v.kyklos;
  const ptisi = thesiMpalas(v, tLoop, pB);
  mpala.position.copy(pB);
  mpala.rotation.z = 4 * Math.PI * ptisi;  // ανάποδη περιστροφή, 2 στροφές το δευτερόλεπτο
  const k = THREE.MathUtils.clamp(1 - pB.y / 6, 0.35, 1);
  skia.position.set(pB.x, 0.004, 0);
  skia.scale.setScalar(k);
  skia.material.opacity = 0.35 * k;
}

// ------------------------------------------------------------------ XR
const btnAR = document.getElementById('btnAR'), btnVR = document.getElementById('btnVR');
const note = document.getElementById('note');
let placed = false, floorRef = true, xrKind = '';
async function checkXR() {
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
  }
}
checkXR().then(() => { layoutView(); if (!touched) homeView(); });

// ετικέτες: στο AR (1:20) μεγαλώνουν λίγο ώστε να διαβάζονται, σε κατακόρυφη οθόνη επίσης
function setLabelScale(k) {
  world.traverse(o => { if (o.isSprite && o.userData.big) { o.userData.k = k; fitLabel(o); } });
}

function resetView() {
  camera.near = 0.05;
  camera.far = 400;
  root.position.set(0, 0, 0);
  root.quaternion.identity();
  root.scale.setScalar(1);
  vrWorld.visible = false;
  panel.visible = false;
  scene.attach(panel);
  scene.background = null;
  layoutView();
  homeView();
  touched = false;
}

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    // τα όρια βάθους της κάμερας περνούν στη συνεδρία XR: στο AR η σκηνή είναι 0,85 m μπροστά, στο VR σε φυσικό μέγεθος
    camera.near = 0.02;
    camera.far = kind === 'immersive-vr' ? 500 : 50;
    camera.updateProjectionMatrix();
    await renderer.xr.setSession(session);
    placed = false;
    xrKind = kind;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    scene.background = opaque ? new THREE.Color(kind === 'immersive-vr' ? 0x9fc4e8 : 0x0e1420) : null;
    session.addEventListener('end', () => { xrKind = ''; resetView(); });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  // στο AR και στο VR ο άξονας +x του γηπέδου (από τον παίκτη προς το καλάθι) γίνεται η δεξιά πλευρά του χρήστη,
  // όπως στα σχήματα του φύλλου εργασίας: ο παίκτης αριστερά, το καλάθι δεξιά
  const right = new THREE.Vector3(-dir.z, 0, dir.x);
  const yaw = Math.atan2(-right.z, right.x);
  if (xrKind === 'immersive-vr') {
    // VR: φυσικό μέγεθος, ο χρήστης στέκεται στο πλάι του γηπέδου, 6 m από το επίπεδο των τροχιών και απέναντι
    // από το κέντρο του, και κοιτάζει κάθετα προς αυτό, οπότε βλέπει καθαρά τα δύο σημεία της τροχιάς στα 3 m
    root.scale.setScalar(1);
    root.rotation.set(0, yaw, 0);
    const off = STAND.clone().applyAxisAngle(UP, yaw);
    root.position.set(p.x - off.x, floorY, p.z - off.z);
    vrWorld.visible = scene.background !== null;
    vrWorld.position.set(0, floorY, 0);
    setLabelScale(1);
    // ο πίνακας 1,9 m μακριά, 57° αριστερά από τη διεύθυνση του βλέμματος και 0,3 m κάτω από τα μάτια, ώστε να μην
    // κρύβει την τροχιά, το καλάθι ή τον παίκτη (η πλευρά του προς το γήπεδο είναι στις 33,9°, ο παίκτης ως τις 33,0°)
    const pd = dir.clone().applyAxisAngle(UP, rad(57));
    scene.add(panel);                        // ο πίνακας μένει σταθερός στον χώρο, όχι πάνω στη σκηνή
    panel.position.set(p.x + pd.x * 1.9, p.y - 0.3, p.z + pd.z * 1.9);
    panel.scale.setScalar(0.65);
  } else {
    // AR: σκηνή 1:20 στο θρανίο, 0,85 m μπροστά και 0,32 m κάτω από τα μάτια, με το γήπεδο από τα αριστερά προς τα δεξιά
    root.scale.setScalar(AR_SCALE);
    root.rotation.set(0, yaw, 0);
    const c = SCENE_C.clone().multiplyScalar(AR_SCALE).applyAxisAngle(UP, yaw);
    root.position.set(p.x + dir.x * 0.85 - c.x, p.y - 0.32, p.z + dir.z * 0.85 - c.z);
    setLabelScale(1.25);
    root.add(panel);
    panel.position.set(SCENE_C.x, 5.7, 0);
    panel.scale.setScalar(3.2);
  }
  panel.visible = true;
  placed = true;
}

// χειριστήρια: σύντομο πάτημα = επόμενη κατάσταση, και στο AR παρατεταμένο πάτημα πάνω στη σκηνή = μετακίνηση
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    if (xrKind !== 'immersive-ar') return;
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    const targets = [];
    world.traverseVisible(o => { if (o.isMesh && !o.material.userData.top) targets.push(o); });
    if (ray.intersectObjects(targets, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    if (ctl.userData.grab) { scene.attach(root); ctl.userData.grab = false; }
    if (performance.now() - ctl.userData.t0 < 280) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [makeController(0), makeController(1)];

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (frame && !placed) placeInFront(frame);
  animate(dt);
  if (renderer.xr.isPresenting) {
    // ο πίνακας γυρίζει πάντα προς τον χρήστη
    const eye = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
    const pw = new THREE.Vector3();
    panel.getWorldPosition(pw);
    const yawP = Math.atan2(eye.x - pw.x, eye.z - pw.z);
    const parentQ = new THREE.Quaternion();
    if (panel.parent) panel.parent.getWorldQuaternion(parentQ);
    panel.quaternion.copy(parentQ.invert()).multiply(new THREE.Quaternion().setFromAxisAngle(UP, yawP));
    if (xrKind === 'immersive-ar') {
      // ο μοχλός του χειριστηρίου μεγαλώνει ή μικραίνει τη σκηνή
      ctls.forEach(c => {
        const gp = c.userData.source && c.userData.source.gamepad;
        if (gp && gp.axes && gp.axes.length) {
          const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
          if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * dt * 0.9), AR_SCALE * 0.5, AR_SCALE * 4));
        }
      });
    }
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
});
</script>
</body>
