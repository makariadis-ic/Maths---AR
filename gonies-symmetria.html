<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Γωνίες και συμμετρία — XR</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#3b82f6}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px}
  #bar h1{font-size:15px;margin:0;font-weight:640}
  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto}
  #dock{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:980px}
  .seg button{font:600 13px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;cursor:pointer}
  .seg button.on{color:#08131a;background:var(--acc);border-color:transparent}
  .ctl{display:flex;align-items:center;gap:12px;background:rgba(14,20,32,.9);border:1px solid var(--line);
    border-radius:10px;padding:8px 14px}
  .ctl button{font:600 13px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  .ctl label{font-size:12.5px;color:var(--dim);min-width:150px}
  .ctl input[type=range]{width:min(46vw,320px);accent-color:var(--acc)}
  .xr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .xr button{font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:#2dd4bf;
    border:none;border-radius:12px;padding:14px 22px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer;
    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:820px;text-align:center;line-height:1.5}
  #calc{font-size:19px;font-weight:700;text-align:center;line-height:1.35;text-shadow:0 2px 8px #000}
  #calc small{display:block;font-size:14px;font-weight:600}
  #hint b{color:var(--ink)}
  #note{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;max-width:640px;text-align:center;line-height:1.55;display:none}
  #fallback{display:none;position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:min(92vw,74vh);height:auto}
  .nogl #fallback{display:block} .nogl #c,.nogl .seg,.nogl .ctl,.nogl #hint{display:none}
  @media (max-width:560px){ .seg button{padding:8px 9px;font-size:12px} #hint{font-size:11.5px} .ctl label{min-width:110px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="fallback" viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">
<polygon points="40,170 130,170 90,60" fill="#3b82f6" fill-opacity="0.35" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="220,170 130,170 170,60" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="130" y1="30" x2="130" y2="195" stroke="#22c55e" stroke-width="3" stroke-dasharray="7 5"/>
<text x="150" y="212" font-size="14" font-weight="700" text-anchor="middle" fill="#eaf1f8">Συμμετρία ως προς άξονα</text>
</svg>
<div id="bar">
  <a href="index.html">‹ Πίσω</a>
  <h1>Γωνίες και συμμετρία</h1>
  <span class="lv">Α΄ Γυμνασίου, § 1.6 έως § 2.2</span>
</div>
<div id="dock">
  <div class="seg" id="segS"></div>
  <div class="ctl">
    <button id="btnPlay">Παύση</button>
    <label id="lblV"></label>
    <input type="range" id="rngV" min="0" max="1" step="1" value="0">
  </div>
  <div id="calc"></div>
  <div id="hint"></div>
  <div class="xr">
    <button id="btnAR">Είσοδος σε AR</button>
    <button id="btnVR" class="vr">Είσοδος σε VR</button>
  </div>
  <div id="note"></div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
// Σενάριο 30 «Γωνίες και συμμετρία στο Κέντρο Καινοτομίας» (Α΄ Γυμνασίου, § 1.5 έως § 2.2 και § 3.2).
// Κέντρο Καινοτομίας Θεσσαλίας. Κάθε κατάσταση έχει μία παράμετρο v που κινείται μόνη της ή ρυθμίζεται με τον ολισθητή.
// Το σχήμα βρίσκεται στο οριζόντιο επίπεδο του θρανίου: το σημείο (x, y) του σχεδίου γίνεται (x, 0, −y) στον χώρο.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const UNIT = 0.13;                      // μέτρα ανά μονάδα του σχεδίου
const DEG = Math.PI / 180;
const C = { blue: 0x3b82f6, orange: 0xf59e0b, green: 0x22c55e, red: 0xef4444, purple: 0xa855f7, teal: 0x2dd4bf, grey: 0x94a3b8, white: 0xe2e8f0, dark: 0x1e293b };
const CSS = { blue: '#3b82f6', orange: '#f59e0b', green: '#22c55e', red: '#ef4444', purple: '#a855f7', teal: '#2dd4bf', grey: '#94a3b8', white: '#eaf1f8' };
const fmt = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toLocaleString('el-GR', { minimumFractionDigits: 0, maximumFractionDigits: d });

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 60);
const CAM0 = new THREE.Vector3(0.0, 0.95, 0.8), TGT0 = new THREE.Vector3(0, 0.0, 0.2);
camera.position.copy(CAM0);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(TGT0);
controls.enableDamping = true;
controls.minDistance = 0.25;
controls.maxDistance = 2.5;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.8, 1.6, 1.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.5);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// δάπεδο και θρανίο μόνο σε αδιαφανή λειτουργία (VR)
const room = new THREE.Group();
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2;
  room.add(floor);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.position.y = 0.002;
  room.add(grid);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.8), new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 }));
  desk.name = 'desk';
  room.add(desk);
}
// το επίπεδο του θρανίου στην προβολή 3D (λεπτό πλέγμα)
const tableGrid = new THREE.GridHelper(8, 32, 0x2f3d57, 0x1f2a40);
tableGrid.position.y = -0.003;
scene.add(tableGrid);

const root = new THREE.Group();          // ό,τι μετακινείται στο XR
scene.add(root);
const world = new THREE.Group();         // μονάδα = 1 του σχεδίου
world.scale.setScalar(UNIT);
root.add(world);

// ------------------------------------------------------------------ βοηθητικά σχήματα
const P = (x, y, h = 0) => new THREE.Vector3(x, h, -y);       // σημείο του σχεδίου στον χώρο
const Y = new THREE.Vector3(0, 1, 0);
const matCache = new Map();
function mat(color, opacity = 1, double = false, emis = 0.22) {
  const key = [color, opacity, double, emis].join();
  if (!matCache.has(key)) {
    matCache.set(key, new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: emis, roughness: 0.55, transparent: opacity < 1, opacity,
      side: double ? THREE.DoubleSide : THREE.FrontSide, depthWrite: opacity >= 1, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
    }));
  }
  return matCache.get(key);
}
const geoCache = new Map();
function cyl(r) {
  if (!geoCache.has(r)) geoCache.set(r, new THREE.CylinderGeometry(r, r, 1, 10));
  return geoCache.get(r);
}
function bar(a, b, r, color, opacity = 1) {
  const m = new THREE.Mesh(cyl(r), mat(color, opacity, false, 0.3));
  setBar(m, a, b);
  return m;
}
function setBar(m, a, b) {
  const d = b.clone().sub(a), L = d.length();
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.visible = L > 1e-5;
  if (L > 1e-5) { m.scale.set(1, L, 1); m.quaternion.setFromUnitVectors(Y, d.multiplyScalar(1 / L)); }
}
function dashed(a, b, r, color, n = 9) {          // διακεκομμένη γραμμή
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) {
    const s = a.clone().lerp(b, (i + 0.15) / n), e = a.clone().lerp(b, (i + 0.65) / n);
    g.add(bar(s, e, r, color));
  }
  return g;
}
function ball(p, r, color) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat(color, 1, false, 0.35));
  m.position.copy(p);
  return m;
}
// επίπεδο πολύγωνο στο θρανίο
function polyMesh(pts, color, opacity = 0.9, h = 0, double = true) {
  const sh = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat(color, opacity, double));
  m.rotation.x = -Math.PI / 2;
  m.position.y = h;
  return m;
}
function polyEdges(pts, r, color, h = 0) {
  const g = new THREE.Group();
  for (let i = 0; i < pts.length; i++) g.add(bar(P(...pts[i], h), P(...pts[(i + 1) % pts.length], h), r, color));
  return g;
}
// τομέας κύκλου (γωνίες σε ακτίνια, αριστερόστροφα στο σχέδιο)
function sectorGeo(r, a0, a1) {
  const sh = new THREE.Shape();
  sh.moveTo(0, 0);
  sh.absarc(0, 0, r, a0, a1, false);
  sh.lineTo(0, 0);
  return new THREE.ShapeGeometry(sh, 48);
}
function sectorMesh(r, a0, a1, color, opacity = 0.55, h = 0) {
  const m = new THREE.Mesh(sectorGeo(r, a0, a1), mat(color, opacity, true));
  m.rotation.x = -Math.PI / 2;
  m.position.y = h;
  m.userData.r = r;
  return m;
}
function setSector(m, a0, a1) {
  m.geometry.dispose();
  m.geometry = sectorGeo(m.userData.r, a0, a1);
  m.visible = a1 - a0 > 1e-4;
}
// τόξο ως σωλήνας
function arcMesh(r, a0, a1, color, tube = 0.035, h = 0) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 64, Math.max(a1 - a0, 1e-3)), mat(color, 1, false, 0.3));
  m.rotation.set(-Math.PI / 2, 0, 0);
  m.userData = { r, tube };
  const holder = new THREE.Group();
  holder.add(m);
  holder.position.y = h;
  holder.userData.m = m;
  m.rotation.z = a0;
  return holder;
}
function setArc(holder, a0, a1) {
  const m = holder.userData.m;
  m.geometry.dispose();
  m.geometry = new THREE.TorusGeometry(m.userData.r, m.userData.tube, 8, Math.max(8, Math.ceil(Math.abs(a1 - a0) / (6 * DEG))), Math.max(a1 - a0, 1e-3));
  m.rotation.z = a0;
  holder.visible = a1 - a0 > 1e-4;
}
function ringMesh(r, tube, color) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 96), mat(color, 1, false, 0.25));
  m.rotation.x = -Math.PI / 2;
  return m;
}
// κείμενα σε υφή
function textTexture(lines, opt = {}) {
  const w = opt.w || 1024, h = opt.h || 256;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (opt.bg) {
    ctx.fillStyle = opt.bg;
    const r = 36;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
    ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath(); ctx.fill();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gap = opt.gap || h / (lines.length + 0.4);
  lines.forEach((ln, i) => {
    let size = ln.size || 64;
    const font = s => `${ln.weight || 600} ${s}px "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif`;
    ctx.font = font(size);
    while (size > 18 && ctx.measureText(ln.t).width > w - 80) { size -= 2; ctx.font = font(size); }
    ctx.fillStyle = ln.color || '#eaf1f8';
    ctx.fillText(ln.t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
function label(text, color, size = 0.3) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTexture([{ t: text, size: 170, color, weight: 700 }], { w: 512, h: 256 }), transparent: true, depthWrite: false, depthTest: false }));
  sp.scale.set(size * 2, size, 1);
  sp.renderOrder = 6;
  sp.userData = { text, color, size };
  return sp;
}
function setLabel(sp, text, color) {
  if (sp.userData.text === text && (!color || sp.userData.color === color)) return;
  sp.userData.text = text;
  if (color) sp.userData.color = color;
  sp.material.map.dispose();
  sp.material.map = textTexture([{ t: text, size: 170, color: sp.userData.color, weight: 700 }], { w: 512, h: 256 });
  sp.material.needsUpdate = true;
}

// ------------------------------------------------------------------ βοηθητικά για τις καταστάσεις
const polar = (r, deg) => [r * Math.cos(deg * DEG), r * Math.sin(deg * DEG)];
function reflectPt(p, phiDeg) {            // ανάκλαση του σημείου ως προς ευθεία από την αρχή με γωνία φ
  const c = Math.cos(2 * phiDeg * DEG), s = Math.sin(2 * phiDeg * DEG);
  return [p[0] * c + p[1] * s, p[0] * s - p[1] * c];
}
function sameSet(a, b) {
  return a.length === b.length && a.every(p => b.some(q => Math.hypot(p[0] - q[0], p[1] - q[1]) < 1e-3));
}
const lerp = (a, b, t) => a + (b - a) * t;

// ------------------------------------------------------------------ οι καταστάσεις
const STATES = [];
function addState(s) { s.group = new THREE.Group(); s.group.visible = false; world.add(s.group); STATES.push(s); return s; }

// 1. § 1.6 Είδη γωνιών
{
  const s = addState({ name: 'Είδη γωνιών', range: [0, 360, 1], stops: [0, 45, 90, 135, 180, 270, 360], hold: 1.5, move: 1.6, v0: 60, unit: '°', pname: 'Γωνία ω' });
  const g = s.group, R = 1.9;
  g.add(sectorMesh(R, 0, Math.PI / 2, C.blue, 0.2, -0.004));
  g.add(sectorMesh(R, Math.PI / 2, Math.PI, C.orange, 0.2, -0.004));
  g.add(sectorMesh(R, Math.PI, 2 * Math.PI, C.purple, 0.14, -0.004));
  g.add(bar(P(0, 0, 0.01), P(R + 0.25, 0, 0.01), 0.04, C.white));
  const sec = sectorMesh(0.8, 0, 1, C.blue, 0.65, 0.006);
  g.add(sec);
  const mv = new THREE.Group();
  mv.position.y = 0.012;
  mv.add(bar(new THREE.Vector3(0, 0, 0), new THREE.Vector3(R + 0.25, 0, 0), 0.05, C.blue));
  g.add(mv);
  const rt = new THREE.Group();     // σύμβολο ορθής γωνίας
  rt.add(polyEdges([[0.42, 0], [0.42, 0.42], [0, 0.42]].map(p => p), 0.02, C.red, 0.02).children[0].clone());
  const rtA = bar(P(0.42, 0, 0.02), P(0.42, 0.42, 0.02), 0.025, C.red), rtB = bar(P(0.42, 0.42, 0.02), P(0, 0.42, 0.02), 0.025, C.red);
  rt.clear(); rt.add(rtA, rtB);
  g.add(rt);
  g.add(ball(P(0, 0, 0.02), 0.07, C.white));
  for (const [t, d] of [['0°', 0], ['90°', 90], ['180°', 180], ['270°', 270]]) {
    const sp = label(t, CSS.grey, 0.32);
    sp.position.copy(P(...polar(R + 0.55, d), 0.02));
    g.add(sp);
  }
  const CAT = (w) => w === 0 ? ['Μηδενική γωνία', CSS.grey, C.grey, 'Μηδενική γωνία: οι δύο πλευρές συμπίπτουν (ω = 0°).']
    : w < 90 ? ['Οξεία γωνία', CSS.blue, C.blue, 'Οξεία γωνία: μικρότερη από 90°. Είναι κυρτή.']
    : w === 90 ? ['Ορθή γωνία', CSS.red, C.red, 'Ορθή γωνία: ακριβώς 90°. Οι πλευρές της είναι κάθετες.']
    : w < 180 ? ['Αμβλεία γωνία', CSS.orange, C.orange, 'Αμβλεία γωνία: μεταξύ 90° και 180°. Είναι κυρτή.']
    : w === 180 ? ['Ευθεία γωνία', CSS.teal, C.teal, 'Ευθεία γωνία: ακριβώς 180°. Οι πλευρές της είναι αντικείμενες ημιευθείες.']
    : w < 360 ? ['Μη κυρτή γωνία', CSS.purple, C.purple, 'Μη κυρτή γωνία: μεγαλύτερη από 180° και μικρότερη από 360°.']
    : ['Πλήρης γωνία', CSS.grey, C.grey, 'Πλήρης γωνία: ακριβώς 360°. Η πλευρά κάνει μία ολόκληρη στροφή.'];
  let lastW = -1;
  s.set = (v) => {
    const w = Math.round(v), [name, css, col, hint] = CAT(w);
    mv.rotation.y = w * DEG;
    if (w !== lastW) { setSector(sec, 0, w * DEG); lastW = w; }
    sec.material = mat(col, 0.6, true);
    mv.children[0].material = mat(col, 1, false, 0.3);
    rt.visible = w === 90;
    return { lines: [{ t: 'ω = ' + w + '°', size: 78, weight: 700 }, { t: name, size: 66, color: css }], hint };
  };
}

// 2. § 1.8 Συμπληρωματικές και παραπληρωματικές
{
  const s = addState({ name: 'Συμπληρωματικές και παραπληρωματικές', range: [1, 179, 1], stops: [20, 35, 60, 90, 120, 150], hold: 1.6, move: 1.3, v0: 35, pname: 'Γωνία α' });
  const g = s.group, L = 1.6, O1 = [-2.3, -0.4], O2 = [1.2, -0.4];
  const at = (O, x, y, h = 0.01) => P(O[0] + x, O[1] + y, h);
  // συμπληρωματικές
  g.add(bar(at(O1, 0, 0), at(O1, L, 0), 0.045, C.white));
  const cDash = dashed(at(O1, 0, 0), at(O1, 0, L), 0.03, C.grey, 8); g.add(cDash);
  const cA = sectorMesh(0.9, 0, 1, C.blue, 0.65, 0.004), cB = sectorMesh(0.9, 0, 1, C.orange, 0.65, 0.004);
  cA.position.x = O1[0]; cA.position.z = -O1[1]; cB.position.x = O1[0]; cB.position.z = -O1[1];
  g.add(cA, cB);
  const cRay = new THREE.Group(); cRay.position.set(O1[0], 0.012, -O1[1]);
  cRay.add(bar(new THREE.Vector3(), new THREE.Vector3(L, 0, 0), 0.045, C.blue)); g.add(cRay);
  // παραπληρωματικές
  g.add(bar(at(O2, -L, 0), at(O2, L, 0), 0.045, C.white));
  const sA = sectorMesh(0.9, 0, 1, C.blue, 0.65, 0.004), sB = sectorMesh(0.9, 0, 1, C.orange, 0.65, 0.004);
  sA.position.x = O2[0]; sA.position.z = -O2[1]; sB.position.x = O2[0]; sB.position.z = -O2[1];
  g.add(sA, sB);

  const axisLine = new THREE.Group(); g.add(axisLine);

  const names = def.names || [];

  const vl2 = poly.map((p, i) => { const sp = label(names[i] ? names[i] + '΄' : '', CSS.orange, 0.34); g.add(sp); return sp; });

// 11. § 3.2 Το άθροισμα των γωνιών τριγώνου

  const tri = [A, B, Cc];
  g.add(polyMesh(tri, C.white, 0.18, 0), polyEdges(tri, 0.035, C.white, 0.006));
  const ang = (p, q, r) => { const u = [q[0] - p[0], q[1] - p[1]], w = [r[0] - p[0], r[1] - p[1]]; return Math.acos((u[0] * w[0] + u[1] * w[1]) / Math.hypot(...u) / Math.hypot(...w)); };
  const dirOf = (p, q) => Math.atan2(q[1] - p[1], q[0] - p[0]);
  // τρίγωνο ΑΒΓ αριστερόστροφα: στις κορυφές οι τομείς ξεκινούν από: Α → ΑΒ, Β → ΒΓ, Γ → ΓΑ

  let start = 0;

    return {
      lines: [{ t: `α + β + γ = ${fmt(sumDeg, 0)}°`, size: 80, color: CSS.white, weight: 700 }, { t: t >= 0.99 ? 'Οι τρεις γωνίες σχηματίζουν ευθεία γωνία' : 'Μεταφέρω τις γωνίες στην ίδια κορυφή', size: 54, color: t >= 0.99 ? CSS.green : CSS.grey }],
      hint: '<b>Άθροισμα γωνιών τριγώνου.</b> Αν μεταφέρουμε τις τρεις γωνίες του τριγώνου σε κοινή κορυφή, σχηματίζουν μαζί μια ευθεία γωνία: α + β + γ = 180°. Αυτό ισχύει για κάθε τρίγωνο.'
    };
  };
}

// πίνακας με τον υπολογισμό, πάνω από το σχήμα
const panel = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 1.1), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide }));
panel.position.set(0, 3.0, -2.6);
panel.renderOrder = 8;
world.add(panel);
let panelKey = '';
function setPanel(lines) {
  const key = JSON.stringify(lines);
  if (key === panelKey) return;
  panelKey = key;
  if (panel.material.map) panel.material.map.dispose();
  panel.material.map = textTexture(lines, { w: 1280, h: 320, bg: 'rgba(14,20,32,.88)', gap: 110 });
  panel.material.needsUpdate = true;
}

// ------------------------------------------------------------------ κατάσταση και έλεγχοι
let cur = 0, v = 0, playing = true;
const auto = { i: 0, phase: 'hold', t: 0 };
const calcEl = document.getElementById('calc'), segS = document.getElementById('segS'), hintEl = document.getElementById('hint');
const btnPlay = document.getElementById('btnPlay'), lblV = document.getElementById('lblV'), rng = document.getElementById('rngV');
STATES.forEach((st, i) => {
  const b = document.createElement('button');
  b.textContent = st.name;
  b.onclick = () => select(i);
  segS.appendChild(b);
});
const ACC = [C.blue, C.blue, C.blue, C.blue, C.green, C.green, C.green, C.green, C.green, C.teal, C.white].map(c => '#' + c.toString(16).padStart(6, '0'));
function select(i) {
  cur = (i + STATES.length) % STATES.length;
  const st = STATES[cur];
  STATES.forEach((x, j) => { x.group.visible = j === cur; });
  segS.querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === cur));
  document.documentElement.style.setProperty('--acc', ACC[cur]);
  rng.min = st.range[0]; rng.max = st.range[1]; rng.step = st.range[2];
  v = st.v0 !== undefined ? st.v0 : st.range[0];
  auto.i = Math.max(0, st.stops.findIndex(x => Math.abs(x - v) < 1e-6)); auto.phase = 'hold'; auto.t = 0;
  if (st.vertical) { camera.position.set(0.15, 0.45, 1.0); controls.target.set(0, 0.12, 0); } else { camera.position.copy(CAM0); controls.target.copy(TGT0); }
  controls.update();
  apply();
}
function apply() {
  const st = STATES[cur];
  const info = st.set(v);
  setPanel(info.lines);
  calcEl.innerHTML = info.lines.map((l, i) => i ? `<small style="color:${l.color || '#eaf1f8'}">${l.t}</small>` : `<span style="color:${l.color || '#eaf1f8'}">${l.t}</span>`).join('');
  hintEl.innerHTML = info.hint;
  rng.value = v;
  lblV.textContent = st.fold ? `${st.pname}: ${Math.round(v * 100)} %` : `${st.pname}: ${st.name === 'Ο καθρέφτης' ? fmt(v) : Math.round(v) + '°'}`;
  const vert = !!st.vertical;
  tableGrid.visible = !vert;
  panel.position.set(0, vert ? 3.6 : 0.6, vert ? 0 : -2.7);
  panel.userData.vert = vert;
}
function setPlaying(p) { playing = p; btnPlay.textContent = p ? 'Παύση' : 'Αναπαραγωγή'; }
btnPlay.onclick = () => setPlaying(!playing);
rng.oninput = () => { setPlaying(false); v = parseFloat(rng.value); apply(); };
const ease = t => t * t * (3 - 2 * t);
function stepAuto(dt) {
  const st = STATES[cur], n = st.stops.length;
  auto.t += dt;
  if (auto.phase === 'hold') {
    v = st.stops[auto.i];
    if (auto.t >= st.hold) { auto.phase = 'move'; auto.t = 0; }
  } else {
    const from = st.stops[auto.i], j = (auto.i + 1) % n, to = st.stops[j];
    const wrap = j === 0;                                   // επιστροφή από το τελευταίο στο πρώτο στάδιο
    const dur = wrap ? 0.9 : st.move;
    const k = Math.min(1, auto.t / dur);
    v = lerp(from, to, ease(k));
    if (k >= 1) { auto.i = j; auto.phase = 'hold'; auto.t = 0; if (wrap && st.cycle) st.cycle(); }
  }
  apply();
}
select(0);
window.mathsAR = { select, setParam: x => { setPlaying(false); v = x; apply(); }, states: STATES.length, cycle: () => STATES[cur].cycle && STATES[cur].cycle() };

// ------------------------------------------------------------------ XR
const btnAR = document.getElementById('btnAR'), btnVR = document.getElementById('btnVR');
const note = document.getElementById('note');
let placed = false, floorRef = true;
async function checkXR() {
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
  }
}
checkXR();

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    tableGrid.visible = false;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    session.addEventListener('end', () => {
      room.visible = false;
      scene.background = null;
      root.position.set(0, 0, 0);
      root.quaternion.identity();
      root.scale.setScalar(1);
      camera.position.copy(CAM0);
      controls.target.copy(TGT0);
      controls.update();
      apply();
    });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

// στην πρώτη εικόνα του XR, το σχήμα τοποθετείται 70 cm μπροστά από τον χρήστη, λίγο κάτω από τα μάτια
function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * 0.7, p.y - 0.42, p.z + dir.z * 0.7);
  root.rotation.set(0, yaw, 0);
  root.scale.setScalar(1.3);
  const desk = room.getObjectByName('desk');
  desk.position.set(root.position.x, root.position.y - 0.021, root.position.z);
  desk.rotation.y = yaw;
  room.children[0].position.y = floorRef ? 0 : p.y - 1.5;
  placed = true;
  select(cur);
}

// χειριστήρια: σύντομο πάτημα = επόμενη κατάσταση, παρατεταμένο πάτημα πάνω στο σχήμα = μετακίνηση,
// πλευρικό κουμπί = παύση ή συνέχεια, οριζόντια κίνηση του μοχλού (σε παύση) = αλλαγή της παραμέτρου, κάθετη = μέγεθος
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    const targets = [];
    STATES[cur].group.traverse(o => { if (o.isMesh) targets.push(o); });
    if (ray.intersectObjects(targets, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    if (ctl.userData.grab) { scene.attach(root); ctl.userData.grab = false; }
    if (performance.now() - ctl.userData.t0 < 280) select(cur + 1);
  });
  ctl.addEventListener('squeezestart', () => setPlaying(!playing));
  scene.add(ctl);
  return ctl;
}
const ctls = [makeController(0), makeController(1)];

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (frame && !placed) placeInFront(frame);
  if (playing) stepAuto(dt);
  if (renderer.xr.isPresenting) {
    panel.visible = true;
    // ο πίνακας γυρίζει πάντα προς τον χρήστη
    const eye = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
    const local = world.worldToLocal(eye.clone());
    panel.rotation.set(0, Math.atan2(local.x - panel.position.x, local.z - panel.position.z), 0);
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0], ay = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ay) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ay * dt * 0.9), 0.5, 4));
        if (!playing && Math.abs(ax) > 0.2) {
          const st = STATES[cur], span = st.range[1] - st.range[0];
          v = THREE.MathUtils.clamp(v + ax * dt * span * 0.4, st.range[0], st.range[1]);
          apply();
        }
      }
    });
  } else {
    panel.visible = false;
    controls.update();
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
