<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Τρίγωνα και τετράπλευρα — WebXR</title>
<style>
  :root{--bg:#0b0f18;--ink:#eaf1f8;--dim:#93a6bb;--line:rgba(255,255,255,.12);--acc:#2dd4bf}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Roboto,"Noto Sans",sans-serif;overflow:hidden}
  canvas{display:block}
  #overlay{position:fixed;inset:0;pointer-events:none}
  #ui{pointer-events:auto;position:absolute;top:12px;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));
    background:rgba(11,15,24,.88);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow:auto;
    display:flex;flex-direction:column;gap:10px}
  @media (max-width:820px) and (orientation:portrait){
    #ui{top:auto;left:8px;right:8px;width:auto;bottom:8px;max-height:46vh}
  }
  .nav{display:flex;align-items:center;gap:10px}
  .nav button{flex:0 0 44px;height:44px;font-size:22px}
  .nav .t{flex:1;min-width:0}
  #ttl{font-size:18px;font-weight:650;line-height:1.25}
  #para{font-size:12.5px;color:var(--dim);margin-top:3px}
  #kidx{font-size:12px;color:var(--dim)}
  button{font:600 14px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  button.main{background:var(--acc);color:#08131a;border-color:transparent}
  button:disabled{opacity:.4;cursor:default}
  .prm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:14px}
  .prm input{grid-column:1 / 3;width:100%;accent-color:#E36C09}
  .prm .v{font-weight:650;color:#F0A35E}
  #info{font-size:15px;line-height:1.55;border-top:1px solid var(--line);padding-top:8px}
  #info div{margin:2px 0}
  .xr{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:10px}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);pointer-events:none;
    background:rgba(11,15,24,.82);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;display:none}
  a{color:#5ed0c0}
  .back{font-size:13px}
  #msg{font-size:12.5px;color:var(--dim)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="overlay">
  <div id="ui">
    <div class="nav">
      <button id="prev" title="Προηγούμενη σκηνή">‹</button>
      <div class="t"><div id="ttl"></div><div id="para"></div><div id="kidx"></div></div>
      <button id="next" title="Επόμενη σκηνή">›</button>
    </div>
    <div id="params"></div>
    <div id="info"></div>
    <div class="xr">
      <button id="btnAR" class="main" disabled>Είσοδος σε AR</button>
      <button id="btnVR" disabled>Είσοδος σε VR</button>
      <button id="btnPlace" style="display:none">Επανατοποθέτηση</button>
      <button id="btnExit" style="display:none">Έξοδος</button>
    </div>
    <div id="msg"></div>
    <div class="back"><a href="index.html">‹ Πίσω στον πίνακα</a></div>
  </div>
  <div id="hint"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------------------------ χρώματα (ίδια με τις εφαρμογές GeoGebra)
const COL = { red:'#C0392B', blue:'#1F6FB2', purple:'#7B4FA0', green:'#2E9E4F', orange:'#E36C09', teal:'#138D75',
  grey:'#7F8C8D', dark:'#1C2833', brown:'#8E5B2E', sand:'#C9A66B', road:'#566573', water:'#5DADE2', tree:'#239B56',
  gold:'#E8A32C', light:'#AEB8C4', board:'#E5E8E8', wall:'#AAB7B8', lamp:'#F4D03F' };
function light(hex, k = 0.38) { const c = new THREE.Color(hex); c.lerp(new THREE.Color('#ffffff'), k); return '#' + c.getHexString(); }
const UI = { red: light(COL.red), blue: light(COL.blue, .45), purple: light(COL.purple, .45), green: light(COL.green, .35),
  orange: light(COL.orange, .25), teal: light(COL.teal, .4), ink:'#eaf1f8', dim:'#93a6bb' };
const D2R = Math.PI / 180;
const fmt = (v, d = 2) => (v < 0 && Math.abs(v) >= 0.5 * Math.pow(10, -d) ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',');

// ------------------------------------------------------------------ βασικά τρισδιάστατα αντικείμενα (μονάδα: εκατοστό)
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const MAT = {};
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!MAT[key]) MAT[key] = opts.basic ? new THREE.MeshBasicMaterial({ color, transparent: !!opts.opacity, opacity: opts.opacity ?? 1, side: THREE.DoubleSide, depthWrite: !opts.opacity })
                                       : new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: .05, transparent: !!opts.opacity, opacity: opts.opacity ?? 1 });
  return MAT[key];
}
const UP = new THREE.Vector3(0, 1, 0);
function rod(g, a, b, color, r = 0.35) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  if (len < 1e-4) return null;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12), mat(color));
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  g.add(m); return m;
}
function dashed(g, a, b, color, r = 0.2, dash = 1.4, gap = 1.0) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length(); if (len < 1e-4) return;
  const u = d.clone().normalize();
  for (let s = 0; s < len; s += dash + gap) rod(g, a.clone().addScaledVector(u, s), a.clone().addScaledVector(u, Math.min(s + dash, len)), color, r);
}
function ball(g, p, color, r = 0.8) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat(color)); m.position.copy(p); g.add(m); return m; }
function box(g, w, h, d, color, pos, opts = {}) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, opts)); m.position.copy(pos); g.add(m); return m; }
// επίπεδο πολύγωνο σε επίπεδο z = σταθερό (σημεία στο xy)
function plate(g, pts, color, opacity = 0.25) {
  const sh = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, p.y)));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat(color, { basic: true, opacity }));
  m.position.z = pts[0].z; m.renderOrder = 1; g.add(m); return m;
}
// οριζόντιο πολύγωνο (σημεία στο xz) σε ύψος y
function hplate(g, pts, color, opacity = 0.3) {
  const sh = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, -p.z)));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), mat(color, { basic: true, opacity }));
  m.rotation.x = -Math.PI / 2; m.position.y = pts[0].y; m.renderOrder = 1; g.add(m); return m;
}
// τομέας γωνίας στο επίπεδο xy (κορυφή c, από τη γωνία a0 ως a1)
function arc(g, c, r, a0, a1, color, opacity = 0.35) {
  const s = new THREE.Mesh(new THREE.CircleGeometry(r, 40, a0, a1 - a0), mat(color, { basic: true, opacity }));
  s.position.copy(c); s.position.z += 0.05; s.renderOrder = 2; g.add(s);
  const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.18, 6, 40, a1 - a0), mat(color));
  t.position.copy(c); t.position.z += 0.05; t.rotation.z = a0; g.add(t);
  return s;
}
// τομέας γωνίας σε οριζόντιο επίπεδο (για κάτοψη)
function harc(g, c, r, a0, a1, color, opacity = 0.35) {
  const grp = new THREE.Group(); grp.position.copy(c); grp.rotation.x = -Math.PI / 2; g.add(grp);
  arc(grp, V(0, 0, 0), r, a0, a1, color, opacity);
}
// σημάδι ορθής γωνίας: κορυφή p, μοναδιαία u, w στο επίπεδο
function rightMark(g, p, u, w, s = 1.6, color = COL.dark) {
  const a = p.clone().addScaledVector(u, s), b = a.clone().addScaledVector(w, s), c = p.clone().addScaledVector(w, s);
  rod(g, a, b, color, 0.12); rod(g, b, c, color, 0.12);
}
// ετικέτα που κοιτάζει πάντα τον θεατή
const texCache = new Set();
const LS = 1.55; // συντελεστής μεγέθους ετικετών
function label(g, text, pos, color = COL.dark, size = 2.2, opts = {}) {
  const fs = 64, pad = 14, font = `${opts.bold === false ? 500 : 700} ${fs}px "Segoe UI",system-ui,Roboto,"Noto Sans",sans-serif`;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d');
  cx.font = font; const w = Math.ceil(cx.measureText(text).width) + pad * 2;
  cv.width = w; cv.height = fs + pad * 2;
  cx.font = font; cx.textBaseline = 'middle'; cx.lineJoin = 'round';
  cx.lineWidth = 12; cx.strokeStyle = 'rgba(255,255,255,0.92)'; cx.strokeText(text, pad, cv.height / 2);
  cx.fillStyle = color; cx.fillText(text, pad, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; texCache.add(tex);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  const h = size * LS; sp.scale.set(h * cv.width / cv.height, h, 1);
  sp.center.set(opts.ax ?? 0.5, opts.ay ?? 0.5);
  sp.position.copy(pos); sp.renderOrder = 10; g.add(sp); return sp;
}
function base(g, w = 60, d = 24) { box(g, w, 1, d, COL.board, V(0, 0.5, 0)); }
function disposeGroup(g) {
  g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.map) { o.material.map.dispose(); texCache.delete(o.material.map); o.material.dispose(); } });
  while (g.children.length) g.remove(g.children[0]);
}

// ------------------------------------------------------------------ οι σκηνές
// ------------------------------------------------------------------ βοηθητικά για επίπεδα σχήματα (στο επίπεδο xy, μονάδα cm)
const Q = (x, y, z = 0) => V(x, y + 1, z);
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angDeg = (p, v, q) => { const u = [p.x - v.x, p.y - v.y], w = [q.x - v.x, q.y - v.y]; return Math.acos(Math.max(-1, Math.min(1, (u[0] * w[0] + u[1] * w[1]) / (Math.hypot(...u) * Math.hypot(...w))))) / D2R; };
const mid2 = (a, b) => V((a.x + b.x) / 2, (a.y + b.y) / 2, a.z);
const unit2 = (a, b) => { const l = d2(a, b) || 1; return V((b.x - a.x) / l, (b.y - a.y) / l, 0); };
function angArc(g, v, p, q, r, col) { // τόξο της μικρής γωνίας pvq
  let a0 = Math.atan2(p.y - v.y, p.x - v.x), a1 = Math.atan2(q.y - v.y, q.x - v.x), d = a1 - a0;
  while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  if (d < 0) { a0 = a1; d = -d; }
  arc(g, v, r, a0, a0 + d, col);
}
function rmk(g, v, p, q, s = 1.6, col = COL.dark) { rightMark(g, V(v.x, v.y, v.z + 0.1), unit2(v, p), unit2(v, q), s, col); }
function outline(g, pts, cols, r = 0.45) { pts.forEach((p, i) => rod(g, p, pts[(i + 1) % pts.length], Array.isArray(cols) ? cols[i % cols.length] : cols, r)); }
function vtx(g, p, name, dx, dy, col = COL.blue) { ball(g, p, col, 0.75); label(g, name, V(p.x + dx, p.y + dy, p.z + 0.6), COL.dark, 2.2); }
function ringXY(g, c, r, col, th = 0.3, da = Math.PI * 2, a0 = 0) { const m = new THREE.Mesh(new THREE.TorusGeometry(r, th, 8, 72, da), mat(col)); m.position.copy(c); m.rotation.z = a0; g.add(m); return m; }
function diskXY(g, c, r, col, op = 0.15) { const m = new THREE.Mesh(new THREE.CircleGeometry(r, 64), mat(col, { basic: true, opacity: op })); m.position.copy(c); m.renderOrder = 1; g.add(m); return m; }
function foot(a, b, p) { const dx = b.x - a.x, dy = b.y - a.y, t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy); return V(a.x + t * dx, a.y + t * dy, a.z); }
function lineInter(p1, d1, p2, d2v) { const det = d1.x * d2v.y - d1.y * d2v.x; if (Math.abs(det) < 1e-9) return null; const t = ((p2.x - p1.x) * d2v.y - (p2.y - p1.y) * d2v.x) / det; return V(p1.x + t * d1.x, p1.y + t * d1.y, p1.z); }
const yn = (c) => c ? 'ναι' : 'όχι';

const triFromSides = (a, b, c) => { const B = Q(-a / 2, 0), C = Q(a / 2, 0), x = (a * a + c * c - b * b) / (2 * a), y2 = c * c - x * x, ok = a + b > c && a + c > b && b + c > a; return { B, C, ok, A: ok ? V(B.x + x, B.y + Math.sqrt(Math.max(0, y2)), 0) : null }; };
const SC = [
{ // 0
  title: 'Είδη τριγώνων ως προς τις πλευρές', para: '§3.1 Στοιχεία τριγώνου, είδη τριγώνων',
  params: [{ k: 'a', n: 'α = ΒΓ', min: 4, max: 24, step: 1, v: 14, u: ' cm' }, { k: 'b', n: 'β = ΓΑ', min: 4, max: 24, step: 1, v: 14, u: ' cm' }, { k: 'c', n: 'γ = ΑΒ', min: 4, max: 24, step: 1, v: 10, u: ' cm' }],
  build(g, P) {
    base(g, 62, 24);
    const T = triFromSides(P.a, P.b, P.c);
    rod(g, T.B, T.C, COL.red, 0.55); vtx(g, T.B, 'Β', -2, -2.4); vtx(g, T.C, 'Γ', 2, -2.4);
    if (T.ok) { plate(g, [T.B, T.C, T.A], COL.blue, 0.12); rod(g, T.C, T.A, COL.green, 0.55); rod(g, T.A, T.B, COL.blue, 0.55); vtx(g, T.A, 'Α', 0, 2.8); }
  },
  info(P) {
    const ok = P.a + P.b > P.c && P.a + P.c > P.b && P.b + P.c > P.a;
    const kind = P.a === P.b && P.b === P.c ? 'Ισόπλευρο τρίγωνο: οι τρεις πλευρές ίσες.' : (P.a === P.b || P.b === P.c || P.a === P.c ? 'Ισοσκελές τρίγωνο: δύο πλευρές ίσες.' : 'Σκαληνό τρίγωνο: οι τρεις πλευρές άνισες.');
    return [[['α = ', UI.ink], [`${P.a}`, UI.red], [', β = ', UI.ink], [`${P.b}`, UI.green], [', γ = ', UI.ink], [`${P.c} cm`, UI.blue]],
      [[ok ? kind : 'Με τα μήκη αυτά δεν σχηματίζεται τρίγωνο.', UI.purple]],
      [['Κάθε πλευρά είναι μικρότερη από το άθροισμα των δύο άλλων.', UI.dim]]];
  }
},
{ // 1
  title: 'Είδη τριγώνων ως προς τις γωνίες', para: '§3.1 Οξυγώνιο, ορθογώνιο, αμβλυγώνιο',
  params: [{ k: 'f', n: 'Γωνία Α', min: 20, max: 160, step: 5, v: 50, u: '°' }, { k: 'k', n: 'Λόγος ΑΓ / ΑΒ', min: 0.5, max: 2, step: 0.1, v: 1, u: '' }],
  build(g, P) {
    base(g, 62, 24);
    const f = P.f * D2R, A = Q(-12, 0), B = Q(12, 0), C = V(A.x + 24 * P.k * Math.cos(f), A.y + 24 * P.k * Math.sin(f), 0);
    plate(g, [A, B, C], COL.light || '#aeb8c4', 0.2);
    rod(g, B, C, COL.red, 0.5); rod(g, C, A, COL.green, 0.5); rod(g, A, B, COL.blue, 0.5);
    angArc(g, A, B, C, 4, COL.blue); angArc(g, B, C, A, 4, COL.red); angArc(g, C, A, B, 4, COL.green);
    vtx(g, A, 'Α', -2, -2.4); vtx(g, B, 'Β', 2, -2.4); vtx(g, C, 'Γ', 0, 2.8);
  },
  info(P) {
    const f = P.f * D2R, A = Q(0, 0), B = Q(24, 0), C = V(24 * P.k * Math.cos(f), 1 + 24 * P.k * Math.sin(f), 0);
    const a = angDeg(B, A, C), b = angDeg(C, B, A), c = angDeg(A, C, B), m = Math.max(a, b, c);
    return [[[`Α = ${fmt(a, 1)}°`, UI.blue], [`, Β = ${fmt(b, 1)}°`, UI.red], [`, Γ = ${fmt(c, 1)}°`, UI.green]],
      [[Math.abs(m - 90) < 0.05 ? 'Ορθογώνιο τρίγωνο: μία ορθή γωνία.' : m > 90 ? 'Αμβλυγώνιο τρίγωνο: μία αμβλεία γωνία.' : 'Οξυγώνιο τρίγωνο: τρεις οξείες γωνίες.', UI.purple]],
      [['Δοκίμασε Α = 90°.', UI.dim]]];
  }
},
{ // 2
  title: 'Διάμεσοι, ύψη και διχοτόμοι', para: '§3.1 Δευτερεύοντα στοιχεία τριγώνου',
  params: [{ k: 'm', n: '1 διάμεσοι, 2 ύψη, 3 διχοτόμοι', min: 1, max: 3, step: 1, v: 1, u: '' }, { k: 'x', n: 'Θέση της κορυφής Α', min: -12, max: 14, step: 1, v: -3, u: ' cm' }, { k: 'h', n: 'Ύψος της κορυφής Α', min: 8, max: 22, step: 1, v: 16, u: ' cm' }],
  build(g, P) {
    base(g, 62, 24);
    const B = Q(-14, 0), C = Q(14, 0), A = Q(P.x, P.h);
    plate(g, [A, B, C], '#aeb8c4', 0.18);
    rod(g, B, C, COL.red, 0.45); rod(g, C, A, COL.green, 0.45); rod(g, A, B, COL.blue, 0.45);
    vtx(g, A, 'Α', 0, 2.8); vtx(g, B, 'Β', -2, -2.4); vtx(g, C, 'Γ', 2, -2.4);
    const sides = [[A, B, C, COL.red], [B, C, A, COL.green], [C, A, B, COL.blue]];
    if (P.m === 1) {
      const pts = sides.map(([v, p, q, c]) => { const M = mid2(p, q); rod(g, v, M, c, 0.3); ball(g, M, c, 0.55); return M; });
      const G = V((A.x + B.x + C.x) / 3, (A.y + B.y + C.y) / 3, 0.3); ball(g, G, COL.orange, 1.0); label(g, 'G', V(G.x + 1.8, G.y + 1.4, 0.8), COL.orange, 2.4);
    } else if (P.m === 2) {
      const fs = sides.map(([v, p, q, c]) => { const F = foot(p, q, v); dashed(g, p.x === F.x && p.y === F.y ? q : (d2(F, p) < d2(F, q) ? p : q), F, c, 0.15); rod(g, v, F, c, 0.3); ball(g, F, c, 0.5); return F; });
      const H = lineInter(A, V(fs[0].x - A.x, fs[0].y - A.y, 0), B, V(fs[1].x - B.x, fs[1].y - B.y, 0));
      if (H) { ball(g, V(H.x, H.y, 0.3), COL.orange, 1.0); label(g, 'Η', V(H.x + 1.8, H.y + 1.4, 0.8), COL.orange, 2.4); }
    } else {
      const bis = (v, p, q) => { const u1 = unit2(v, p), u2 = unit2(v, q); return V(u1.x + u2.x, u1.y + u2.y, 0); };
      const dA = bis(A, B, C), dB = bis(B, C, A), dCc = bis(C, A, B);
      const I = lineInter(A, dA, B, dB); const s = (d2(A, B) + d2(B, C) + d2(C, A)) / 2, area = Math.abs((B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y)) / 2, rr = area / s;
      [[A, dA, COL.blue], [B, dB, COL.red], [C, dCc, COL.green]].forEach(([v, d, c]) => { const L = d2(v, I) * 1.0; rod(g, v, I, c, 0.3); });
      if (I) { ringXY(g, V(I.x, I.y, 0.2), rr, COL.orange, 0.25); ball(g, V(I.x, I.y, 0.3), COL.orange, 1.0); label(g, 'Ι', V(I.x + 1.8, I.y + 1.4, 0.8), COL.orange, 2.4); }
    }
  },
  info(P) {

    c.fillStyle = i === activeParam ? '#F0A35E' : '#eaf1f8'; c.font = '700 34px "Segoe UI",system-ui,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(`${p.n} = ${PV[K][p.k]}${p.u}`, 293, yy + 4); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  });
  c.fillStyle = '#93a6bb'; c.font = '500 22px "Segoe UI",system-ui,sans-serif';
  c.fillText('Σκανδάλη: κουμπί ή επόμενη σκηνή', 600, PH - 92); c.fillText('Πλαϊνό κουμπί: η σκηνή μπροστά σου', 600, PH - 60); c.fillText('Μοχλός: τιμή και μέγεθος', 600, PH - 28);
  ptex.needsUpdate = true;
}

// ------------------------------------------------------------------ HTML πίνακας
const $ = (id) => document.getElementById(id);
function buildUI() {
  const S = SC[K], P = PV[K];
  $('ttl').textContent = S.title; $('para').textContent = S.para; $('kidx').textContent = `Σκηνή ${K + 1} από ${SC.length}`;
  const box = $('params'); box.innerHTML = '';
  S.params.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'prm';
    d.innerHTML = `<span>${p.n}</span><span class="v" id="pv${i}"></span><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${P[p.k]}" id="pr${i}">`;
    box.appendChild(d);
    d.querySelector('input').addEventListener('input', (e) => { setParam(i, parseFloat(e.target.value), false); });
  });
  updateInfo();
}
function updateInfo() {
  const S = SC[K], P = PV[K];
  S.params.forEach((p, i) => { const el = $('pv' + i); if (el) el.textContent = `${P[p.k]}${p.u}`; const r = $('pr' + i); if (r && +r.value !== P[p.k]) r.value = P[p.k]; });
  $('info').innerHTML = S.info(P).map(segs => '<div>' + segs.map(([t, c]) => `<span style="color:${c}">${t.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>`).join('') + '</div>').join('');
}
function rebuild() { disposeGroup(model); SC[K].build(model, PV[K]); updateInfo(); if (panel.visible) drawPanel(); }
function setScene(k) {
  K = (k + SC.length) % SC.length; activeParam = 0;
  try { history.replaceState(null, '', '?k=' + K); } catch (e) {}
  buildUI(); rebuild();
}
function setParam(i, v, fromXR = true) {
  const p = SC[K].params[i]; if (!p) return;
  v = Math.round((Math.min(p.max, Math.max(p.min, v)) - p.min) / p.step) * p.step + p.min;
  v = +v.toFixed(6);
  if (PV[K][p.k] === v) return;
  PV[K][p.k] = v; activeParam = i; rebuild();
}
$('prev').onclick = () => setScene(K - 1);
$('next').onclick = () => setScene(K + 1);

// ------------------------------------------------------------------ WebXR
let handheld = false, refType = 'local-floor', hitSource = null, viewerSpace = null, needPlace = false, xrMode = null;
const hint = $('hint');
function showHint(t) { hint.textContent = t || ''; hint.style.display = t ? 'block' : 'none'; }
async function checkXR() {
  if (!navigator.xr) { $('msg').textContent = 'Ο browser δεν υποστηρίζει WebXR: προβολή 3D (σύρσιμο για περιστροφή, τροχός για μεγέθυνση).'; return; }
  try { $('btnAR').disabled = !(await navigator.xr.isSessionSupported('immersive-ar')); } catch (e) {}
  try { $('btnVR').disabled = !(await navigator.xr.isSessionSupported('immersive-vr')); } catch (e) {}
  if ($('btnAR').disabled && $('btnVR').disabled) $('msg').textContent = 'Δεν βρέθηκε συσκευή AR/VR: προβολή 3D (σύρσιμο για περιστροφή, τροχός για μεγέθυνση).';
}
checkXR();
$('ui').addEventListener('beforexrselect', (e) => e.preventDefault());
async function startXR(mode) {
  try {
    const opt = { optionalFeatures: ['local-floor', 'hand-tracking', 'hit-test', 'dom-overlay'], domOverlay: { root: $('overlay') } };
    const session = await navigator.xr.requestSession(mode, opt);
    refType = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch (e) { refType = 'local'; }
    renderer.xr.setReferenceSpaceType(refType);
    await renderer.xr.setSession(session);
    xrMode = mode;
    handheld = !!session.domOverlayState;
    scene.background = mode === 'immersive-vr' ? BG : null;
    vrEnv.visible = mode === 'immersive-vr'; desk.visible = mode === 'immersive-vr';
    panel.visible = !handheld; if (panel.visible) drawPanel();
    $('btnAR').style.display = $('btnVR').style.display = 'none'; $('btnExit').style.display = ''; $('btnPlace').style.display = handheld ? '' : 'none';
    userScale = handheld ? 0.8 : 1; applyScale();
    needPlace = true;
    if (handheld) {
      try { viewerSpace = await session.requestReferenceSpace('viewer'); hitSource = await session.requestHitTestSource({ space: viewerSpace }); } catch (e) { hitSource = null; }
      showHint(hitSource ? 'Πάτησε σε μια επιφάνεια (θρανίο ή δάπεδο) για να τοποθετήσεις τη σκηνή.' : '');
    }
    session.addEventListener('select', onScreenSelect);
    session.addEventListener('end', onEnd);
  } catch (e) { $('msg').textContent = 'Δεν ξεκίνησε η συνεδρία XR: ' + (e && e.message || e); }
}
function onEnd() {
  xrMode = null; handheld = false; hitSource = null; reticle.visible = false; showHint('');
  scene.background = BG; vrEnv.visible = false; desk.visible = false; panel.visible = false;
  anchor.position.set(0, 0, 0); anchor.rotation.set(0, 0, 0); userScale = 1; applyScale();
  $('btnAR').style.display = $('btnVR').style.display = ''; $('btnExit').style.display = 'none'; $('btnPlace').style.display = 'none';
}
$('btnAR').onclick = () => startXR('immersive-ar');
$('btnVR').onclick = () => startXR('immersive-vr');
$('btnExit').onclick = () => { const s = renderer.xr.getSession(); if (s) s.end(); };
$('btnPlace').onclick = () => { needPlace = true; };
function onScreenSelect(e) { // πάτημα στην οθόνη του tablet
  if (!handheld) return;
  if (reticle.visible) {
    const m = new THREE.Matrix4().copy(reticle.matrix), p = new THREE.Vector3().setFromMatrixPosition(m);
    const cp = lastPose ? new THREE.Vector3(lastPose.position.x, lastPose.position.y, lastPose.position.z) : p.clone().add(V(0, 0, 1));
    anchor.position.copy(p); anchor.rotation.set(0, Math.atan2(cp.x - p.x, cp.z - p.z), 0);
    showHint('');
  }
}
// τοποθέτηση μπροστά στον θεατή (από τη θέση του κεφαλιού ή του tablet)
let lastPose = null;
function placeInFront(t) {
  const p = new THREE.Vector3(t.position.x, t.position.y, t.position.z);
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w)); f.y = 0;
  if (f.lengthSq() < 1e-6) f.set(0, 0, -1); f.normalize();
  const dist = handheld ? 0.7 : 0.95;
  anchor.position.copy(p).addScaledVector(f, dist);
  anchor.position.y = handheld ? p.y - 0.4 : (refType === 'local-floor' ? 0.8 : p.y - 0.45);
  anchor.rotation.set(0, Math.atan2(-f.x, -f.z), 0);
}
// χειριστήρια
const ray = new THREE.Raycaster(), tmpM = new THREE.Matrix4();
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0, 0, 0), V(0, 0, -1)]), new THREE.LineBasicMaterial({ color: 0x2dd4bf }));
  line.scale.z = 1.5; c.add(line);
  c.addEventListener('selectstart', () => onCtrlSelect(c));
  c.addEventListener('squeezestart', () => { needPlace = true; });
  scene.add(c); return c;
});
function panelHit(c) {
  if (!panel.visible) return null;
  tmpM.identity().extractRotation(c.matrixWorld);
  ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
  const h = ray.intersectObject(panel, false)[0]; if (!h || !h.uv) return null;
  const x = h.uv.x * PW, y = (1 - h.uv.y) * PH;
  const b = buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  return b ? b.id : 'panel';
}
function press(id) {
  if (id === 'prev') setScene(K - 1); else if (id === 'next') setScene(K + 1);
  else if (/^[mp]\d$/.test(id)) { const i = +id[1], p = SC[K].params[i]; setParam(i, PV[K][p.k] + (id[0] === 'p' ? 1 : -1) * p.step); activeParam = i; drawPanel(); }
}
function onCtrlSelect(c) {
  if (handheld) return;
  const id = panelHit(c);
  if (id && id !== 'panel') press(id); else if (!id) setScene(K + 1);
}
let lastStick = 0;
function pollSticks(t) {
  const s = renderer.xr.getSession(); if (!s || handheld) return;
  for (const src of s.inputSources) {
    const gp = src.gamepad; if (!gp || gp.axes.length < 4) continue;
    const ax = gp.axes[2], ay = gp.axes[3];
    if (Math.abs(ax) > 0.6 && t - lastStick > 260) { const p = SC[K].params[activeParam]; if (p) setParam(activeParam, PV[K][p.k] + Math.sign(ax) * p.step); lastStick = t; }
    if (Math.abs(ay) > 0.3) { userScale = Math.min(2.5, Math.max(0.4, userScale * (1 - ay * 0.015))); applyScale(); }
  }
}

// ------------------------------------------------------------------ βρόχος
function render(t, frame) {
  if (frame) {
    const rs = renderer.xr.getReferenceSpace();
    const vp = frame.getViewerPose(rs);
    if (vp) { lastPose = vp.transform; if (needPlace) { placeInFront(vp.transform); needPlace = false; } }
    if (handheld && hitSource) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) { const pose = hits[0].getPose(rs); reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); }
      else reticle.visible = false;
    }
    if (panel.visible) {
      let h = null; for (const c of ctrls) { const id = panelHit(c); if (id && id !== 'panel') h = id; }
      if (h !== hover) { hover = h; drawPanel(); }
    }
    pollSticks(t);
  } else controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(render);
function fitView() {
  const W = innerWidth, H = innerHeight;
  camera.aspect = W / H;
  const portrait = W <= 820 && H > W;
  if (portrait) camera.setViewOffset(W, H, 0, Math.round(H * 0.2), W, H);
  else if (W > 700) camera.setViewOffset(W, H, Math.round(Math.min(440, W * 0.33) / 2), 0, W, H);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix(); renderer.setSize(W, H);
  // απόσταση κάμερας ώστε το μοντέλο (περίπου 0,65 m) να χωράει στο ελεύθερο πλάτος
  const free = portrait ? 1 : (W > 700 ? (W - Math.min(440, W * 0.33)) / W : 1);
  const hf = 2 * Math.atan(Math.tan(camera.fov * D2R / 2) * camera.aspect * free);
  const dist = Math.max(0.75, 0.4 / Math.tan(hf / 2));
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist); controls.update();
}
addEventListener('resize', fitView); fitView();

setScene(K);
// για αυτόματο έλεγχο
window.__trig = { SC, PV, setScene, setParam, get k() { return K; }, model, drawPanel, panel };
</script>
</body>
</html>
