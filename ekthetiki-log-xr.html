<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Εκθετική και λογαριθμική συνάρτηση — XR</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#f5a524}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px}
  #bar h1{font-size:15px;margin:0;font-weight:640}
  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto}
  #dock{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg button{font:600 13px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:10px 14px;cursor:pointer}
  .seg button.on{color:#08131a;background:var(--acc);border-color:transparent}
  .xr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .xr button{font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:#2dd4bf;
    border:none;border-radius:12px;padding:14px 22px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer;
    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:760px;text-align:center;line-height:1.5}
  #hint b{color:var(--ink)}
  #note{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;max-width:640px;text-align:center;line-height:1.55;display:none}
  @media (max-width:560px){ .seg button{padding:9px 10px;font-size:12px} #hint{font-size:11.5px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <a href="index.html">‹ Πίσω</a>
  <h1>Εκθετική και λογαριθμική συνάρτηση</h1>
  <span class="lv">Β΄ Λυκείου, §5.1–5.2</span>
</div>
<div id="dock">
  <div class="seg" id="segS">
    <button data-s="0" class="on">§ 5.1 Εκθετική</button>
    <button data-s="1">§ 5.1 Βάση α</button>
    <button data-s="2">§ 5.1 Ανατοκισμός</button>
    <button data-s="3">§ 5.2 Αντίστροφη</button>
    <button data-s="4">§ 5.2 pH</button>
    <button data-s="5">§ 5.2 Εξίσωση</button>
    <button data-s="6">§ 5.3 Λογαριθμική</button>
  </div>
  <div id="hint"></div>
  <div class="xr">
    <button id="btnAR">Είσοδος σε AR</button>
    <button id="btnVR" class="vr">Είσοδος σε VR</button>
  </div>
  <div id="note"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Ίδια κλίμακα και στους δύο άξονες, ώστε η συμμετρία ως προς y = x να διατηρείται.
const S = 0.35;
const CLAMP = 4;               // τιμές του y περιορίζονται στο [-4, 4] για ευανάγνωστο σχήμα
const COL = { exp: 0xf5a524, log: 0x7dd3fc, base: 0xf9a8d4, axis: 0xcbd5e1, diag: 0xfbbf24, mark: 0xfbbf24 };

const STATES = [
  { hint: "<b>§ 5.1 Εκθετική συνάρτηση, y = 2^x</b>. Αύξουσα, τέμνει τον y΄y στο (0; 1)." +
          " Η ευθεία y = 0 είναι οριζόντια ασύμπτωτη και η τιμή 2^x είναι πάντα θετική." },
  { hint: "<b>Βάση α</b>: η <b>y = 2^x</b> (α &gt; 1) είναι αύξουσα, ενώ η <b>y = (1/2)^x</b>" +
          " (0 &lt; α &lt; 1) είναι φθίνουσα. Και οι δύο περνούν από το (0; 1)." },
  { hint: "<b>Ανατοκισμός</b>: K(t) = C(1 + r)^t. Με C = 1 και r = 0,05 η καμπύλη δίνει το ποσό" +
          " στα 10 έτη: 1,63 φορές το αρχικό κεφάλαιο." },
  { hint: "<b>§ 5.2 Λογάριθμος</b>: η <b>y = log₂ x</b> είναι συμμετρική της <b>y = 2^x</b>" +
          " ως προς την ευθεία <b>y = x</b>. Ορισμός: log₂ x = y ⇔ 2^y = x." },
  { hint: "<b>Κλίμακα pH</b>: y = −log₁₀ x. Για x = 0,1 η τιμή είναι 1 και για x = 0,01 είναι 2," +
          " δηλαδή κάθε μονάδα pH αντιστοιχεί σε δεκαπλάσια συγκέντρωση." },
  { hint: "<b>Εξίσωση 2^x = 4</b>: η λύση x = 2 είναι το σημείο τομής της <b>y = 2^x</b>" +
          " με την οριζόντια ευθεία <b>y = 4</b>." },
  { hint: "<b>§ 5.3 Λογαριθμική συνάρτηση</b>: η <b>y = log₂ x</b> έχει πεδίο ορισμού x &gt; 0" +
          " και κατακόρυφη ασύμπτωτη τον y΄y. Η <b>y = log₂(x + 1)</b> είναι μετατόπισή της" +
          " κατά −1 στον άξονα x΄x." },
];

// ---------- Σκηνή ----------
const canvas = document.getElementById("c");
const note = document.getElementById("note");
const hintEl = document.getElementById("hint");
const btnAR = document.getElementById("btnAR");
const btnVR = document.getElementById("btnVR");

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error("no gl");
} catch (err) {
  note.textContent = "Ο browser δεν υποστηρίζει WebGL. Η εφαρμογή δεν μπορεί να εμφανιστεί.";
  note.style.display = "block";
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 60);
camera.position.set(0.1, 0.5, 2.2);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0.2, 0.05, 0);
controls.enableDamping = true;
controls.minDistance = 0.6;
controls.maxDistance = 4;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3a50, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(1, 2, 2);
scene.add(key);

// Η σκηνή τοποθετείται μπροστά στον χρήστη στα γυαλιά.
const world = new THREE.Group();
scene.add(world);
const content = new THREE.Group();
world.add(content);

// ---------- Βοηθητικά ----------
function P(x, y) {
  return new THREE.Vector3(x * S, Math.max(-CLAMP, Math.min(CLAMP, y)) * S, 0);
}

function tube(points, color, radius) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35, roughness: 0.4 });
  return new THREE.Mesh(new THREE.TubeGeometry(curve, points.length * 4, radius, 10, false), mat);
}

function plot(fn, x0, x1, n, color, radius = 0.014) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = x0 + ((x1 - x0) * i) / n;
    const y = fn(x);
    if (Number.isFinite(y)) pts.push(P(x, y));
  }
  if (pts.length >= 2) content.add(tube(pts, color, radius));
  return pts;
}

function label(text, color = "#eaf1f8", size = 64) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.font = `600 ${size}px "Segoe UI", Roboto, Arial, sans-serif`;
  g.fillStyle = color;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(0.36, 0.09, 1);
  sprite.renderOrder = 10;
  return sprite;
}

function point(x, y, text, color = COL.mark) {
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.03, 16, 12),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 })
  );
  dot.position.copy(P(x, y));
  content.add(dot);
  if (text) {
    const t = label(text, "#eaf1f8", 52);
    t.position.copy(P(x, y)).add(new THREE.Vector3(0.1, 0.07, 0.01));
    content.add(t);
  }
}

function axes() {
  const mat = new THREE.LineBasicMaterial({ color: COL.axis, transparent: true, opacity: 0.85 });
  const xa = [P(-4.5, 0), P(6.5, 0)];
  const ya = [P(0, -4.5), P(0, 4.5)];
  content.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(xa), mat));
  content.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ya), mat));
  const xl = label("x", "#7dd3fc", 56); xl.position.copy(P(6.6, 0)).add(new THREE.Vector3(0, -0.07, 0));
  const yl = label("y", "#e2e8f0", 56); yl.position.copy(P(0, 4.6)).add(new THREE.Vector3(0.06, 0, 0));
  const ol = label("O", "#93c5fd", 48); ol.position.copy(P(0, 0)).add(new THREE.Vector3(-0.07, -0.06, 0));
  content.add(xl, yl, ol);
}

function diagonal() {
  const pts = [P(-4, -4), P(4, 4)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({ color: COL.diag, dashSize: 0.03, gapSize: 0.02, transparent: true, opacity: 0.85 });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  content.add(line);
  const l = label("y = x", "#fbbf24", 52);
  l.position.copy(P(3.2, 3.2)).add(new THREE.Vector3(0.1, 0.02, 0.01));
  content.add(l);
}

function clearContent() {
  while (content.children.length) {
    const obj = content.children.pop();
    obj.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (o.material.map) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
}

// ---------- Καταστάσεις ----------
let state = 0;
let moving = null;   // { fn, x0, x1, dot }
let clock = 0;

function build(s) {
  clearContent();
  moving = null;
  axes();

  if (s === 0) {
    plot((x) => Math.pow(2, x), -3, 2.6, 180, COL.exp);
    point(0, 1, "(0; 1)");
    point(1, 2, "(1; 2)");
    point(2, 4, "(2; 4)");
    moving = makeMover((x) => Math.pow(2, x), -3, 2.6, COL.exp);
  } else if (s === 1) {
    plot((x) => Math.pow(2, x), -3, 2.6, 180, COL.exp);
    plot((x) => Math.pow(0.5, x), -2.6, 3, 180, COL.base);
    point(0, 1, "(0; 1)");
  } else if (s === 2) {
    plot((x) => Math.pow(1.05, x), -1, 12, 220, COL.exp);
    point(0, 1, "(0; 1)");
    point(10, Math.pow(1.05, 10), "(10; 1,63)");
  } else if (s === 3) {
    plot((x) => Math.pow(2, x), -3, 2.6, 180, COL.exp);
    plot((x) => Math.log2(x), 0.125, 6, 220, COL.log);
    diagonal();
    point(0, 1, "(0; 1)");
    point(1, 0, "(1; 0)");
    point(2, 1, "(2; 1)");
  } else if (s === 4) {
    plot((x) => -Math.log10(x), 0.01, 2, 220, COL.log);
    point(0.1, 1, "(0,1; 1)");
    point(0.01, 2, "(0,01; 2)");
    point(1, 0, "(1; 0)");
  } else if (s === 5) {
    plot((x) => Math.pow(2, x), -3, 2.6, 180, COL.exp);
    plot(() => 4, -3, 3, 2, COL.diag);
    point(2, 4, "(2; 4)");
  } else {
    plot((x) => Math.log2(x), 0.125, 6, 220, COL.log);
    plot((x) => Math.log2(x + 1), -0.875, 6, 220, COL.base);
    point(1, 0, "(1; 0)");
    point(0, 0, "(0; 0)");
  }

  hintEl.innerHTML = STATES[s].hint;
  document.querySelectorAll("#segS button").forEach((b) => b.classList.toggle("on", +b.dataset.s === s));
}

function makeMover(fn, x0, x1, color) {
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: 0.9 })
  );
  content.add(dot);
  return { fn, x0, x1, dot };
}

function setState(s) {
  state = (s + STATES.length) % STATES.length;
  build(state);
}

document.querySelectorAll("#segS button").forEach((b) => {
  b.onclick = () => setState(+b.dataset.s);
});

setState(0);

// ---------- AR / VR ----------
let placed = false;

function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position;
  const o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  f.y = 0;
  if (f.lengthSq() < 1e-6) f.set(0, 0, -1);
  f.normalize();
  world.position.set(p.x + f.x * 0.9, p.y - 0.3, p.z + f.z * 0.9);
  world.rotation.y = Math.atan2(-f.x, -f.z);
  world.scale.setScalar(1.2);
  placed = true;
}

async function startXR(mode) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(mode, { optionalFeatures: ["local-floor"] });
    let space = "local-floor";
    try { await session.requestReferenceSpace("local-floor"); } catch { space = "local"; }
    renderer.xr.setReferenceSpaceType(space);
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || "opaque") === "opaque";
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    session.addEventListener("end", () => {
      scene.background = null;
      world.position.set(0, 0, 0);
      world.rotation.set(0, 0, 0);
      world.scale.setScalar(1);
      placed = false;
      camera.position.set(0.1, 0.5, 2.2);
      controls.update();
    });
  } catch (err) {
    note.textContent = "Δεν ξεκίνησε η λειτουργία " + (mode === "immersive-ar" ? "AR" : "VR") + ": " + (err.message || err);
    note.style.display = "block";
  }
}

btnAR.onclick = () => startXR("immersive-ar");
btnVR.onclick = () => startXR("immersive-vr");

async function checkXR() {
  if (!window.isSecureContext || !navigator.xr) {
    note.textContent = "Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.";
    note.style.display = "block";
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported("immersive-ar").catch(() => false),
    navigator.xr.isSessionSupported("immersive-vr").catch(() => false),
  ]);
  if (ar) btnAR.style.display = "inline-block";
  if (vr) btnVR.style.display = "inline-block";
  if (!ar && !vr) {
    note.textContent = "Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.";
    note.style.display = "block";
  }
}
checkXR();

// Επιλογή στα χειριστήρια αλλάζει την κατάσταση.
for (let i = 0; i < 2; i++) {
  const ctrl = renderer.xr.getController(i);
  ctrl.addEventListener("select", () => setState(state + 1));
  scene.add(ctrl);
}

// ---------- Βρόχος ----------
window.addEventListener("resize", () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop((time, frame) => {
  if (frame && renderer.xr.isPresenting && !placed) placeInFront(frame);

  // Κινούμενο σημείο πάνω στην κύρια καμπύλη (τα κατάλληλα δευτερόλεπτα για κάθε κατάσταση).
  if (moving) {
    clock += 0.008;
    const t = (Math.sin(clock) + 1) / 2;
    const x = moving.x0 + (moving.x1 - moving.x0) * t;
    moving.dot.position.copy(P(x, moving.fn(x)));
  }

  if (!renderer.xr.isPresenting) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
