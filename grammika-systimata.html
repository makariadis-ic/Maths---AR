<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
// Σενάριο «Τα γραμμικά συστήματα στον χώρο» (Μαθηματικά Γ΄ Γυμνασίου, Γραμμικά συστήματα 2×2, πολλαπλά βιβλία).
// Κέντρο Καινοτομίας Θεσσαλίας.
// Στο επίπεδο, κάθε εξίσωση ax + by = c είναι μια ευθεία και η λύση του συστήματος είναι το κοινό σημείο των δύο
// ευθειών. Στον χώρο (x, y, z), η ίδια εξίσωση ax + by = c (με το z ελεύθερο) παριστάνει ένα κατακόρυφο επίπεδο που
// στέκεται πάνω στην ευθεία. Η τομή των δύο κατακόρυφων επιπέδων είναι μια κατακόρυφη ευθεία που περνά ακριβώς πάνω
// από τη λύση (x₀, y₀). Οι τρεις περιπτώσεις: τεμνόμενες ευθείες → μία κατακόρυφη τομή (μοναδική λύση)· παράλληλες
// ευθείες → παράλληλα επίπεδα, καμία τομή (καμία λύση)· ταυτιζόμενες ευθείες → ένα επίπεδο, άπειρες λύσεις.
// Μονάδα σκηνής: 1 cm. Ο κάνναβος είναι 24 × 24 cm (x, y από −6 έως 6, 2 cm η μονάδα). Τα επίπεδα έχουν ύψος 14 cm.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CM = 0.01;                 // 1 cm της σκηνής σε μέτρα
const U = 2;                     // 2 cm ανά μονάδα των αξόνων x, y
const D = 6;                     // ο κάνναβος: x, y από −6 έως 6
const Y0 = 16;                   // ύψος του καννάβου πάνω από τη βάση
const WALLH = 14;                // ύψος των κατακόρυφων επιπέδων
const TABLE = 0.78, DIST = 1.2;  // XR: ύψος θρανίου και απόσταση της σκηνής από τον χρήστη (m)
const AZ = 32, EL = 20;          // η σκηνή φαίνεται από εμπρός-δεξιά και από ψηλά (3D και XR)

// χρώματα: η ευθεία f και το επίπεδό της μπλε, η ευθεία g και το επίπεδό της κόκκινο, η λύση χρυσή, η τομή πορτοκαλί
const COL = { F: '#1F6FB2', G: '#C0392B', S: '#E8A32C', T: '#E36C09', AX: '#cbd5e1' };
const TXT = { F: '#7FB2E5', G: '#E8857A', S: '#F3C15A', T: '#F2A46F' };
const INK = '#eaf1f8', KEIMENO = '#262626';

const rad = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const num = (x, d = 2) => { const s = (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toFixed(d); return s.replace('.', ',').replace('-', '−'); };
// σημείο της σκηνής από μαθηματικές συντεταγμένες (x, y) και ύψος h
const P = (x, y, h = 0) => V(U * x, Y0 + h, -U * y);

// ευθεία ax + by = c: τα δύο άκρα της μέσα στο τετράγωνο [−D, D] × [−D, D]
function clipLine(a, b, c) {
  const pts = [], eps = 1e-6;
  const add = (x, y) => { if (x >= -D - eps && x <= D + eps && y >= -D - eps && y <= D + eps) pts.push([x, y]); };
  if (Math.abs(b) > eps) { add(-D, (c - a * -D) / b); add(D, (c - a * D) / b); }
  if (Math.abs(a) > eps) { add((c - b * -D) / a, -D); add((c - b * D) / a, D); }
  const out = [];
  for (const p of pts) if (!out.some(q => Math.abs(q[0] - p[0]) < 1e-4 && Math.abs(q[1] - p[1]) < 1e-4)) out.push(p);
  return out.length >= 2 ? [out[0], out[1]] : null;
}

// ------------------------------------------------------------------ τα συστήματα και οι καταστάσεις
const SYS_A = { f: [1, 1, 5], g: [1, -1, 1], sol: [3, 2] };     // τεμνόμενες: μοναδική λύση (3, 2)
const SYS_B = { f: [1, 1, 5], g: [1, 1, 2] };                   // παράλληλες: καμία λύση
const SYS_C = { f: [1, 1, 3], g: [2, 2, 6] };                   // ταυτιζόμενες: άπειρες λύσεις

const STATES = [
  { sys: SYS_A, tEnd: 2.2, walls: false,
    title: 'Το σύστημα στο επίπεδο',
    lines: [['x + y = 5: η ευθεία f', 'F'], ['x − y = 1: η ευθεία g', 'G'], ['Λύση: το κοινό σημείο (3, 2)', 'S']],
    hint: '<b>Το σύστημα στο επίπεδο:</b> κάθε εξίσωση του συστήματος είναι μια ευθεία. Η ευθεία f: x + y = 5 (μπλε) και η ευθεία g: x − y = 1 (κόκκινη) τέμνονται σε ένα σημείο. Οι συντεταγμένες του, x = 3 και y = 2, είναι η λύση του συστήματος, γιατί επαληθεύουν ταυτόχρονα και τις δύο εξισώσεις.' },
  { sys: SYS_A, tEnd: 2.2, walls: true,
    title: 'Κάθε εξίσωση ως κατακόρυφο επίπεδο',
    lines: [['Στον χώρο: ax + by = c με το z ελεύθερο', 'T'], ['Επίπεδο f πάνω στην ευθεία f', 'F'], ['Επίπεδο g πάνω στην ευθεία g', 'G']],
    hint: '<b>Από την ευθεία στο επίπεδο:</b> περνάμε στον χώρο (x, y, z) και προσθέτουμε έναν κατακόρυφο άξονα z. Η εξίσωση x + y = 5, χωρίς περιορισμό στο z, παριστάνει τώρα ένα κατακόρυφο επίπεδο που στέκεται πάνω στην ευθεία f και υψώνεται προς τα πάνω. Το ίδιο και η x − y = 1 για την g. Κάθε επίπεδο πατά ακριβώς πάνω στην ευθεία του.' },
  { sys: SYS_A, tEnd: 2.2, walls: true,
    title: 'Η τομή των επιπέδων είναι η λύση',
    lines: [['Τα δύο επίπεδα τέμνονται σε κατακόρυφη ευθεία', 'T'], ['Η ευθεία αυτή περνά πάνω από το (3, 2)', 'S'], ['Μοναδική λύση: x = 3, y = 2', 'S']],
    hint: '<b>Η τομή = η λύση:</b> τα δύο κατακόρυφα επίπεδα τέμνονται κατά μήκος μιας κατακόρυφης ευθείας (πορτοκαλί). Όλα τα σημεία της έχουν x = 3 και y = 2, όσο ψηλά κι αν ανέβουμε. Αν κατέβουμε στον κάνναβο, η ευθεία αυτή περνά ακριβώς από το σημείο (3, 2): είναι η μοναδική λύση του συστήματος.' },
  { sys: SYS_B, tEnd: 2.2, walls: true,
    title: 'Καμία λύση: παράλληλες ευθείες',
    lines: [['x + y = 5 και x + y = 2', 'T'], ['Παράλληλες ευθείες, παράλληλα επίπεδα'], ['Τα επίπεδα δεν τέμνονται πουθενά', 'G']],
    hint: '<b>Καμία λύση:</b> όταν οι δύο εξισώσεις έχουν ίδιους συντελεστές στα x και y αλλά διαφορετικό σταθερό όρο (εδώ x + y = 5 και x + y = 2), οι ευθείες είναι παράλληλες και δεν έχουν κοινό σημείο. Στον χώρο, τα δύο κατακόρυφα επίπεδα είναι κι αυτά παράλληλα: δεν τέμνονται ποτέ, άρα το σύστημα δεν έχει καμία λύση.' },
  { sys: SYS_C, tEnd: 2.2, walls: true,
    title: 'Άπειρες λύσεις: ταυτιζόμενες ευθείες',
    lines: [['x + y = 3 και 2x + 2y = 6', 'T'], ['Η δεύτερη εξίσωση είναι η πρώτη × 2'], ['Ένα επίπεδο: κάθε σημείο της ευθείας λύση', 'S']],
    hint: '<b>Άπειρες λύσεις:</b> η εξίσωση 2x + 2y = 6 είναι η x + y = 3 πολλαπλασιασμένη με 2, άρα παριστάνει την ίδια ευθεία. Οι δύο εξισώσεις δίνουν την ίδια ευθεία και το ίδιο κατακόρυφο επίπεδο. Κάθε σημείο της ευθείας (χρυσή) επαληθεύει και τις δύο εξισώσεις, οπότε το σύστημα έχει άπειρες λύσεις.' }
];
const hintHTML = k => STATES[k].hint.replace(/ (=|·|×|→|≈|:|\+|−|±) /g, ' $1 ')
  .replace(/(\d) (cm|m|rad)(?!\p{L})/gu, '$1 $2');

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const FOV = 26;
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 5;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.8, 1.6, 1.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.5);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// δάπεδο και θρανίο μόνο σε αδιαφανή λειτουργία (VR)
const room = new THREE.Group();
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Group();
  floor.name = 'floor';
  room.add(floor);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.renderOrder = -2;
  floor.add(disc);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.material.depthWrite = false;
  grid.renderOrder = -1;
  grid.position.y = 0.002;
  floor.add(grid);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.7), new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 }));
  desk.name = 'desk';
  room.add(desk);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();         // η σκηνή σε εκατοστά
world.scale.setScalar(CM);
root.add(world);

// ------------------------------------------------------------------ κείμενα σε υφή
const FONT = '"Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif';
function roundRect(ctx, w, h, r) {
  ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
  ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath();
}
function canvasTexture(cv) {
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
// ετικέτα με περίγραμμα, πάντα στραμμένη προς τον θεατή
function label(text, color, height, template) {
  const size = 120, pad = 40;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = `700 ${size}px ${FONT}`;
  const w = Math.ceil(ctx.measureText(template || text).width) + 2 * pad, h = Math.ceil(size * 1.5);
  cv.width = w; cv.height = h;
  const tex = canvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.renderOrder = 8;
  sp.userData = { h: height, aspect: w / h, k: 1, cv, ctx, tex, text: null, color: null, scalable: true };
  fitLabel(sp);
  setText(sp, text, color);
  return sp;
}
function setText(sp, text, color) {
  const u = sp.userData;
  if (u.text === text && u.color === color) return;
  u.text = text; u.color = color;
  const { cv, ctx } = u;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = `700 120px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 22;
  ctx.strokeStyle = 'rgba(14,20,32,.88)';
  ctx.strokeText(text, cv.width / 2, cv.height / 2);
  ctx.fillStyle = color;
  ctx.fillText(text, cv.width / 2, cv.height / 2);
  u.tex.needsUpdate = true;
}
function fitLabel(sp) { const u = sp.userData, s = u.h * u.k; sp.scale.set(s * u.aspect, s, 1); }

// ------------------------------------------------------------------ βοηθητικά γεωμετρίας
const unitBox = new THREE.BoxGeometry(1, 1, 1);
function kouti(sx, sy, sz, c, mat) {
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(sx, sy, sz);
  m.position.copy(c);
  return m;
}
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 14, 1);
function setBar(m, a, b, r) {
  m.position.copy(a).add(b).multiplyScalar(0.5);
  const d = b.clone().sub(a), l = d.length();
  if (l > 1e-6) m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / l));
  m.scale.set(r, Math.max(l, 1e-4), r);
  m.visible = l > 0.02;
}
function bar(a, b, r, mat) { const m = new THREE.Mesh(unitCyl, mat); setBar(m, a, b, r); return m; }
function cone(at, dir, r, h, mat) {
  const g = new THREE.ConeGeometry(r, h, 18);
  g.translate(0, h / 2, 0);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(at);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  return m;
}
const ballGeo = new THREE.SphereGeometry(1, 24, 16);
function ball(r, mat) { const m = new THREE.Mesh(ballGeo, mat); m.scale.setScalar(r); return m; }

// ------------------------------------------------------------------ υλικά
const basic = c => new THREE.MeshBasicMaterial({ color: c });
const glow = c => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.38, roughness: 0.4 });
const wallMat = c => new THREE.MeshStandardMaterial({ color: c, transparent: true, opacity: 0.5, roughness: 0.6, side: THREE.DoubleSide, depthWrite: false });
const M = {
  grammiF: glow(COL.F), grammiG: glow(COL.G),
  epipedoF: wallMat(COL.F), epipedoG: wallMat(COL.G),
  tomi: glow(COL.T), lysi: glow(COL.S),
  axonas: basic(COL.AX)
};

// ------------------------------------------------------------------ ο κάνναβος (το επίπεδο xy)
function gridTexture() {
  const PX = 30, W = 2 * D, px = Math.round(W * U * PX);
  const cv = document.createElement('canvas');
  cv.width = cv.height = px;
  const ctx = cv.getContext('2d');
  const X = x => (x + D) / W * px, Yc = y => (D - y) / W * px;   // y προς τα πάνω στην υφή
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
  ctx.strokeStyle = '#A6A6A6'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, px - 4, px - 4);
  const seg = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  ctx.strokeStyle = '#E3E3E3'; ctx.lineWidth = 2;
  for (let i = -D; i <= D; i++) { seg(X(i), Yc(-D), X(i), Yc(D)); seg(X(-D), Yc(i), X(D), Yc(i)); }
  ctx.strokeStyle = KEIMENO; ctx.fillStyle = KEIMENO; ctx.lineWidth = 4;
  const arrow = (x, y, dx, dy) => { ctx.beginPath(); ctx.moveTo(x + dx * 26, y + dy * 26);
    ctx.lineTo(x - dy * 11, y + dx * 11); ctx.lineTo(x + dy * 11, y - dx * 11); ctx.closePath(); ctx.fill(); };
  seg(X(-D), Yc(0), X(D) + 6, Yc(0)); arrow(X(D), Yc(0), 1, 0);
  seg(X(0), Yc(-D), X(0), Yc(D) - 6); arrow(X(0), Yc(D), 0, -1);
  ctx.font = `600 36px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';

      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * Math.min(dt, 0.1) * 0.9), 0.5, 3));
      }
    });
  } else {
    controls.update();
    faceViewer(camera, false);
  }
  renderer.render(scene, camera);
});
</script>
</body>
