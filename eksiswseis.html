<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Εξισώσεις και προβλήματα — XR</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#3b82f6}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px}
  #bar h1{font-size:15px;margin:0;font-weight:640}
  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto}
  #dock{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg button{font:600 14px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:10px 14px;cursor:pointer}
  .seg button.on{color:#08131a;background:var(--acc);border-color:transparent}
  .xr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .xr button{font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:#2dd4bf;
    border:none;border-radius:12px;padding:14px 22px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer;
    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:780px;text-align:center;line-height:1.5}
  #hint b{color:var(--ink)}
  #note{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;max-width:640px;text-align:center;line-height:1.55;display:none}
  #fallback{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(92vw,80vh);height:auto}
  #ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:13.5px}
  #ctl input[type=range]{width:min(60vw,320px);accent-color:var(--acc)} #ctl b{color:var(--ink);min-width:3.6em;text-align:left}
  #ctl .seg button{padding:8px 12px;font-size:13px}
  #ctl .rw{display:flex;align-items:center;gap:8px}
  .nogl #fallback{display:block} .nogl #c,.nogl #segK,.nogl #ctl,.nogl #hint{display:none}
  @media (max-width:560px){ .seg button{padding:9px 10px;font-size:12.5px} #hint{font-size:11.5px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="fallback" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">
<line x1="110" y1="30" x2="110" y2="100" stroke="#94a3b8" stroke-width="5"/>
<line x1="40" y1="100" x2="180" y2="100" stroke="#94a3b8" stroke-width="5"/>
<line x1="30" y1="34" x2="190" y2="26" stroke="#e2e8f0" stroke-width="4"/>
<rect x="18" y="66" width="48" height="6" fill="#64748b"/><rect x="20" y="52" width="10" height="12" fill="#f59e0b"/><rect x="31" y="52" width="10" height="12" fill="#f59e0b"/><rect x="42" y="52" width="10" height="12" fill="#2563eb"/>
<rect x="154" y="58" width="48" height="6" fill="#64748b"/><rect x="156" y="44" width="10" height="12" fill="#0d9488"/><rect x="167" y="44" width="10" height="12" fill="#0d9488"/><rect x="178" y="44" width="10" height="12" fill="#0d9488"/>
<text x="110" y="116" font-size="12" font-weight="700" text-anchor="middle" fill="#eaf1f8">Η ζυγαριά και η εξίσωση</text>
</svg>
<div id="bar">
  <a href="index.html">‹ Πίσω</a>
  <h1>Εξισώσεις και προβλήματα</h1>
  <span class="lv">Α΄ Γυμνασίου, Κεφάλαιο 4, §4.1 έως §4.3</span>
</div>
<div id="dock">
  <div class="seg" id="segK">
    <button data-k="0" class="on">Η ζυγαριά</button>
    <button data-k="1">Ίδια πράξη και στα δύο μέλη</button>
    <button data-k="2">Λύνω την αx + β = γ</button>
    <button data-k="3">Δύο προσφορές</button>
    <button data-k="4">Το ορθογώνιο</button>
  </div>
  <div id="ctl">
    <span class="rw"><span id="lbl0"></span> <input id="rng0" type="range"> <b id="val0"></b></span>
    <span class="rw"><span id="lbl1"></span> <input id="rng1" type="range"> <b id="val1"></b></span>
    <span class="rw"><span id="lbl2"></span> <input id="rng2" type="range"> <b id="val2"></b></span>
  </div>
  <div id="hint"></div>
  <div class="xr">
    <button id="btnAR">Είσοδος σε AR</button>
    <button id="btnVR" class="vr">Είσοδος σε VR</button>
  </div>
  <div id="note"></div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
// Σενάριο 29 «Εξισώσεις και προβλήματα» — Α΄ Γυμνασίου, Μέρος Α, Κεφ. 4 (§4.1 έως §4.3)
// Κέντρο Καινοτομίας Θεσσαλίας. Μονάδα του χώρου: 1 = 10 cm.
// Σκηνή 1: η ζυγαριά (x + β = γ). Σκηνή 2: η ίδια πράξη και στα δύο μέλη (ευθείες). Σκηνή 3: αx + β = γ με ράβδους.
// Σκηνή 4: δύο προσφορές (πρόβλημα). Σκηνή 5: η περίμετρος του ορθογωνίου (πρόβλημα).
// Χρώματα όπως στις εφαρμογές GeoGebra: αριστερό μέλος μπλε, δεξιό μέλος πράσινο, άγνωστος x πορτοκαλί, λύση μωβ.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const UNIT = 0.1;
const COL = { L: 0x2563eb, R: 0x0d9488, X: 0xf59e0b, S: 0xa855f7, N: 0xef4444, grey: 0x64748b, ink: 0xe2e8f0 };
const CSS = ['#f59e0b', '#f59e0b', '#a855f7', '#2563eb', '#a855f7'];
// ρυθμίσεις ανά σκηνή: [ελάχιστο, μέγιστο, βήμα, ετικέτα] για κάθε ένα από τα τρία μεγέθη, και παραδείγματα για το σύντομο πάτημα
const CFG = [
  { p: [[0, 20, 1, 'Άγνωστος x'], [0, 10, 1, 'Γνωστός β'], [0, 25, 1, 'Δεξιά πλευρά γ']], ex: [[7, 5, 12], [4, 5, 12], [3, 2, 8], [10, 6, 16], [0, 4, 4], [5, 5, 9]] },
  { p: [[0, 8, 1, 'Σταθερός όρος β'], [0, 7, 1, 'Δεξιό μέλος γ'], [-2, 4, 1, 'Αριθμός s']], ex: [[5, 7, 3], [5, 7, -2], [2, 6, 1], [8, 3, 4], [0, 5, 2]] },
  { p: [[1, 6, 1, 'Συντελεστής α'], [0, 12, 1, 'Σταθερός όρος β'], [0, 40, 1, 'Δεξιό μέλος γ']], ex: [[3, 5, 20], [2, 4, 14], [4, 0, 12], [5, 7, 32], [1, 9, 15]] },
  { p: [[0, 20, 1, 'Πάγιο Α (€)'], [1, 5, 1, 'Τιμή ανά ώρα Α (€)'], [1, 8, 1, 'Τιμή ανά ώρα Β (€)']], ex: [[8, 2, 4], [10, 3, 5], [0, 2, 4], [6, 1, 3], [12, 4, 6]] },
  { p: [[0, 10, 1, 'Διαφορά δ'], [8, 60, 2, 'Περίμετρος Π'], [1, 15, 0.5, 'Δοκιμάζω x']], ex: [[4, 32, 6], [4, 32, 4], [2, 20, 3], [6, 40, 7], [0, 24, 5]] }
];
const OFF = [[0, 2.9], [0, 1.8], [0, 2.8], [-6, 0.8], [1, 2.4]];       // μετατόπιση του σχήματος ώστε να κεντράρεται
const st = { scene: 0, v: CFG.map(c => c.ex[0].slice()) };

const fmt = v => {
  const r = Math.round(v * 100) / 100;
  const s = String(Math.abs(r)).replace('.', ',');
  return (r < 0 ? '−' : '') + s;
};
const par = v => v < 0 ? '(' + fmt(v) + ')' : fmt(v);
const sg = v => (v >= 0 ? ' + ' : ' − ') + fmt(Math.abs(v));       // « + 5» ή « − 5»
const co = v => v === 1 ? '' : (v === -1 ? '−' : fmt(v));

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 60);
const HOME_CAM = new THREE.Vector3(0, 0.3, 3.0), HOME_TGT = new THREE.Vector3(0, 0.3, 0);
camera.position.copy(HOME_CAM);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.minDistance = 0.4;
controls.maxDistance = 6;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(0.8, 1.6, 1.6);
scene.add(sun);

const room = new THREE.Group();            // δάπεδο μόνο σε αδιαφανή λειτουργία (VR)
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2;
  room.add(floor);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.position.y = 0.002;
  room.add(grid);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();
world.scale.setScalar(UNIT);
root.add(world);
const dyn = new THREE.Group();              // το περιεχόμενο που ξαναχτίζεται σε κάθε αλλαγή
world.add(dyn);

// ------------------------------------------------------------------ κείμενα σε υφή
function textTexture(lines, opt = {}) {
  const w = opt.w || 1024, h = opt.h || 256;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (opt.bg) {
    ctx.fillStyle = opt.bg;
    const r = 36;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
    ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath(); ctx.fill();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gap = opt.gap || h / (lines.length + 0.4);
  lines.forEach((ln, i) => {
    let size = ln.size || 64;
    const font = s => `${ln.weight || 600} ${s}px "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif`;
    ctx.font = font(size);
    while (size > 18 && ctx.measureText(ln.t).width > w - 80) { size -= 2; ctx.font = font(size); }
    ctx.fillStyle = ln.color || '#eaf1f8';
    ctx.fillText(ln.t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const labCache = new Map();
function label(t, x, y, color = '#eaf1f8', size = 0.9, z = 0.3) {
  const key = t + color;
  let mat = labCache.get(key);
  if (!mat) {
    mat = new THREE.MeshBasicMaterial({ map: textTexture([{ t, size: 70, weight: 650, color }], { w: 512, h: 128 }), transparent: true, depthWrite: false, side: THREE.DoubleSide });
    labCache.set(key, mat);
  }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size * 4, size), mat);
  m.position.set(x, y, z);
  m.renderOrder = 6;
  dyn.add(m);
  return m;
}

// ------------------------------------------------------------------ βασικά σχήματα
const matCache = new Map();
const mat = c => {
  if (!matCache.has(c)) matCache.set(c, new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.18, roughness: 0.55 }));
  return matCache.get(c);
};
function box(x0, x1, y0, y1, z0, z1, c) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(Math.abs(x1 - x0), 0.001), Math.max(Math.abs(y1 - y0), 0.001), Math.max(Math.abs(z1 - z0), 0.001)), mat(c));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.userData.box = true;
  dyn.add(m);
  return m;
}
function ball(x, y, c, r = 0.3) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat(c));
  m.position.set(x, y, 0.05);
  m.userData.box = true;
  dyn.add(m);
  return m;
}
function seg(x0, y0, x1, y1, c, th = 0.14, z = 0) {       // ευθύγραμμο τμήμα ως λεπτό κουτί
  const len = Math.hypot(x1 - x0, y1 - y0);
  if (len < 0.01) return;
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, th, th), mat(c));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, z);
  m.rotation.z = Math.atan2(y1 - y0, x1 - x0);
  m.userData.box = true;
  dyn.add(m);
}
function dashed(x0, y0, x1, y1, c, th = 0.07) {
  const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 0.45));
  for (let i = 0; i < n; i += 2) seg(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, x0 + (x1 - x0) * (i + 1) / n, y0 + (y1 - y0) * (i + 1) / n, c, th);
}
function clipLine(m, k, xlo, xhi, ylo, yhi) {          // ευθεία y = m x + k μέσα σε ορθογώνιο
  let a = xlo, b = xhi;
  if (Math.abs(m) > 1e-9) {
    const x1 = (ylo - k) / m, x2 = (yhi - k) / m;
    a = Math.max(a, Math.min(x1, x2)); b = Math.min(b, Math.max(x1, x2));
  } else if (k < ylo || k > yhi) return null;
  return a < b ? [a, m * a + k, b, m * b + k] : null;
}

// πίνακας με τον υπολογισμό
const panel = new THREE.Mesh(new THREE.PlaneGeometry(10, 2.5), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide }));
panel.renderOrder = 8;
world.add(panel);
let panelKey = '';
function setPanel(lines, y) {
  panel.position.set(0, y, 0.4);
  const key = JSON.stringify(lines);
  if (key === panelKey) return;
  panelKey = key;
  if (panel.material.map) panel.material.map.dispose();
  panel.material.map = textTexture(lines, { w: 1280, h: 320, bg: 'rgba(14,20,32,.88)', gap: 100 });
  panel.material.needsUpdate = true;
}

// ------------------------------------------------------------------ σκηνές
const $ = id => document.getElementById(id);
const hintEl = $('hint');
const rng = [$('rng0'), $('rng1'), $('rng2')], lbl = [$('lbl0'), $('lbl1'), $('lbl2')], val = [$('val0'), $('val1'), $('val2')];

function axes(x0, x1, y0, y1, stepX, stepY, ky = 1, labX = true, labY = true) {      // άξονες με υποδιαιρέσεις
  seg(x0, 0, x1, 0, COL.ink, 0.06);
  seg(0, y0, 0, y1, COL.ink, 0.06);
  for (let x = Math.ceil(x0 / stepX) * stepX; x <= x1 + 1e-9; x += stepX) if (Math.abs(x) > 1e-9) { seg(x, -0.15, x, 0.15, COL.grey, 0.05); if (labX) label(fmt(x), x, -0.7, '#cbd5e1', 0.45); }
  for (let y = Math.ceil(y0 / stepY) * stepY; y <= y1 + 1e-9; y += stepY) if (Math.abs(y) > 1e-9) { seg(-0.15, y, 0.15, y, COL.grey, 0.05); if (labY) label(fmt(y / ky), -0.9, y, '#cbd5e1', 0.45); }
}

function build() {
  while (dyn.children.length) {
    const o = dyn.children.pop();
    if (o.geometry) o.geometry.dispose();
  }
  const s = st.scene, [p0, p1, p2] = st.v[s];
  let lines, hint, panelY = 9;
  if (s === 0) {
    // η ζυγαριά: x + β = γ, p0 = x, p1 = β, p2 = γ
    const x = p0, b = p1, c = p2, L = x + b, R = c;
    const phi = Math.max(-0.25, Math.min(0.25, (R - L) * 0.04));
    const A = [-5 * Math.cos(phi), 3 + 5 * Math.sin(phi)], B = [5 * Math.cos(phi), 3 - 5 * Math.sin(phi)];
    box(-0.25, 0.25, -3, 3, -0.2, 0.2, 0x1f2937);
    box(-2.2, 2.2, -3.4, -3, -0.9, 0.9, 0x1f2937);
    seg(A[0], A[1], B[0], B[1], 0x94a3b8, 0.3);
    ball(0, 3, 0x1f2937, 0.4);
    [A, B].forEach((E, k) => {
      seg(E[0], E[1], E[0] - 1.8, E[1] - 2, 0x94a3b8, 0.05);
      seg(E[0], E[1], E[0] + 1.8, E[1] - 2, 0x94a3b8, 0.05);
      box(E[0] - 2, E[0] + 2, E[1] - 2.3, E[1] - 2.0, -0.9, 0.9, 0x374151);
      const n = k === 0 ? x + b : c;
      for (let i = 0; i < n; i++) {
        const col = i % 8, row = Math.floor(i / 8);
        const cc = k === 1 ? COL.R : (i < x ? COL.X : COL.L);
        box(E[0] - 1.9 + 0.47 * col, E[0] - 1.9 + 0.47 * col + 0.42, E[1] - 2.0 + 0.47 * row, E[1] - 2.0 + 0.47 * row + 0.42, -0.21, 0.21, cc);
      }
    });
    lines = [{ t: `x${sg(b)} = ${fmt(c)}`, size: 74, weight: 700 },
             { t: L === R ? `Ισορροπεί: x = ${fmt(x)} είναι λύση` : `Δεν ισορροπεί: ${fmt(L)} ≠ ${fmt(R)}`, size: 54, color: L === R ? '#d8b4fe' : '#fca5a5' }];
    hint = `<b>Η ζυγαριά και η εξίσωση:</b> στο αριστερό δίσκο υπάρχουν x = ${fmt(x)} πορτοκαλί κύβοι και β = ${fmt(b)} μπλε κύβοι (σύνολο ${fmt(L)}), στο δεξί γ = ${fmt(c)} πράσινοι. Λύση είναι ο αριθμός x που κάνει τη ζυγαριά να ισορροπεί.`;
    panelY = 8.6;
  } else if (s === 1) {
    // η ίδια πράξη και στα δύο μέλη: p0 = β, p1 = γ, p2 = s
    const b = p0, c = p1, sv = p2, xr = c - b;
    axes(-8, 8, -4, 9, 2, 2);
    [[1, b, COL.L, true], [0, c, COL.R, true]].forEach(([m, k, col]) => { const q = clipLine(m, k, -8, 8, -4, 9); if (q) dashed(q[0], q[1], q[2], q[3], col, 0.06); });
    [[1, b - sv, COL.L], [0, c - sv, COL.R]].forEach(([m, k, col]) => { const q = clipLine(m, k, -8, 8, -4, 9); if (q) seg(q[0], q[1], q[2], q[3], col, 0.2); });
    const yi = c - sv;
    if (xr >= -8 && xr <= 8 && yi >= -4 && yi <= 9) {
      dashed(xr, yi, xr, 0, COL.S, 0.08);
      ball(xr, yi, COL.S, 0.38);
      ball(xr, 0, COL.S, 0.28);
      label('x = ' + fmt(xr), xr, -1.4, '#d8b4fe', 0.7);
    }
    lines = [{ t: sv >= 0 ? `x${sg(b)} − ${fmt(sv)} = ${fmt(c)} − ${fmt(sv)}` : `x${sg(b)} + ${fmt(-sv)} = ${fmt(c)} + ${fmt(-sv)}`, size: 62, weight: 700, color: CSS[1] },
             { t: `x${sg(b - sv)} = ${fmt(c - sv)}   με λύση x = ${fmt(xr)}`, size: 54, color: '#d8b4fe' }];
    hint = `<b>${sv >= 0 ? 'Αφαιρώ' : 'Προσθέτω'} το ${fmt(Math.abs(sv))} και στα δύο μέλη:</b> οι δύο ευθείες (μπλε αριστερό μέλος, πράσινη δεξί μέλος) μετακινούνται, αλλά τέμνονται πάντα στο ίδιο x = ${fmt(xr)}. Οι διακεκομμένες είναι η αρχική εξίσωση.`;
    panelY = 11.4;
  } else if (s === 2) {
    // αx + β = γ με ράβδους: p0 = α, p1 = β, p2 = γ
    const a = p0, b = p1, c = p2, ok = c >= b, xs = (c - b) / a, k = 0.3, x0 = -6;
    box(x0, x0 + c * k, 4.4, 5.2, -0.3, 0.3, COL.R);
    label('γ = ' + fmt(c), x0 + c * k / 2, 5.9, '#5eead4', 0.65);
    if (ok) {
      for (let i = 0; i < a; i++) {
        box(x0 + i * xs * k + 0.02, x0 + (i + 1) * xs * k - 0.02, 1.6, 3.2, -0.3, 0.3, COL.X);
        if (xs * k > 0.9) label('x', x0 + (i + 0.5) * xs * k, 2.4, '#08131a', 0.7, 0.35);
      }
      box(x0 + a * xs * k, x0 + c * k, 1.6, 3.2, -0.3, 0.3, COL.L);
      if (b * k > 0.9) label('β', x0 + (a * xs + b / 2) * k, 2.4, '#ffffff', 0.7, 0.35);
      box(x0, x0 + xs * k, -1.2, 0.4, -0.3, 0.3, COL.S);
      label('x = ' + fmt(xs), x0 + xs * k / 2, -2.0, '#d8b4fe', 0.65);
    }
    lines = ok
      ? [{ t: `${co(a)}x${sg(b)} = ${fmt(c)}   ⇒   x = (${fmt(c)} − ${fmt(b)}) : ${fmt(a)} = ${fmt(xs)}`, size: 58, weight: 700 },
         { t: `Επαλήθευση: ${fmt(a)} · ${fmt(xs)}${sg(b)} = ${fmt(a * xs + b)} = ${fmt(c)}`, size: 50, color: '#d8b4fe' }]
      : [{ t: `${co(a)}x${sg(b)} = ${fmt(c)}`, size: 66, weight: 700 }, { t: 'Για γ < β η λύση είναι αρνητική και οι ράβδοι δεν σχεδιάζονται', size: 46, color: '#fca5a5' }];
    hint = `<b>Λύση με ράβδους:</b> η πράσινη ράβδος είναι το δεξί μέλος γ. Χωρίζεται σε ${fmt(a)} ίσα πορτοκαλί κομμάτια x και ένα μπλε κομμάτι β. Αφαιρώ το β και διαιρώ με το α· το μωβ κομμάτι είναι η λύση x.`;
    panelY = 8;
  } else if (s === 3) {
    // δύο προσφορές: A = p0 + p1 x, B = p2 x
    const a = p0, b = p1, c = p2, ky = 0.1;
    axes(0, 12, 0, 8.2, 2, 2, ky, true, false);
    for (let y = 2; y <= 8; y += 2) label(String(y * 10), -0.9, y, '#cbd5e1', 0.45);
    const line = (m0, k0, col) => { const q = clipLine(m0 * ky, k0 * ky, 0, 12, 0, 8.2); if (q) seg(q[0], q[1], q[2], q[3], col, 0.2); };
    line(b, a, COL.L); line(c, 0, COL.R);
    if (c > b) {
      const xi = a / (c - b), yi = c * xi;
      if (xi <= 12 && yi * ky <= 8.2) {
        dashed(xi, yi * ky, xi, 0, COL.S, 0.08);
        ball(xi, yi * ky, COL.S, 0.4);
        label(fmt(xi) + ' ώρες', xi, -1.3, '#d8b4fe', 0.6);
      }
    }
    label('Ώρες', 12.8, -0.6, '#94a3b8', 0.5);
    label('Κόστος (€)', 1.6, 8.9, '#94a3b8', 0.5);
    lines = c > b
      ? [{ t: `${fmt(a)}${sg(b)}x = ${fmt(c)}x   ⇒   x = ${fmt(a)} : ${fmt(c - b)} = ${fmt(a / (c - b))} ώρες`, size: 54, weight: 700 },
         { t: `Ίδιο κόστος ${fmt(c * a / (c - b))} €. Μπλε: εταιρεία Α. Πράσινη: εταιρεία Β.`, size: 46, color: '#d8b4fe' }]
      : [{ t: `${fmt(a)}${sg(b)}x = ${fmt(c)}x`, size: 62, weight: 700 }, { t: 'Η εξίσωση δεν έχει θετική λύση: η Β δεν ξεπερνά ποτέ την Α', size: 46, color: '#fca5a5' }];
    hint = `<b>Δύο προσφορές:</b> η Α χρεώνει ${fmt(a)} € πάγιο και ${fmt(b)} € ανά ώρα, η Β ${fmt(c)} € ανά ώρα. Οι ευθείες τέμνονται εκεί όπου το κόστος είναι ίδιο· εκεί λύνεται η εξίσωση ${fmt(a)}${sg(b)}x = ${fmt(c)}x.`;
    panelY = 11.2;
  } else {
    // ορθογώνιο: p0 = δ, p1 = Π, p2 = x (πλάτος)
    const d = p0, P = p1, x = p2, Q = 2 * (x + x + d), xs = (P - 2 * d) / 4, k = 0.4, X0 = -6, Y0 = -1;
    const rect = (w, h, col, th) => { seg(X0, Y0, X0 + w * k, Y0, col, th); seg(X0 + w * k, Y0, X0 + w * k, Y0 + h * k, col, th); seg(X0 + w * k, Y0 + h * k, X0, Y0 + h * k, col, th); seg(X0, Y0 + h * k, X0, Y0, col, th); };
    box(X0, X0 + (x + d) * k, Y0, Y0 + x * k, -0.2, 0.2, COL.X);
    if (xs > 0) rect(xs + d, xs, COL.S, 0.18);
    label('x + δ = ' + fmt(x + d), X0 + (x + d) * k / 2, Y0 + Math.max(x, xs > 0 ? xs : 0) * k + 0.9, '#fde68a', 0.65);
    label('x = ' + fmt(x), X0 - 1.6, Y0 + x * k / 2, '#fde68a', 0.65);
    lines = [{ t: `2(x + (x${sg(d)})) = ${fmt(P)}`, size: 64, weight: 700, color: '#d8b4fe' },
             { t: Q === P ? `Για x = ${fmt(x)}: 2(${fmt(x)} + ${fmt(x + d)}) = ${fmt(Q)}. Είναι λύση.` : `Για x = ${fmt(x)}: 2(${fmt(x)} + ${fmt(x + d)}) = ${fmt(Q)}, ${Q < P ? 'λείπουν' : 'περισσεύουν'} ${fmt(Math.abs(P - Q))}`, size: 48, color: Q === P ? '#d8b4fe' : '#fde68a' }];
    hint = `<b>Το ορθογώνιο:</b> πλάτος x και μήκος x + δ με δ = ${fmt(d)}. Περίμετρος 2(x + (x + δ)). ${xs > 0 ? 'Η μωβ γραμμή δείχνει το ορθογώνιο της λύσης x = ' + fmt(xs) + '.' : 'Για αυτά τα δεδομένα δεν υπάρχει ορθογώνιο.'}`;
    panelY = 7.6;
  }
  const off = OFF[s];
  dyn.position.set(off[0], off[1], 0);
  setPanel(lines, panelY + off[1]);
  hintEl.innerHTML = hint;
}

function update() {
  const s = st.scene, cf = CFG[s];
  for (let i = 0; i < 3; i++) {
    const [mn, mx, stp, lb] = cf.p[i];
    rng[i].min = mn; rng[i].max = mx; rng[i].step = stp; rng[i].value = st.v[s][i];
    lbl[i].textContent = lb; val[i].textContent = fmt(st.v[s][i]);
  }
  document.documentElement.style.setProperty('--acc', CSS[s]);
  document.querySelectorAll('#segK button').forEach(x => x.classList.toggle('on', +x.dataset.k === s));
  build();
}
function bump(which, dir) {           // αλλαγή του μεγέθους 0, 1 ή 2 κατά ένα βήμα
  const r = CFG[st.scene].p[which];
  const v = st.v[st.scene][which] + dir * r[2];
  st.v[st.scene][which] = Math.min(r[1], Math.max(r[0], Math.round(v * 100) / 100));
  update();
}
document.querySelectorAll('#segK button').forEach(x => x.onclick = () => { st.scene = +x.dataset.k; update(); });
rng.forEach((r, i) => r.oninput = () => { st.v[st.scene][i] = +r.value; update(); });
function next() {
  const ex = CFG[st.scene].ex, cur = st.v[st.scene];
  const i = ex.findIndex(e => e.every((v, j) => v === cur[j]));
  st.v[st.scene] = ex[(i + 1) % ex.length].slice();
  update();
}
update();

// ------------------------------------------------------------------ XR
const btnAR = $('btnAR'), btnVR = $('btnVR'), note = $('note');
let placed = false, floorRef = true;
async function checkXR() {
  const msg = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) { note.textContent = msg; note.style.display = 'block'; return; }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) { note.textContent = msg; note.style.display = 'block'; }
}
checkXR();

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    session.addEventListener('end', () => {
      room.visible = false;
      scene.background = null;
      root.position.set(0, 0, 0);
      root.quaternion.identity();
      root.scale.setScalar(1);
      camera.position.copy(HOME_CAM);
      controls.target.copy(HOME_TGT);
      controls.update();
    });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

// στην πρώτη εικόνα του XR, το σχήμα τοποθετείται 1,1 m μπροστά από τον χρήστη, στο ύψος των ματιών
function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * 1.1, p.y - 0.6, p.z + dir.z * 1.1);
  root.rotation.set(0, yaw, 0);
  root.scale.setScalar(1);
  room.children[0].position.y = floorRef ? 0 : p.y - 1.5;
  placed = true;
}

// χειριστήρια: σύντομο πάτημα = επόμενο παράδειγμα, παρατεταμένο πάτημα πάνω στο σχήμα = μετακίνηση,
// μοχλός αριστερά και δεξιά: πρώτο μέγεθος (αριστερό χειριστήριο) ή δεύτερο (δεξί), αριστερός μοχλός πάνω και κάτω: τρίτο μέγεθος,
// δεξιός μοχλός πάνω και κάτω: μέγεθος του σχήματος
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    const targets = [];
    world.traverse(o => { if (o.isMesh && o.visible && o.userData.box) targets.push(o); });
    if (ray.intersectObjects(targets, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    if (ctl.userData.grab) { scene.attach(root); ctl.userData.grab = false; }
    if (performance.now() - ctl.userData.t0 < 280) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [makeController(0), makeController(1)];

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let last = performance.now(), acc = 0, accY = 0;
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (frame && !placed) placeInFront(frame);
  if (renderer.xr.isPresenting) {
    acc += dt; accY += dt;
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (!gp || !gp.axes || !gp.axes.length) return;
      const ax = gp.axes.length > 3 ? gp.axes[2] : gp.axes[0];
      const ay = gp.axes.length > 3 ? gp.axes[3] : gp.axes[1];
      const hand = c.userData.source.handedness;
      if (Math.abs(ax) > 0.5 && acc > 0.2) { acc = 0; bump(hand === 'right' ? 1 : 0, ax > 0 ? 1 : -1); }
      if (hand === 'left') { if (Math.abs(ay) > 0.5 && accY > 0.2) { accY = 0; bump(2, ay < 0 ? 1 : -1); } }
      else if (Math.abs(ay) > 0.5) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ay * dt * 0.9), 0.5, 3));
    });
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
});
</script>
