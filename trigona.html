<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}

<script type="module">
// Σενάριο «Τα Τρίγωνα στο Κέντρο Καινοτομίας» (Γ΄ Γυμνασίου και Α΄ Λυκείου) — Σταθμός 4: Η πυραμίδα του Θαλή
// Κέντρο Καινοτομίας Θεσσαλίας. Η Μεγάλη Πυραμίδα (βάση 230,3 m, αρχικό ύψος περίπου 146,6 m) και μια
// κατακόρυφη ράβδος ύψους 2 m φωτίζονται από τον ήλιο, που βρίσκεται στον νότο. Οι ακτίνες είναι παράλληλες,
// οπότε η γωνία τους με το έδαφος είναι η ίδια για τη ράβδο και για την πυραμίδα: τα δύο ορθογώνια τρίγωνα
// (ύψος, σκιά, ακτίνα) είναι όμοια και H / (S + β/2) = h / s. Στις 45° τα τρίγωνα είναι ισοσκελή.
// Μονάδα μήκους: 1 μέτρο. Προβολή 3D και VR σε κλίμακα 1:1, AR πάνω στο θρανίο σε κλίμακα 1:1000,
// με τη ράβδο δίπλα σε μεγέθυνση 1:20.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const H = 146.6, BASE = 230.3, HB = BASE / 2;      // ύψος και βάση της πυραμίδας, μισό της βάσης
const STICK_H = 2;                                   // ύψος της ράβδου
const STICK = new THREE.Vector3(30, 0, -220);        // θέση της ράβδου, βόρεια της πυραμίδας και πέρα από τις σκιές
const AR_SCALE = 1 / 1000, INSET = 50;               // 1:1000 η σκηνή, 1:20 η ράβδος (50 × 1/1000)
const SCENE_C = new THREE.Vector3(30, 0, -160);      // κέντρο της σύνθεσης (πυραμίδα, σκιά, ράβδος σε μεγέθυνση) στο AR
const FACE = 51.85;                                  // κλίση των εδρών σε μοίρες

const f = (x, d) => x.toFixed(d).replace('.', ',');
const rad = THREE.MathUtils.degToRad;
const STATES = [45, 40, 35, 50, 40].map((e, k) => {
  const t = Math.tan(rad(e)), L = H / t, S = L - HB, s = STICK_H / t;
  return { e, L, S, s, sim: k === 4, sTxt: f(s, 2), STxt: f(S, 1) };
});
STATES.forEach(st => {
  const Hc = (parseFloat(st.STxt.replace(',', '.')) + HB) * STICK_H / parseFloat(st.sTxt.replace(',', '.'));
  st.HTxt = f(Hc, 1);
});
const HINTS = [
  s => `<b>Ήλιος 45°:</b> στις 45° η σκιά κάθε κατακόρυφου αντικειμένου έχει το ίδιο μήκος με το ύψος του. Η ράβδος των 2 m ρίχνει σκιά s = ${s.sTxt} m. Η σκιά της πυραμίδας ξεπερνά την πλευρά της βάσης κατά S = ${s.STxt} m, και το μισό της βάσης είναι β/2 = 115,15 m.`,
  s => `<b>Ήλιος 40°:</b> η ράβδος h = 2 m ρίχνει σκιά s = ${s.sTxt} m, μεγαλύτερη από το ύψος της. Η σκιά της πυραμίδας ξεπερνά την πλευρά της βάσης κατά S = ${s.STxt} m. Οι ακτίνες του ήλιου είναι παράλληλες, άρα σχηματίζουν την ίδια γωνία με το έδαφος στη ράβδο και στην πυραμίδα.`,
  s => `<b>Ήλιος 35°:</b> s = ${s.sTxt} m και S = ${s.STxt} m. Όσο χαμηλώνει ο ήλιος, τόσο μακραίνουν όλες οι σκιές, αλλά ο λόγος του ύψους προς τη σκιά μένει ο ίδιος για όλα τα αντικείμενα την ίδια στιγμή.`,
  s => `<b>Ήλιος 50°:</b> s = ${s.sTxt} m και S = ${s.STxt} m. Η σκιά της πυραμίδας μόλις βγαίνει έξω από τη βάση, γιατί οι έδρες της έχουν κλίση 51,85°, λίγο μεγαλύτερη από τη γωνία του ήλιου. Όταν ο ήλιος είναι ψηλότερα από 51,85°, η πυραμίδα δεν ρίχνει σκιά έξω από τη βάση της.`,
  s => `<b>Τα δύο όμοια τρίγωνα (ήλιος 40°):</b> το τρίγωνο της ράβδου, με κάθετες πλευρές h και s, και το τρίγωνο της πυραμίδας, με κάθετες πλευρές H και S + β/2, είναι ορθογώνια και έχουν την ίδια γωνία 40° με το έδαφος, άρα είναι όμοια. Οι ομόλογες πλευρές τους είναι ανάλογες: H/(S + β/2) = h/s, οπότε H = (${s.STxt} + 115,15) · 2/${s.sTxt} ≈ ${s.HTxt} m. Το αρχικό ύψος της πυραμίδας ήταν περίπου 146,6 m και η διαφορά οφείλεται στη στρογγυλοποίηση των μετρήσεων.`
];
const PANELS = [
  s => [`Ήλιος ${s.e}°`, `Ράβδος: h = 2 m, s = ${s.sTxt} m`, `Πυραμίδα: S = ${s.STxt} m, β/2 = 115,15 m`],
  s => [`Ήλιος ${s.e}°`, `Ράβδος: h = 2 m, s = ${s.sTxt} m`, `Πυραμίδα: S = ${s.STxt} m, β/2 = 115,15 m`],
  s => [`Ήλιος ${s.e}°`, `Ράβδος: h = 2 m, s = ${s.sTxt} m`, `Πυραμίδα: S = ${s.STxt} m, β/2 = 115,15 m`],
  s => [`Ήλιος ${s.e}°`, `Ράβδος: h = 2 m, s = ${s.sTxt} m`, `Πυραμίδα: S = ${s.STxt} m, β/2 = 115,15 m`],
  s => [`Τα δύο όμοια τρίγωνα (ήλιος ${s.e}°)`, `H/(S + β/2) = h/s`, `H = (${s.STxt} + 115,15) · 2/${s.sTxt} ≈ ${s.HTxt} m`]
];

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 1, 8000);
const CAM0 = new THREE.Vector3(860, 250, 40), TGT0 = new THREE.Vector3(0, 40, -78);
camera.position.copy(CAM0);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(TGT0);
controls.enableDamping = true;
controls.minDistance = 25;
controls.maxDistance = 2400;
controls.maxPolarAngle = rad(86);
controls.update();

// πλαίσιο της προβολής 3D: σε κατακόρυφη οθόνη η κάμερα απομακρύνεται και η εικόνα ανεβαίνει πάνω από τα κουμπιά
const FOV = 32;
let barBottom = 62, touched = false;
controls.addEventListener('start', () => { touched = true; });
function layoutView() {
  const W = window.innerWidth, Hh = window.innerHeight;
  barBottom = Math.round(document.getElementById('bar').getBoundingClientRect().bottom);
  let dy = 0;
  if (W / Hh < 1.2) {
    const dockTop = document.getElementById('dock').getBoundingClientRect().top;
    dy = Math.max(0, Math.round(Hh / 2 - (barBottom + dockTop) / 2));
  }
  const FH = Hh + 2 * dy;
  camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(rad(FOV / 2)) * FH / Hh));
  camera.aspect = W / FH;
  if (dy) camera.setViewOffset(W, FH, 0, 2 * dy, W, Hh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if (!renderer.xr.isPresenting) setLabelScale(W / Hh < 1 ? 1.3 : 1);
}
function homeView() {
  const a = window.innerWidth / window.innerHeight;
  const k = a < 1 ? Math.pow(1 / a, 0.6) : 1;
  const tgt = TGT0.clone();
  if (a < 1) tgt.z -= 22 * Math.min(1, (1 - a) / 0.5);
  camera.position.copy(CAM0).sub(TGT0).multiplyScalar(k).add(tgt);
  controls.target.copy(tgt);
  controls.update();
}

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a3b22, 1.15));
const sunLight = new THREE.DirectionalLight(0xfff4dc, 2.3);
scene.add(sunLight, sunLight.target);

// μεγάλο έδαφος και ουρανός μόνο στο VR
const vrWorld = new THREE.Group();
vrWorld.visible = false;
scene.add(vrWorld);

const root = new THREE.Group();          // ό,τι μετακινείται και κλιμακώνεται στο XR
scene.add(root);
const world = new THREE.Group();         // η σκηνή σε μέτρα
root.add(world);

// ------------------------------------------------------------------ κείμενα σε υφή
function textTexture(lines, opt = {}) {
  const w = opt.w || 1024, h = opt.h || 256;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (opt.bg) {
    ctx.fillStyle = opt.bg;
    const r = 36;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
    ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath(); ctx.fill();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gap = opt.gap || h / (lines.length + 0.4);
  lines.forEach((ln, i) => {
    let size = ln.size || 64;
    const font = s => `${ln.weight || 600} ${s}px "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif`;
    ctx.font = font(size);
    while (size > 18 && ctx.measureText(ln.t).width > w - 60) { size -= 2; ctx.font = font(size); }
    if (opt.halo) { ctx.lineWidth = Math.max(6, size / 7); ctx.strokeStyle = 'rgba(14,20,32,.85)'; ctx.strokeText(ln.t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap); }
    ctx.fillStyle = ln.color || '#eaf1f8';
    ctx.fillText(ln.t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// ετικέτα με ύψος σε μέτρα, πάντα στραμμένη προς τον θεατή και ορατή μπροστά από τα άλλα αντικείμενα
function labelTexture(text, color) {
  const size = 120, pad = 40;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const font = `700 ${size}px "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif`;
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 2 * pad, h = Math.ceil(size * 1.5);
  cv.width = w; cv.height = h;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 20;
  ctx.strokeStyle = 'rgba(14,20,32,.88)';
  ctx.strokeText(text, w / 2, h / 2);
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return { tex, aspect: w / h };
}
function label(text, color, height) {
  const { tex, aspect } = labelTexture(text, color);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  sp.renderOrder = 20;
  sp.userData = { text, color, h: height, aspect, k: 1 };
  sp.scale.set(height * aspect, height, 1);
  return sp;
}
function fitLabel(sp) { const u = sp.userData; sp.scale.set(u.h * u.k * u.aspect, u.h * u.k, 1); }
function setLabel(sp, text) {
  if (sp.userData.text === text) return;
  sp.material.map.dispose();
  const { tex, aspect } = labelTexture(text, sp.userData.color);
  sp.material.map = tex;
  sp.material.needsUpdate = true;
  Object.assign(sp.userData, { text, aspect });
  fitLabel(sp);
}

// ------------------------------------------------------------------ βοηθητικά γεωμετρίας
const UP = new THREE.Vector3(0, 1, 0);
function bar(a, b, r, mat) {               // κύλινδρος από το a στο b
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10, 1), mat);
  m.userData.r = r;
  placeBar(m, a, b);
  return m;
}
function placeBar(m, a, b) {
  const len = Math.max(a.distanceTo(b), 1e-6);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, b.clone().sub(a).normalize());
  m.scale.set(1, len, 1);
}
function dashed(r, mat, n = 14) {          // διακεκομμένη γραμμή από ν τμήματα
  const g = new THREE.Group();
  for (let i = 0; i < n; i++) g.add(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 8, 1), mat));
  g.userData.n = n;
  return g;
}
function placeDashed(g, a, b) {
  const n = g.userData.n;
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 0.55) / n;
    placeBar(g.children[i], a.clone().lerp(b, t0), a.clone().lerp(b, t1));
  }
}
function arcPoints(c, a1, a2, r, n = 24) {  // τόξο στο κατακόρυφο επίπεδο x = σταθερό, γωνίες από τον άξονα +z
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = a1 + (a2 - a1) * i / n;
    pts.push(new THREE.Vector3(c.x, c.y + r * Math.sin(t), c.z + r * Math.cos(t)));
  }
  return pts;
}

  // τόξο της γωνίας του ήλιου στην άκρη της σκιάς

  triBig.geometry.attributes.position.array.set([0, 0.3, 0, 0, H, 0, 0, 0.3, -Lz]);
  triBig.geometry.attributes.position.needsUpdate = true;

async function checkXR() {
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';

    note.style.display = 'block';
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap\u00a02 ή Meta Quest\u00a03.';

}

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    // τα όρια βάθους της κάμερας περνούν στη συνεδρία XR: στο AR η σκηνή είναι 0,85 m μπροστά, στο VR η πυραμίδα σε εκατοντάδες μέτρα
    camera.near = 0.05;
    camera.far = kind === 'immersive-vr' ? 6000 : 100;
    camera.updateProjectionMatrix();
    await renderer.xr.setSession(session);
    placed = false;
    xrKind = kind;
    pipEl.style.display = 'none';
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    scene.background = opaque ? new THREE.Color(kind === 'immersive-vr' ? 0x9fc4e8 : 0x0e1420) : null;
    session.addEventListener('end', () => { xrKind = ''; resetView(); });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}

// VR: ο χρήστης στέκεται δίπλα στη ράβδο, κοιτάζοντας προς την πυραμίδα (νότος), όπως ο Θαλής
const STAND = new THREE.Vector3(STICK.x + 2.0, 0, STICK.z - 3.0);
{
  const big = new THREE.Mesh(new THREE.CircleGeometry(3000, 64), new THREE.MeshStandardMaterial({ color: 0xc4a874, roughness: 1 }));
  big.rotation.x = -Math.PI / 2;
  big.position.y = -0.05;

}
function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  if (xrKind === 'immersive-vr') {
    // ο άξονας +z της σκηνής (προς την πυραμίδα) γίνεται η κατεύθυνση του βλέμματος
    const yaw = Math.atan2(dir.x, dir.z);
    root.scale.setScalar(1);
    root.rotation.set(0, yaw, 0);
    const off = STAND.clone().applyAxisAngle(UP, yaw);
    root.position.set(p.x - off.x, floorY, p.z - off.z);
    vrWorld.visible = true;
    vrWorld.position.set(0, floorY, 0);
    inset.visible = false;
    stick.visible = true;
    lStick.visible = false;
    sunBall.visible = true;
    setLabelScale(0.5);                    // από τη θέση της ράβδου η πυραμίδα απέχει 100-250 m
    // ο πίνακας 1,9 m μακριά, 40° αριστερά από τη διεύθυνση προς την πυραμίδα, λίγο κάτω από τα μάτια
    const pd = dir.clone().applyAxisAngle(UP, rad(40));
    panel.position.set(p.x + pd.x * 1.9, p.y - 0.2, p.z + pd.z * 1.9);
    panel.scale.setScalar(0.65);
  } else {
    // AR: σκηνή 1:1000 στο θρανίο, με τον βορρά (κατεύθυνση των σκιών) δεξιά του χρήστη
    const right = new THREE.Vector3(-dir.z, 0, dir.x);
    const yaw = Math.atan2(-right.x, -right.z);
    root.scale.setScalar(AR_SCALE);
    root.rotation.set(0, yaw, 0);
    const c = SCENE_C.clone().multiplyScalar(AR_SCALE).applyAxisAngle(UP, yaw);
    root.position.set(p.x + dir.x * 0.85 - c.x, p.y - 0.32, p.z + dir.z * 0.85 - c.z);
    inset.visible = true;
    stick.visible = false;
    lStick.visible = false;
    sunBall.visible = false;
    setLabelScale(1.6);
    stickLabels(stickIn.userData, 1.5);
    root.add(panel);
    panel.position.set(SCENE_C.x, 270, SCENE_C.z);
    panel.scale.setScalar(130);
  }
  panel.visible = true;
  placed = true;
}

// χειριστήρια: σύντομο πάτημα = επόμενη κατάσταση, και στο AR παρατεταμένο πάτημα πάνω στη σκηνή = μετακίνηση
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    if (xrKind !== 'immersive-ar') return;
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    const targets = [];
    world.traverse(o => { if (o.isMesh && !o.material.userData.top) targets.push(o); });
    if (ray.intersectObjects(targets, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    if (ctl.userData.grab) { scene.attach(root); ctl.userData.grab = false; }
    if (performance.now() - ctl.userData.t0 < 280) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [makeController(0), makeController(1)];

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
  layoutPip();
});

// στην προβολή 3D, η δεύτερη κάμερα δείχνει τη ράβδο και τα στοιχεία της πυραμίδας κρύβονται εκεί
const bigLabels = [];
world.traverse(o => { if (o.isSprite && o.userData.big) bigLabels.push(o); });
const pipHide = () => [...bigLabels, lineS, rayApex, triBig, lineH, lineB, rightBig, shadow, sunBall, arcBig, arcBig2].filter(Boolean);
const su = stick.userData;
const pipLabels = k => stickLabels(su, k);   // σε μικρή οθόνη οι ετικέτες της ράβδου μεγαλώνουν στη δεύτερη κάμερα
let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (frame && !placed) placeInFront(frame);
  animate(dt);
  if (renderer.xr.isPresenting) {
    // ο πίνακας γυρίζει πάντα προς τον χρήστη
    const eye = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
    const pw = new THREE.Vector3();
    panel.getWorldPosition(pw);
    const yawP = Math.atan2(eye.x - pw.x, eye.z - pw.z);
    const parentQ = new THREE.Quaternion();
    if (panel.parent) panel.parent.getWorldQuaternion(parentQ);
    panel.quaternion.copy(parentQ.invert()).multiply(new THREE.Quaternion().setFromAxisAngle(UP, yawP));
    if (xrKind === 'immersive-ar') {
      // ο μοχλός του χειριστηρίου μεγαλώνει ή μικραίνει τη σκηνή
      ctls.forEach(c => {
        const gp = c.userData.source && c.userData.source.gamepad;
        if (gp && gp.axes && gp.axes.length) {
          const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
          if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * dt * 0.9), AR_SCALE * 0.5, AR_SCALE * 4));
        }
      });
    }
    renderer.render(scene, camera);
  } else {
    controls.update();
    const W = window.innerWidth, Hh = window.innerHeight;
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W, Hh);
    renderer.render(scene, camera);
    // δεύτερη κάμερα, σε ορθογώνιο πάνω δεξιά
    const r = pipRect();
    if (pipEl.style.display !== 'block') pipEl.style.display = 'block';
    const hide = pipHide();
    hide.forEach(o => { o.userData.pv = o.visible; o.visible = false; });
    const kP = THREE.MathUtils.clamp(330 / r.w, 1, 1.8);
    if (kP > 1) pipLabels(kP);
    renderer.autoClear = false;
    renderer.setScissorTest(true);
    renderer.setScissor(r.x, Hh - r.y - r.h, r.w, r.h);
    renderer.setViewport(r.x, Hh - r.y - r.h, r.w, r.h);
    renderer.setClearColor(0x16202f, 1);
    renderer.clear();
    renderer.render(scene, pipCam);
    renderer.setClearColor(0x000000, 0);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W, Hh);
    renderer.autoClear = true;
    hide.forEach(o => { o.visible = o.userData.pv; });
    if (kP > 1) pipLabels(1);
  }
});
</script>
</body>
