<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Σύνολα | Maths - AR</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F4F6F8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #37474F; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui-panel { pointer-events: auto; position: absolute; left: 0; right: 0; bottom: 0; max-height: 46vh; overflow: auto; background: rgba(255,255,255,0.95); border-top: 3px solid #FFC000; padding: 10px 16px 14px; box-sizing: border-box; }
  #ui-head { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 16px; }
  #ui-title { font-size: 20px; font-weight: 700; color: #1A237E; }
  #ui-sub { font-size: 13px; color: #546E7A; }
  #ui-xr { margin: 8px 0 2px; display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: 600 15px system-ui, sans-serif; padding: 8px 14px; border: 1px solid #90A4AE; border-radius: 4px; background: #ECEFF1; color: #263238; cursor: pointer; }
  button.on { background: #1A237E; border-color: #1A237E; color: #fff; }
  button.xr { background: #00838F; border-color: #00838F; color: #fff; }
  button.exit { display: none; }
  #ui.inxr button.exit { display: inline-block; }
  #ui-states { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .row { display: grid; grid-template-columns: minmax(150px, 260px) 1fr; align-items: center; column-gap: 14px; margin: 5px 0; }
  .row span { font-weight: 600; color: #EF6C00; }
  .row input[type=range] { width: 100%; accent-color: #EF6C00; height: 28px; }
  #ui-anim { margin: 4px 0 6px; background: #00838F; border-color: #00838F; color: #fff; }
  #ui-info div { white-space: pre-wrap; }
  #ui-info { margin-top: 6px; font-size: 15px; line-height: 1.45; font-weight: 600; }
  #ui-info .formula { font-size: 18px; color: #1565C0; margin-bottom: 2px; }
  .note { font-size: 13px; color: #78909C; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } #ui-panel { max-height: 52vh; } }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="ui-panel">
    <div id="ui-head"><span id="ui-title"></span><span id="ui-sub"></span></div>
    <div id="ui-xr"></div>
    <div id="ui-states"></div>
    <div id="ui-params"></div>
    <div id="ui-info"></div>
  </div>
</div>
<script type="module">
  import { start } from './synola-lib.js';
  start();
</script>
</body>
</html>
