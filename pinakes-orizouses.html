<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Πίνακες και ορίζουσες, Γ΄ Λυκείου</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"}}</script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#ECEFF1;color:#212121;overflow:hidden}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;left:12px;top:12px;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(255,255,255,.95);border-radius:10px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  #ttl{font-weight:700;color:#1A237E;font-size:17px;margin:0 0 4px}
  .sub{font-size:12px;color:#546E7A;margin:0 0 8px}
  .row{display:block;margin:6px 0}
  .nm{display:block;font-size:13px;color:#EF6C00;font-weight:600}
  input[type=range]{width:100%;accent-color:#EF6C00}
  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{border:0;border-radius:8px;padding:9px 12px;background:#1565C0;color:#fff;font-size:14px;cursor:pointer}
  button[disabled]{background:#B0BEC5;cursor:default}
  button.alt{background:#7B1FA2}
  body.xr-nodom #ui{display:none}
  body.xr #cv{background:transparent}
  #end{display:none;background:#C62828}
  body.xr #end{display:inline-block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <h1 id="ttl" style="font-size:17px"></h1>
  <p class="sub">Κέντρο Καινοτομίας Θεσσαλίας, Γ΄ Λυκείου, Πίνακες και ορίζουσες</p>
  <div id="sliders"></div>
  <div id="readout"></div>
  <div class="btns">
    <button id="ar" disabled>Επαυξημένη πραγματικότητα</button>
    <button id="vr" class="alt" disabled>Εικονική πραγματικότητα</button>
    <button id="end">Έξοδος</button>
  </div>
</div>
<script>window.addEventListener('error',function(e){var r=document.getElementById('readout');if(r)r.textContent='Σφάλμα: '+e.message;});</script>
<script type="module">
  import { createApp } from './pinakes-orizouses-lib.js?v=2';
  const k = (parseInt(new URLSearchParams(location.search).get('k') || '0', 10) || 0) + 1;
  const app = createApp({ canvas: document.getElementById('cv'), overlay: document.getElementById('ui'), k });
  window.__app = app;
  const ar = document.getElementById('ar'), vr = document.getElementById('vr');
  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((s) => { ar.disabled = !s; }).catch(() => {});
    navigator.xr.isSessionSupported('immersive-vr').then((s) => { vr.disabled = !s; }).catch(() => {});
  }
  ar.onclick = () => app.startXR('immersive-ar');
  vr.onclick = () => app.startXR('immersive-vr');
  document.getElementById('end').onclick = () => app.endXR();
</script>
</body>
</html>
