<!DOCTYPE html>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js"}}</script>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#ECEFF1;color:#212121;overflow:hidden}

  #ttl{font-weight:700;color:#1A237E;font-size:17px;margin:0 0 4px}

  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

</style>

<body>
<canvas id="cv"></canvas>
<div id="ui">
  <h1 id="ttl" style="font-size:17px"></h1>
  <p class="sub">Κέντρο Καινοτομίας Θεσσαλίας, Γ΄ Λυκείου, Πίνακες και ορίζουσες</p>
  <div id="sliders"></div>
  <div id="readout"></div>
  <div class="btns">
    <button id="ar" disabled>Επαυξημένη πραγματικότητα</button>
    <button id="vr" class="alt" disabled>Εικονική πραγματικότητα</button>
    <button id="end">Έξοδος</button>
  </div>
</div>
<script>window.addEventListener('error',function(e){var r=document.getElementById('readout');if(r)r.textContent='Σφάλμα: '+e.message;});</script>
<script type="module">
// Πίνακες και ορίζουσες, Γ΄ Λυκείου. Κέντρο Καινοτομίας Θεσσαλίας.
// Καταστάσεις: ?k=1 έως ?k=6
import * as THREE from 'three';

const C = { blue: 0x1565C0, green: 0x2E7D32, purple: 0x7B1FA2, red: 0xC62828, orange: 0xEF6C00, teal: 0x00838F, navy: 0x1A237E, gray: 0x546E7A };
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
const SC = 0.1; // μέτρα ανά μονάδα
const m = (x, y, z = 0) => new THREE.Vector3(x * SC, z * SC, -y * SC);
const fmt = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(2).replace(/\.?0+$/, '')).replace('.', ',');
const det2 = (a, b, c, d) => a * d - b * c;
const det3 = (r) => r[0][0] * (r[1][1] * r[2][2] - r[1][2] * r[2][1]) - r[0][1] * (r[1][0] * r[2][2] - r[1][2] * r[2][0]) + r[0][2] * (r[1][0] * r[2][1] - r[1][1] * r[2][0]);

// ---- βοηθητικά αντικείμενα -------------------------------------------------
const lineMat = (c, o = 1) => new THREE.LineBasicMaterial({ color: c, transparent: o < 1, opacity: o });
function polyline(points, color, closed = false, opacity = 1) {
  const g = new THREE.BufferGeometry().setFromPoints(points);
  return closed ? new THREE.LineLoop(g, lineMat(color, opacity)) : new THREE.Line(g, lineMat(color, opacity));
}
function setPoly(obj, points) { obj.geometry.setFromPoints(points); obj.geometry.computeBoundingSphere(); }
function quad(color, opacity = 0.35) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(18), 3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false }));
}
function setQuad(mesh, p) { // p: 4 σημεία
  const a = mesh.geometry.attributes.position; const idx = [0, 1, 2, 0, 2, 3];
  idx.forEach((i, j) => a.setXYZ(j, p[i].x, p[i].y, p[i].z)); a.needsUpdate = true; mesh.geometry.computeBoundingSphere();
}
function arrow(color) { const a = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.1, color, 0.02, 0.012); return a; }
function setArrow(a, from, to) {
  const d = new THREE.Vector3().subVectors(to, from); const L = d.length();
  a.visible = L > 1e-4; if (!a.visible) return;
  a.position.copy(from); a.setDirection(d.normalize()); a.setLength(L, Math.min(0.025, L * 0.4), 0.012);
}
function dot(color, r = 0.009) { return new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshBasicMaterial({ color })); }
function gridXY(n, color = 0xCFD8DC) {
  const pts = [];
  for (let i = -n; i <= n; i++) { pts.push(m(i, -n), m(i, n), m(-n, i), m(n, i)); }
  return new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), lineMat(color, 0.9));
}
function axes2(n) {
  const g = new THREE.Group();
  g.add(polyline([m(-n, 0), m(n, 0)], 0x607D8B), polyline([m(0, -n), m(0, n)], 0x607D8B));
  return g;
}
function axes3(n) {
  const g = new THREE.Group();
  g.add(polyline([m(-n, 0, 0), m(n, 0, 0)], 0xC62828, false, 0.8), polyline([m(0, -n, 0), m(0, n, 0)], 0x2E7D32, false, 0.8), polyline([m(0, 0, -n), m(0, 0, n)], 0x1565C0, false, 0.8));
  return g;
}
function textTexture(lines, opts = {}) {
  const w = opts.w || 640, h = opts.h || 256, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'); x.clearRect(0, 0, w, h);
  if (opts.bg) { x.fillStyle = opts.bg; x.fillRect(0, 0, w, h); }
  let y = 14;
  for (const l of lines) {
    const size = l.size || 34; x.font = `${l.bold ? 'bold ' : ''}${size}px sans-serif`; x.fillStyle = l.color || '#212121'; x.textBaseline = 'top';
    x.fillText(l.t, 16, y); y += size * 1.35;
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { tex: t, canvas: cv };
}

// ---- καταστάσεις -----------------------------------------------------------
// Κάθε κατάσταση: { title, params:[{n,min,max,step,init,label}], make(group)->{update(P)->lines[]} }
const STATES = {
  1: {
    title: 'Πίνακας ως μετασχηματισμός και εμβαδόν',
    params: [
      { n: 'a', min: -3, max: 3, step: 1, init: 2, label: 'a' }, { n: 'b', min: -3, max: 3, step: 1, init: 1, label: 'b' },
      { n: 'c', min: -3, max: 3, step: 1, init: 0, label: 'c' }, { n: 'd', min: -3, max: 3, step: 1, init: 2, label: 'd' }],
    make(g) {
      g.add(gridXY(4), axes2(4));
      const sq = quad(C.blue, 0.25), im = quad(C.purple, 0.4);
      const sqL = polyline([m(0, 0), m(1, 0), m(1, 1), m(0, 1)], C.blue, true), imL = polyline([m(0, 0), m(1, 0), m(1, 1), m(0, 1)], C.purple, true);
      const e1 = arrow(C.red), e2 = arrow(C.green);
      g.add(sq, im, sqL, imL, e1, e2);
      return (P) => {
        const { a, b, c, d } = P, D = det2(a, b, c, d);
        setQuad(sq, [m(0, 0), m(1, 0), m(1, 1), m(0, 1)]);
        const p = [m(0, 0), m(a, c), m(a + b, c + d), m(b, d)];
        setQuad(im, p); setPoly(imL, p);
        im.material.color.set(D > 0 ? C.purple : D < 0 ? C.red : C.gray); imL.material.color.set(D > 0 ? C.purple : D < 0 ? C.red : C.gray);
        setArrow(e1, m(0, 0), m(a, c)); setArrow(e2, m(0, 0), m(b, d));
        return [
          { t: `A = [ ${fmt(a)}  ${fmt(b)} ; ${fmt(c)}  ${fmt(d)} ]`, color: hex(C.blue), bold: true },
          { t: `det A = ${fmt(D)}`, color: hex(C.purple), bold: true, size: 40 },
          { t: D === 0 ? 'Το τετράγωνο καταρρέει σε ευθύγραμμο τμήμα.' : (D > 0 ? 'Ο προσανατολισμός διατηρείται.' : 'Ο προσανατολισμός αντιστρέφεται.'), color: hex(C.gray), size: 28 },
          { t: `Εμβαδόν εικόνας = |det A| = ${fmt(Math.abs(D))}`, color: hex(C.teal), size: 28 }];
      };
    }
  },
  2: {
    title: 'Σύστημα 2×2 και τομή δύο ευθειών',
    params: [
      { n: 'a', min: -4, max: 4, step: 1, init: 1, label: 'a₁' }, { n: 'b', min: -4, max: 4, step: 1, init: 2, label: 'b₁' }, { n: 'e', min: -8, max: 8, step: 1, init: 4, label: 'c₁' },
      { n: 'c', min: -4, max: 4, step: 1, init: 2, label: 'a₂' }, { n: 'd', min: -4, max: 4, step: 1, init: -1, label: 'b₂' }, { n: 'f', min: -8, max: 8, step: 1, init: 3, label: 'c₂' }],
    make(g) {
      g.add(gridXY(6), axes2(6));
      const l1 = polyline([m(0, 0), m(1, 1)], C.blue), l2 = polyline([m(0, 0), m(1, 1)], C.green), pt = dot(C.orange, 0.012);
      g.add(l1, l2, pt);
      const seg = (A, B, Cc) => { // A x + B y = Cc, ευθύγραμμο τμήμα μέσα στο [-6,6]^2
        if (A === 0 && B === 0) return [m(0, 0), m(0, 0)];
        const dirx = -B, diry = A, n2 = A * A + B * B, px = A * Cc / n2, py = B * Cc / n2, t = 20;
        return [m(px - dirx * t, py - diry * t), m(px + dirx * t, py + diry * t)];
      };
      const clip = (pts) => pts; // οι τιμές περιορίζονται από το πεδίο των ολισθητών
      return (P) => {
        const { a, b, c, d, e, f } = P, D = det2(a, b, c, d), Dx = det2(e, b, f, d), Dy = det2(a, e, c, f);
        const sg = (A, B, Cc) => { const s = seg(A, B, Cc); const bb = 6 * SC; return s.map((v) => v.clone()); };
        setPoly(l1, sg(a, b, e)); setPoly(l2, sg(c, d, f));
        pt.visible = D !== 0; if (D !== 0) pt.position.copy(m(Dx / D, Dy / D));
        const res = D !== 0 ? `(x, y) = (${fmt(Dx / D)}, ${fmt(Dy / D)})` : (Dx === 0 && Dy === 0 ? 'Άπειρες λύσεις: ίδια ευθεία.' : 'Καμία λύση: παράλληλες ευθείες.');
        return [
          { t: `D = ${fmt(D)},  Dx = ${fmt(Dx)},  Dy = ${fmt(Dy)}`, color: hex(C.purple), bold: true },
          { t: res, color: hex(C.orange), bold: true, size: 38 },
          { t: D !== 0 ? 'Μοναδική λύση με τον κανόνα του Cramer.' : 'D = 0: οι ευθείες είναι παράλληλες ή ταυτίζονται.', color: hex(C.gray), size: 28 }];
      };
    }
  },
  3: {
    title: 'Ορίζουσα 3×3 και όγκος παραλληλεπιπέδου',
    params: ['u', 'v', 'w'].flatMap((r, i) => [1, 2, 3].map((j) => ({ n: `${'abc'[i]}${j}`, min: -3, max: 3, step: 1, init: [[2, 0, 0], [1, 2, 0], [0, 1, 2]][i][j - 1], label: `${r}${'₁₂₃'[j - 1]}` }))),
    make(g) {
      g.add(axes3(4));
      const faces = [C.purple, C.purple, C.purple, C.purple, C.purple, C.purple].map((c) => quad(c, 0.22));
      const edges = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(new Array(24).fill(new THREE.Vector3())), lineMat(C.purple));
      const au = arrow(C.blue), av = arrow(C.green), aw = arrow(C.red);
      faces.forEach((f) => g.add(f)); g.add(edges, au, av, aw);
      return (P) => {
        const U = [P.a1, P.a2, P.a3], V = [P.b1, P.b2, P.b3], W = [P.c1, P.c2, P.c3];
        const add = (...vs) => vs.reduce((s, v) => [s[0] + v[0], s[1] + v[1], s[2] + v[2]], [0, 0, 0]);
        const pt = (v) => m(v[0], v[1], v[2]);
        const O = [0, 0, 0], UV = add(U, V), UW = add(U, W), VW = add(V, W), UVW = add(U, V, W);
        const F = [[O, U, UV, V], [W, UW, UVW, VW], [O, U, UW, W], [V, UV, UVW, VW], [O, V, VW, W], [U, UV, UVW, UW]];
        faces.forEach((f, i) => setQuad(f, F[i].map(pt)));
        const E = [[O, U], [U, UV], [UV, V], [V, O], [W, UW], [UW, UVW], [UVW, VW], [VW, W], [O, W], [U, UW], [UV, UVW], [V, VW]];
        edges.geometry.setFromPoints(E.flatMap((e) => [pt(e[0]), pt(e[1])]));
        setArrow(au, pt(O), pt(U)); setArrow(av, pt(O), pt(V)); setArrow(aw, pt(O), pt(W));
        const D = det3([U, V, W]);
        return [
          { t: `det A = ${fmt(D)}`, color: hex(C.purple), bold: true, size: 40 },
          { t: `Όγκος = |det A| = ${fmt(Math.abs(D))}`, color: hex(C.teal), bold: true },
          { t: D === 0 ? 'Τα u, v, w είναι συνεπίπεδα.' : (D > 0 ? 'Δεξιόστροφο σύστημα.' : 'Αριστερόστροφο σύστημα.'), color: hex(C.gray), size: 28 }];
      };
    }
  },
  4: {
    title: 'Σύστημα 3×3 και τρία επίπεδα',
    params: [{ n: 'cs', min: 1, max: 2, step: 1, init: 1, label: 'Πίνακας' }, { n: 'd1', min: -4, max: 4, step: 1, init: 2, label: 'd₁' }, { n: 'd2', min: -4, max: 4, step: 1, init: 3, label: 'd₂' }, { n: 'd3', min: -8, max: 8, step: 1, init: 1, label: 'd₃' }],
    make(g) {
      g.add(axes3(4));
      const pls = [quad(C.blue, 0.3), quad(C.green, 0.3), quad(C.red, 0.3)], pt = dot(C.orange, 0.014);
      pls.forEach((p) => g.add(p)); g.add(pt);
      const M = [[[1, 1, 1], [1, -1, 2], [2, 1, -1]], [[1, 1, 1], [1, 2, 3], [2, 3, 4]]];
      return (P) => {
        const A = M[P.cs - 1], d = [P.d1, P.d2, P.d3];
        A.forEach((row, i) => {
          const n = new THREE.Vector3(row[0], row[1], row[2]), n2 = n.lengthSq(), p0 = n.clone().multiplyScalar(d[i] / n2);
          const u = new THREE.Vector3().crossVectors(n, Math.abs(n.x) < 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)).normalize();
          const v = new THREE.Vector3().crossVectors(n, u).normalize(); const h = 4;
          const q = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([s, t]) => { const w = p0.clone().addScaledVector(u, s).addScaledVector(v, t); return m(w.x, w.y, w.z); });
          setQuad(pls[i], q);
        });
        const D = det3(A);
        const rep = (cc, r) => A.map((row, i) => row.map((v, j) => (j === cc ? d[i] : v)));
        pt.visible = D !== 0;
        let res;
        if (D !== 0) { const x = det3(rep(0)) / D, y = det3(rep(1)) / D, z = det3(rep(2)) / D; pt.position.copy(m(x, y, z)); res = `(x, y, z) = (${fmt(x)}, ${fmt(y)}, ${fmt(z)})`; }
        else res = d[2] === d[0] + d[1] ? 'Άπειρες λύσεις: κοινή ευθεία.' : 'Καμία λύση: χωρίς κοινό σημείο.';
        return [
          { t: `det A = ${fmt(D)}`, color: hex(C.purple), bold: true, size: 40 },
          { t: res, color: hex(C.orange), bold: true, size: 36 },
          { t: P.cs === 2 ? 'Γραμμή 3 = γραμμή 1 + γραμμή 2.' : 'Τρία επίπεδα σε γενική θέση.', color: hex(C.gray), size: 28 }];
      };
    }
  },
  5: {
    title: 'Ιδιοτιμές και ιδιοδιανύσματα',
    params: [
      { n: 'a', min: -4, max: 4, step: 1, init: 2, label: 'a' }, { n: 'b', min: -4, max: 4, step: 1, init: 1, label: 'b' },
      { n: 'c', min: -4, max: 4, step: 1, init: 1, label: 'c' }, { n: 'd', min: -4, max: 4, step: 1, init: 2, label: 'd' },
      { n: 'phi', min: 0, max: 360, step: 5, init: 30, label: 'Γωνία v (°)' }],
    make(g) {
      g.add(gridXY(6), axes2(6));
      const N = 96, circ = polyline(new Array(N + 1).fill(m(0, 0)), C.blue), ell = polyline(new Array(N + 1).fill(m(0, 0)), C.purple);
      const e1 = polyline([m(0, 0), m(1, 0)], C.green), e2 = polyline([m(0, 0), m(1, 0)], C.teal);
      const av = arrow(C.blue), aAv = arrow(C.purple);
      g.add(circ, ell, e1, e2, av, aAv);
      return (P) => {
        const { a, b, c, d } = P, ph = P.phi * Math.PI / 180, T = a + d, D = det2(a, b, c, d), disc = T * T - 4 * D;
        const cp = [], ep = [];
        for (let i = 0; i <= N; i++) { const t = 2 * Math.PI * i / N; cp.push(m(Math.cos(t), Math.sin(t))); ep.push(m(a * Math.cos(t) + b * Math.sin(t), c * Math.cos(t) + d * Math.sin(t))); }
        setPoly(circ, cp); setPoly(ell, ep);
        const vx = Math.cos(ph), vy = Math.sin(ph), Ax = a * vx + b * vy, Ay = c * vx + d * vy;
        setArrow(av, m(0, 0), m(vx, vy)); setArrow(aAv, m(0, 0), m(Ax, Ay));
        let l1 = 0, l2 = 0; e1.visible = e2.visible = disc >= 0;
        if (disc >= 0) {
          l1 = (T + Math.sqrt(disc)) / 2; l2 = (T - Math.sqrt(disc)) / 2;
          const ev = (l) => (b !== 0 ? [b, l - a] : c !== 0 ? [l - d, c] : (l === a ? [1, 0] : [0, 1]));
          for (const [ln, l] of [[e1, l1], [e2, l2]]) { const [x, y] = ev(l), n = Math.hypot(x, y) || 1, s = 8 / n; setPoly(ln, [m(-x * s, -y * s), m(x * s, y * s)]); }
        }
        const cr = vx * Ay - vy * Ax;
        return [
          { t: `A = [ ${fmt(a)}  ${fmt(b)} ; ${fmt(c)}  ${fmt(d)} ]`, color: hex(C.blue), bold: true },
          { t: `p(λ) = λ² − ${fmt(T)}λ + ${fmt(D)}`, color: hex(C.gray), size: 30 },
          { t: disc >= 0 ? `λ₁ = ${fmt(l1)},  λ₂ = ${fmt(l2)}` : `λ = ${fmt(T / 2)} ± ${fmt(Math.sqrt(-disc) / 2)} i`, color: hex(C.teal), bold: true, size: 38 },
          { t: Math.abs(cr) < 0.05 ? 'Το Av είναι παράλληλο στο v.' : 'Το Av δεν είναι παράλληλο στο v.', color: hex(C.purple), size: 28 }];
      };
    }
  },
  6: {
    title: 'Πίνακας μετάβασης και μακροχρόνια συμπεριφορά',
    params: [
      { n: 'p', min: 0, max: 1, step: 0.05, init: 0.8, label: 'P(1→1)' }, { n: 'q', min: 0, max: 1, step: 0.05, init: 0.4, label: 'P(2→1)' },
      { n: 's0', min: 0, max: 1, step: 0.1, init: 0.1, label: 'Αρχικό ποσοστό' }],
    make(g) {
      const S6 = 0.04, K = 20, bars1 = [], bars2 = [];
      const base = polyline([m(-0.5, 0), m(K + 0.5, 0)], 0x607D8B); g.add(base);
      const mk = (c) => new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.85 }));
      for (let k = 0; k <= K; k++) { const b1 = mk(C.blue), b2 = mk(C.green); bars1.push(b1); bars2.push(b2); g.add(b1, b2); }
      const st = polyline([m(-0.5, 0), m(K + 0.5, 0)], C.blue, false, 0.7), st2 = polyline([m(-0.5, 0), m(K + 0.5, 0)], C.green, false, 0.7); g.add(st, st2);
      const H = 8;
      return (P) => {
        const { p, q, s0 } = P, den = 1 - p + q, ss = den === 0 ? s0 : q / den;
        for (let k = 0; k <= K; k++) {
          const sk = ss + Math.pow(p - q, k) * (s0 - ss), x = k * 0.9 - 9;
          const h1 = Math.max(sk * H, 0.02), h2 = Math.max((1 - sk) * H, 0.02);
          bars1[k].scale.set(0.3 * S6, h1 * S6, 0.3 * S6); bars1[k].position.set((x - 0.17) * S6, h1 * S6 / 2, 0);
          bars2[k].scale.set(0.3 * S6, h2 * S6, 0.3 * S6); bars2[k].position.set((x + 0.17) * S6, h2 * S6 / 2, 0);
        }

          { t: `P = [ ${fmt(p)}  ${fmt(q)} ; ${fmt(1 - p)}  ${fmt(1 - q)} ]`, color: hex(C.purple), bold: true },
          { t: `x∞ = ( ${fmt(ss)} , ${fmt(1 - ss)} )`, color: hex(C.teal), bold: true, size: 38 },
          { t: `λ₁ = 1,  λ₂ = p − q = ${fmt(p - q)}`, color: hex(C.gray), size: 28 },
          { t: Math.abs(p - q) < 1 ? 'Οι καταστάσεις τείνουν στην x∞.' : 'Δεν υπάρχει σύγκλιση.', color: hex(C.gray), size: 28 }];

const STATE_IDS = Object.keys(STATES).map(Number);
const stateTitle = (k) => STATES[k].title;

// ---- εφαρμογή ---------------------------------------------------------------
function createApp({ canvas, overlay, k }) {
  const st = STATES[k] || STATES[1];
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.xr.enabled = true;
  const scene = new THREE.Scene(); scene.background = null;
  const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 30); camera.position.set(0, 0.55, 0.75); camera.lookAt(0, 0.05, 0);
  const root = new THREE.Group(); scene.add(root);
  const content = new THREE.Group(); root.add(content);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(0.55, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.5 }));
  floor.position.y = -0.002; content.add(floor);
  const update = st.make(content);
  const P = {}; st.params.forEach((p) => { P[p.n] = p.init; });

  // πίνακας κειμένου πάνω από το περιεχόμενο
  const info = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.2), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide }));
  info.position.set(0.12, 0.42, -0.5); root.add(info);

  // πίνακας ολισθητών 3D (για γυαλιά)
  const PW = 0.5, rowH = 0.055, PH = rowH * (st.params.length + 1);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide }));
  panel.position.set(-0.55, 0.45, 0.0); panel.rotation.y = 0.5; panel.scale.setScalar(1.25); root.add(panel); panel.visible = false;
  const pc = document.createElement('canvas'); pc.width = 512; pc.height = Math.round(512 * PH / PW); const pctx = pc.getContext('2d');
  const ptex = new THREE.CanvasTexture(pc); ptex.colorSpace = THREE.SRGBColorSpace; panel.material.map = ptex;
  const drawPanel = () => {
    pctx.fillStyle = 'rgba(255,255,255,0.96)'; pctx.fillRect(0, 0, pc.width, pc.height);
    const rh = pc.height / (st.params.length + 1);
    pctx.font = 'bold 30px sans-serif'; pctx.fillStyle = hex(C.navy); pctx.textBaseline = 'middle'; pctx.fillText('Παράμετροι', 18, rh / 2);
    st.params.forEach((p, i) => {
      const y = rh * (i + 1.5), x0 = 150, x1 = 480, t = (P[p.n] - p.min) / (p.max - p.min);
      pctx.font = '28px sans-serif'; pctx.fillStyle = '#212121'; pctx.fillText(`${p.label} = ${fmt(P[p.n])}`, 18, y - 2);
      pctx.strokeStyle = '#FFCC80'; pctx.lineWidth = 6; pctx.beginPath(); pctx.moveTo(x0, y); pctx.lineTo(x1, y); pctx.stroke();
      pctx.fillStyle = hex(C.orange); pctx.beginPath(); pctx.arc(x0 + t * (x1 - x0), y, 12, 0, 7); pctx.fill();
    });
    ptex.needsUpdate = true;
  };
  const sliderFromUV = (uv) => {
    const rh = 1 / (st.params.length + 1), row = Math.floor((1 - uv.y) / rh) - 1;
    if (row < 0 || row >= st.params.length) return false;
    const p = st.params[row], t = Math.min(1, Math.max(0, (uv.x * 512 - 150) / 330));
    P[p.n] = Math.round((p.min + t * (p.max - p.min)) / p.step) * p.step; P[p.n] = Math.round(P[p.n] * 1000) / 1000; refresh(); syncDom(); return true;
  };
  const drawInfo = (lines) => {
    const { tex } = textTexture(lines.map((l) => ({ ...l, size: (l.size || 34) * 1.45 })), { w: 960, h: 384, bg: 'rgba(255,255,255,0.94)' });
    if (info.material.map) info.material.map.dispose(); info.material.map = tex; info.material.needsUpdate = true;
  };
  function refresh() { drawInfo([{ t: st.title, color: hex(C.navy), bold: true, size: 24 }, ...update(P)]); drawPanel(); domText(); }

  // ---- DOM: ολισθητές στην οθόνη και στο AR των tablets ----
  const box = overlay.querySelector('#sliders'), titleEl = overlay.querySelector('#ttl'), readout = overlay.querySelector('#readout');
  titleEl.textContent = st.title;
  const inputs = {};
  st.params.forEach((p) => {
    const row = document.createElement('label'); row.className = 'row';
    const name = document.createElement('span'); name.className = 'nm'; row.appendChild(name);
    const inp = document.createElement('input'); inp.type = 'range'; inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = p.init;
    inp.addEventListener('input', () => { P[p.n] = parseFloat(inp.value); refresh(); });
    row.appendChild(inp); box.appendChild(row); inputs[p.n] = { inp, name, p };
  });
  function syncDom() { for (const n in inputs) inputs[n].inp.value = P[n]; }
  function domText() { for (const n in inputs) inputs[n].name.textContent = `${inputs[n].p.label} = ${fmt(P[n])}`; readout.textContent = update.last ? '' : ''; }
  refresh();

  // ---- προβολή στην οθόνη ----
  let yaw = 0.5, pitch = 0.5, dist = 1.0, drag = null;
  const orbit = () => { camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + 0.1, Math.cos(yaw) * Math.cos(pitch) * dist); camera.lookAt(0, 0.12, 0); };
  orbit();
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.min(1.4, Math.max(0.05, pitch + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY }; orbit(); });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('wheel', (e) => { dist = Math.min(2.2, Math.max(0.4, dist * (1 + e.deltaY * 0.001))); orbit(); e.preventDefault(); }, { passive: false });
  const resize = () => { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  window.addEventListener('resize', resize); resize();

  // ---- WebXR ----
  let session = null, reticle = null, hitSource = null, placed = false, domOverlayOn = false;
  const ctrls = [0, 1].map((i) => { const c = renderer.xr.getController(i); const ray = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]), lineMat(C.orange)); ray.scale.z = 1.5; c.add(ray); c.userData.ray = ray; scene.add(c); return c; });
  const raycaster = new THREE.Raycaster(), tmpM = new THREE.Matrix4();
  const pick = (c) => { tmpM.identity().extractRotation(c.matrixWorld); raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld); raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpM); const h = raycaster.intersectObject(panel, false); return h[0] || null; };
  let held = null;
  ctrls.forEach((c) => {
    c.addEventListener('selectstart', () => { const h = pick(c); if (h && h.uv) { held = c; sliderFromUV(h.uv); } else if (!placed && reticle && reticle.visible) place(reticle.matrix); });
    c.addEventListener('selectend', () => { if (held === c) held = null; });
  });
  scene.add(reticle = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: C.orange }))); reticle.matrixAutoUpdate = false; reticle.visible = false;
  function place(mat) { const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); mat.decompose(p, q, s); root.position.copy(p); root.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0); placed = true; reticle.visible = false; }

  const say = (t) => { readout.textContent = t; };
  async function startXR(mode) {

    panel.visible = !domOverlayOn; info.visible = true;
    const feats = session.enabledFeatures || [], hasFloor = feats.includes('local-floor');
    const tableY = hasFloor ? 0.85 : -0.35; // ύψος θρανίου ως προς το δάπεδο ή το κεφάλι
    root.position.set(0, tableY, -0.9); placed = true;

const out = document.getElementById('readout');
const k = (parseInt(new URLSearchParams(location.search).get('k') || '0', 10) || 0) + 1;
try {
  const app = createApp({ canvas: document.getElementById('cv'), overlay: document.getElementById('ui'), k });
  window.__app = app;
  const ar = document.getElementById('ar'), vr = document.getElementById('vr');
  if (navigator.xr) {
    navigator.xr.isSessionSupported('immersive-ar').then((s) => { ar.disabled = !s; }).catch(() => {});
    navigator.xr.isSessionSupported('immersive-vr').then((s) => { vr.disabled = !s; }).catch(() => {});
  }
  ar.onclick = () => app.startXR('immersive-ar');
  vr.onclick = () => app.startXR('immersive-vr');

} catch (e) {

}
