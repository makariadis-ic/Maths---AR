<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR — Στερεό</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#2dd4bf}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  model-viewer{width:100%;height:100%;--poster-color:#0e1420;background:
    radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.9),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px}
  #bar h1{font-size:15px;margin:0;font-weight:640}
  #bar .lv{font-size:11px;color:var(--dim);margin-left:auto}
  #arbtn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;
    font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:var(--acc);
    border:none;border-radius:12px;padding:15px 26px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer}
  #note{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;display:none;
    font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:10px 15px;border-radius:10px;max-width:88%;text-align:center;line-height:1.55}
  #note b{color:var(--ink)}
  #tomes{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:10;display:none;
    gap:6px;flex-wrap:wrap;justify-content:center;max-width:94%}
  #tomes button{font:600 12.5px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;cursor:pointer}
  #tomes button.on{color:#08131a;background:var(--acc);border-color:transparent}
  #note .addr{font-family:ui-monospace,Consolas,monospace;color:#f5a524;word-break:break-all}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
<div id="bar">
  <a href="index.html">‹ Πίσω</a>
  <h1 id="title">Στερεό</h1>
  <span class="lv" id="level"></span>
</div>

<model-viewer id="mv" camera-controls auto-rotate autoplay touch-action="pan-y"
  shadow-intensity="1" exposure="1.05" ar ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto" ar-placement="floor">
</model-viewer>

<button id="arbtn">📱 Δες το στο θρανίο (AR)</button>
<div id="note"></div>
<div id="tomes"></div>

<script>
const USDZ=new Set(['kylindros','konos','sfaira','paravoloeides','salpigga']);
const META={
  kylindros:['Κύλινδρος','Λύκειο','#38bdf8'], konos:['Κώνος','Λύκειο','#ff6b6b'],
  sfaira:['Σφαίρα','Λύκειο','#4ade80'], paravoloeides:['Παραβολοειδές √x','Γ΄ Λυκείου','#f5a524'],
  salpigga:['Σάλπιγγα Γαβριήλ','Εμβάθυνση','#c084fc'],
  conics:['Κωνικές τομές','Λύκειο','#ff8a5b'], svd:['Σφαίρα → Ελλειψοειδές (SVD)','Πανεπιστήμιο','#60a5fa'],
  fuzzy:['Ασαφείς συνεπαγωγές','Μεταπτυχιακό','#c084fc']
};

const asked=new URLSearchParams(location.search).get('id');
const id=(asked&&META[asked])?asked:'paravoloeides';
const meta=META[id];
const mv=document.getElementById('mv');
const btn=document.getElementById('arbtn'), note=document.getElementById('note');

document.getElementById('title').textContent=meta[0];
document.getElementById('level').textContent=meta[1];
document.documentElement.style.setProperty('--acc',meta[2]);
mv.src=id+'.glb';
if(USDZ.has(id)) mv.setAttribute('ios-src', id+'.usdz');

function showNote(html){ note.innerHTML=html; note.style.display='block'; btn.style.display='none'; }

/* το AR χρειάζεται ασφαλή σύνδεση (https ή localhost) */
const secure = window.isSecureContext || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);

if(asked && !META[asked])
  showNote('Άγνωστο μοντέλο <span class="addr">'+String(asked).replace(/[<>&]/g,'')+'</span>. '+
           'Δείχνω το προεπιλεγμένο — <a href="index.html" style="color:var(--acc)">πίσω στον πίνακα</a>.');

mv.addEventListener('error',()=>{
  showNote('<b>Το αρχείο του μοντέλου δεν βρέθηκε.</b><br>Λείπει το <span class="addr">'+id+'.glb</span> '+
           'από τον διακομιστή. Ανέβασε <b>όλα</b> τα αρχεία του φακέλου (.glb και .usdz) δίπλα στο '+
           '<span class="addr">m.html</span> — δες το <a href="check.html" style="color:var(--acc)">check.html</a>.');
});

mv.addEventListener('load',()=>{
  if(!secure){
    showNote('Η σελίδα δεν σερβίρεται με <b>HTTPS</b>, οπότε το AR δεν επιτρέπεται από το κινητό. '+
             'Μπορείς όμως να περιστρέψεις το στερεό με το δάχτυλο.');
    return;
  }
  if(!mv.canActivateAR){
    showNote('Σε αυτή τη συσκευή δεν υπάρχει AR — μπορείς όμως να περιστρέψεις το στερεό με το δάχτυλο. '+
             'Άνοιξέ το από κινητό (Chrome σε Android, Safari σε iPhone) για AR στο θρανίο.');
  }
});

mv.addEventListener('ar-status',e=>{
  if(e.detail.status==='failed')
    showNote('Το AR δεν ξεκίνησε σε αυτή τη συσκευή. Δοκίμασε Chrome (Android) ή Safari (iPhone), '+
             'και βεβαιώσου ότι η διεύθυνση αρχίζει με <b>https://</b>.');
});

/* Οι τέσσερις τομές μέσα στην κίνηση των 14 δευτερολέπτων του μοντέλου.
   Σε κάθε μία το επίπεδο μένει ακίνητο για 2,4 s· κρατάμε το μέσο του διαστήματος. */
const TOMES={kyklos:['Κύκλος',1.2],elleipsi:['Έλλειψη',4.7],paravoli:['Παραβολή',8.2],ypervoli:['Υπερβολή',11.7]};
const q=new URLSearchParams(location.search);
let pending=null;

if(id==='conics'){
  const row=document.getElementById('tomes');
  row.style.display='flex';
  const mark=el=>[...row.children].forEach(b=>b.classList.toggle('on',b===el));
  for(const k in TOMES){
    const b=document.createElement('button');
    b.textContent=TOMES[k][0];
    b.onclick=()=>{ mv.currentTime=TOMES[k][1]; mv.pause(); mark(b); };
    row.appendChild(b);
  }
  const play=document.createElement('button');
  play.textContent='Συνεχής κίνηση';
  play.onclick=()=>{ mv.play(); mark(play); };
  row.appendChild(play);

  /* Με παράμετρο στη διεύθυνση η σελίδα ανοίγει κατευθείαν σε μια τομή:
     m.html?id=conics&tomi=elleipsi  ή  m.html?id=conics&t=4.7 */
  const tomi=q.get('tomi'), t=parseFloat(q.get('t'));
  if(tomi && TOMES[tomi]) pending=[TOMES[tomi][1], [...row.children][Object.keys(TOMES).indexOf(tomi)]];
  else if(!isNaN(t)) pending=[t, null];
}

mv.addEventListener('load',()=>{
  if(pending){
    mv.currentTime=pending[0]; mv.pause();
    if(pending[1]) pending[1].classList.add('on');
  }
});

btn.addEventListener('click',()=>{
  try{ mv.activateAR(); }
  catch(e){ showNote('Το AR δεν ξεκίνησε. Δοκίμασε από Chrome (Android) ή Safari (iPhone).'); }
});
</script>
</body>
</html>
