<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Διανύσματα — XR</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#3b82f6}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px}
  #bar h1{font-size:15px;margin:0;font-weight:640}
  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto}
  #dock{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg button{font:600 14px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:10px 14px;cursor:pointer}
  .seg button.on{color:#08131a;background:var(--acc);border-color:transparent}
  .xr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .xr button{font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:#2dd4bf;
    border:none;border-radius:12px;padding:14px 22px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer;
    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:780px;text-align:center;line-height:1.5}
  #hint b{color:var(--ink)}
  #note{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;max-width:640px;text-align:center;line-height:1.55;display:none}
  #fallback{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(92vw,80vh);height:auto}
  #ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:13.5px}
  #ctl input[type=range]{width:min(40vw,190px);accent-color:var(--acc)} #rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:6px 22px} .row{display:flex;align-items:center;gap:8px;justify-content:space-between} .row span{min-width:7.5em} #ctl b{color:var(--ink);min-width:4.2em;text-align:left}
  #ctl .seg button{padding:8px 12px;font-size:13px}
  .nogl #fallback{display:block} .nogl #c,.nogl #segK,.nogl #ctl,.nogl #hint{display:none}
  @media (max-width:560px){ .seg button{padding:9px 10px;font-size:12.5px} #hint{font-size:11.5px} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="fallback" viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">
<line x1="10" y1="110" x2="210" y2="110" stroke="#e2e8f0" stroke-width="1.5"/><line x1="40" y1="130" x2="40" y2="10" stroke="#e2e8f0" stroke-width="1.5"/>
<line x1="40" y1="110" x2="130" y2="70" stroke="#3b82f6" stroke-width="4"/><line x1="130" y1="70" x2="150" y2="30" stroke="#22c55e" stroke-width="4"/>
<line x1="40" y1="110" x2="150" y2="30" stroke="#a855f7" stroke-width="4"/>
<text x="110" y="136" font-size="12" font-weight="700" text-anchor="middle" fill="#eaf1f8">Διανύσματα: α + β</text>
</svg>
<div id="bar">
  <a href="index.html">‹ Πίσω</a>
  <h1>Διανύσματα</h1>
  <span class="lv">Β΄ Λυκείου, §1.1 έως §1.5</span>
</div>
<div id="dock">
  <div class="seg" id="segK"></div>
  <div id="ctl">
    <div id="rows"></div>
    <div class="seg" id="segD" style="display:none">
      <button data-d="0" class="on">Πρόσθεση α + β</button><button data-d="1">Αφαίρεση α − β</button>
    </div>
  </div>
  <div id="hint"></div>
  <div class="xr">
    <button id="btnAR">Είσοδος σε AR</button>
    <button id="btnVR" class="vr">Είσοδος σε VR</button>
  </div>
  <div id="note"></div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
// Σενάριο 40 «Διανύσματα» — Β΄ Λυκείου, Μαθηματικά Προσανατολισμού, Κεφ. 1 (§1.1 έως §1.5)
// Κέντρο Καινοτομίας Θεσσαλίας. Μονάδα του χώρου: 1 = 10 cm.
// Σκηνές: ΑΒ και συντεταγμένες, πρόσθεση και αφαίρεση, αριθμός επί διάνυσμα, εσωτερικό γινόμενο, πτήση με άνεμο.
// Χρώματα όπως στις εφαρμογές GeoGebra: α μπλε, β πράσινο, αποτέλεσμα μωβ, αρνητικό κόκκινο, συνιστώσες τιρκουάζ.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const UNIT = 0.1;
const COL = { pos: 0x3b82f6, b: 0x22c55e, neg: 0xef4444, neg2: 0x22c55e, res: 0xa855f7, comp: 0x22c55e, comp2: 0x14b8a6, grey: 0x64748b, ink: 0xe2e8f0 };
const fmt = v => {
  const r = Math.round(v * 1e5) / 1e5;
  const s = String(Math.abs(r)).replace('.', ',');
  return (r < 0 ? '−' : '') + s;
};
const par = v => v < 0 ? '(' + fmt(v) + ')' : fmt(v);

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.01, 60);
const HOME_CAM = new THREE.Vector3(0, -0.3, 4.0), HOME_TGT = new THREE.Vector3(0, -0.3, 0);
camera.position.copy(HOME_CAM);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.minDistance = 0.4;
controls.maxDistance = 5;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(0.8, 1.6, 1.6);
scene.add(sun);

const room = new THREE.Group();            // δάπεδο μόνο σε αδιαφανή λειτουργία (VR)
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2;
  room.add(floor);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.position.y = 0.002;
  room.add(grid);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();
world.scale.setScalar(UNIT);
root.add(world);
const dyn = new THREE.Group();              // το περιεχόμενο που ξαναχτίζεται σε κάθε αλλαγή
world.add(dyn);

// ------------------------------------------------------------------ κείμενα σε υφή
function textTexture(lines, opt = {}) {
  const w = opt.w || 1024, h = opt.h || 256;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  if (opt.bg) {
    ctx.fillStyle = opt.bg;
    const r = 36;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
    ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath(); ctx.fill();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gap = opt.gap || h / (lines.length + 0.4);
  lines.forEach((ln, i) => {
    let size = ln.size || 64;
    const font = s => `${ln.weight || 600} ${s}px "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif`;
    ctx.font = font(size);
    while (size > 18 && ctx.measureText(ln.t).width > w - 80) { size -= 2; ctx.font = font(size); }
    ctx.fillStyle = ln.color || '#eaf1f8';
    ctx.fillText(ln.t, w / 2, h / 2 + (i - (lines.length - 1) / 2) * gap);
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const labCache = new Map();
function label(t, x, y, color = '#eaf1f8', size = 0.9, z = 0.2) {
  const key = t + color;
  let mat = labCache.get(key);
  if (!mat) {
    mat = new THREE.MeshBasicMaterial({ map: textTexture([{ t, size: 70, weight: 650, color }], { w: 384, h: 128 }), transparent: true, depthWrite: false, side: THREE.DoubleSide });
    labCache.set(key, mat);
  }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size * 3, size), mat);
  m.position.set(x, y, z);
  m.renderOrder = 6;
  dyn.add(m);
  return m;
}

// ------------------------------------------------------------------ βασικά σχήματα
const matCache = new Map();
const mat = c => {
  if (!matCache.has(c)) matCache.set(c, new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.18, roughness: 0.55 }));
  return matCache.get(c);
};
const Y = new THREE.Vector3(0, 1, 0);
function put(geo, c, pos, dir, grab = true) {
  const m = new THREE.Mesh(geo, mat(c));
  m.position.copy(pos);
  if (dir) m.quaternion.setFromUnitVectors(Y, dir);
  m.userData.box = grab;
  dyn.add(m);
  return m;
}
function box(x0, x1, y0, y1, z0, z1, c) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(Math.abs(x1 - x0), 0.001), Math.max(Math.abs(y1 - y0), 0.001), Math.max(Math.abs(z1 - z0), 0.001)), mat(c));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.userData.box = true;
  dyn.add(m);
  return m;
}
function ball(x, y, c, r = 0.26) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat(c));
  m.position.set(x, y, 0.05);
  m.userData.box = true;
  dyn.add(m);
  return m;
}
// διάνυσμα από το (x0,y0) στο (x1,y1) στο επίπεδο xy: κύλινδρος και κώνος, προαιρετικά διακεκομμένο
function vec(x0, y0, x1, y1, c, r = 0.11, z = 0, dash = false) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 0.06) return;
  const dir = new THREE.Vector3(dx / L, dy / L, 0);
  const head = Math.min(0.62, L * 0.5), shaft = L - head;
  const start = new THREE.Vector3(x0, y0, z);
  if (!dash) {
    put(new THREE.CylinderGeometry(r, r, shaft, 14), c, start.clone().addScaledVector(dir, shaft / 2), dir);
  } else {
    const on = 0.32, off = 0.22;
    for (let t = 0; t < shaft - 0.05; t += on + off) {
      const len = Math.min(on, shaft - t);
      put(new THREE.CylinderGeometry(r, r, len, 10), c, start.clone().addScaledVector(dir, t + len / 2), dir);
    }
  }
  put(new THREE.ConeGeometry(r * 2.8, head, 18), c, start.clone().addScaledVector(dir, L - head / 2), dir);
}
function ln(x0, y0, x1, y1, c, r = 0.025, z = -0.02) {      // λεπτή γραμμή
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L < 0.01) return;
  const dir = new THREE.Vector3(dx / L, dy / L, 0);
  put(new THREE.CylinderGeometry(r, r, L, 8), c, new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, z), dir, false);
}
function dashLine(x0, y0, x1, y1, c, r = 0.03) {
  const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(L / 0.4));
  for (let i = 0; i < n; i += 2) ln(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, x0 + (x1 - x0) * (i + 1) / n, y0 + (y1 - y0) * (i + 1) / n, c, r);
}
function axes2(R = 6) {
  ln(-R - 0.4, 0, R + 0.4, 0, COL.ink, 0.035, 0);
  ln(0, -R - 0.4, 0, R + 0.4, COL.ink, 0.035, 0);
  label('x', R + 0.8, -0.45, '#cbd5e1', 0.6);
  label('y', 0.5, R + 0.8, '#cbd5e1', 0.6);
  for (let i = -R; i <= R; i++) if (i) {
    const col = i < 0 ? '#fca5a5' : '#93c5fd';
    ln(i, -0.12, i, 0.12, COL.ink, 0.02, 0);
    ln(-0.12, i, 0.12, i, COL.ink, 0.02, 0);
    if (Math.abs(i) % 2 === 0) {
      label(fmt(i), i, -0.62, col, 0.42);
      label(fmt(i), -0.72, i, col, 0.42);
    }
  }
}
function lab(t, x, y, nx, ny, color, size = 0.62) { label(t, x + nx, y + ny, color, size, 0.35); }   // ετικέτα με μετατόπιση

// πίνακας με τον υπολογισμό
const panel = new THREE.Mesh(new THREE.PlaneGeometry(9, 2.25), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide }));
panel.renderOrder = 8;
world.add(panel);
let panelKey = '';
function setPanel(lines, y) {
  panel.position.set(0, y, 0.3);
  const key = JSON.stringify(lines);
  if (key === panelKey) return;
  panelKey = key;
  if (panel.material.map) panel.material.map.dispose();
  panel.material.map = textTexture(lines, { w: 1280, h: 320, bg: 'rgba(14,20,32,.88)', gap: lines.length > 2 ? 96 : 110 });
  panel.material.needsUpdate = true;
}
const grid = new THREE.GridHelper(14, 14, 0x3b4a63, 0x27324a);     // πλέγμα στο επίπεδο xy
grid.rotation.x = Math.PI / 2;
grid.position.z = -0.1;
world.add(grid);

// ------------------------------------------------------------------ σκηνές
const $ = id => document.getElementById(id);
const hintEl = $('hint'), rowsEl = $('rows'), segD = $('segD'), segK = $('segK');
const P = (k, label, min, max, step, unit = '') => ({ k, label, min, max, step, unit });
const SCENES = [
  { name: 'Το διάνυσμα ΑΒ', acc: '#3b82f6',
    p: [P('xA', 'xA', -5, 5, 1), P('yA', 'yA', -5, 5, 1), P('xB', 'xB', -5, 5, 1), P('yB', 'yB', -5, 5, 1)],
    init: [-3, -1, 3, 2], ex: [[-3, -1, 3, 2], [2, 3, -4, -2], [-4, 2, 1, -3], [1, 1, 1, 1], [0, 0, 4, 3], [-5, -5, 5, 5]] },
  { name: 'Πρόσθεση και αφαίρεση', acc: '#a855f7',
    p: [P('ax', 'αx', -5, 5, 1), P('ay', 'αy', -5, 5, 1), P('bx', 'βx', -5, 5, 1), P('by', 'βy', -5, 5, 1)],
    init: [4, 1, 1, 3], ex: [[4, 1, 1, 3], [-3, 2, 4, 1], [3, 3, -3, -3], [2, -3, -4, 2], [5, 0, 0, 5], [-2, -2, 2, 2]] },
  { name: 'Αριθμός επί διάνυσμα', acc: '#a855f7',
    p: [P('ax', 'αx', -4, 4, 1), P('ay', 'αy', -4, 4, 1), P('l', 'λ', -3, 3, 0.5)],
    init: [2, 1, 1.5], ex: [[2, 1, 1.5], [2, 1, -1], [3, -2, 2], [-2, 3, -0.5], [2, 1, 0], [4, 3, -1.5]] },
  { name: 'Εσωτερικό γινόμενο', acc: '#14b8a6',
    p: [P('ax', 'αx', -5, 5, 1), P('ay', 'αy', -5, 5, 1), P('bx', 'βx', -5, 5, 1), P('by', 'βy', -5, 5, 1)],
    init: [4, 1, 2, 3], ex: [[4, 1, 2, 3], [3, 0, 0, 4], [4, 1, -3, 2], [-4, 1, 3, -1], [3, 2, -2, 3], [5, 0, 5, 0]] },
  { name: 'Πτήση με άνεμο', acc: '#f59e0b',
    p: [P('U', 'Ταχύτητα u', 100, 300, 50, ' km/h'), P('tu', 'Διεύθυνση u', 0, 345, 15, '°'), P('W', 'Ταχύτητα w', 0, 100, 10, ' km/h'), P('tw', 'Διεύθυνση w', 0, 345, 15, '°')],
    init: [200, 30, 60, 150], ex: [[200, 30, 60, 150], [250, 90, 80, 270], [150, 0, 100, 180], [300, 45, 50, 135], [200, 60, 0, 0], [100, 180, 100, 0]] }
];
const st = { scene: 0, dec: 0, v: SCENES.map(s => s.init.slice()) };
const hyp = (x, y) => Math.hypot(x, y);
const f2 = v => fmt(Math.round(v * 100) / 100);
const eq = v => Math.abs(v * 100 - Math.round(v * 100)) < 0.001 ? ' = ' : ' ≈ ';
const rad = d => d * Math.PI / 180;
const tup = (x, y) => `(${fmt(x)}, ${fmt(y)})`;
function norm(x, y) {              // μέτρο: ακριβές όταν είναι ακέραιο, αλλιώς √n ≈ τιμή
  const n = x * x + y * y, r = Math.sqrt(n);
  return Math.abs(r - Math.round(r)) < 1e-9 ? fmt(Math.round(r)) : `√${fmt(n)}${eq(r)}${f2(r)}`;
}

function build() {
  while (dyn.children.length) {
    const o = dyn.children.pop();
    if (o.geometry) o.geometry.dispose();
  }
  const s = st.scene, v = st.v[s];
  let lines, hint;
  axes2(6);
  if (s === 0) {
    const [xA, yA, xB, yB] = v, dx = xB - xA, dy = yB - yA;
    vec(xA, yA, xB, yB, COL.pos, 0.13, 0.1);
    vec(0, 0, dx, dy, COL.res, 0.09, 0, true);
    ln(xA, yA, xB, yA, COL.comp, 0.07, 0.05);
    ln(xB, yA, xB, yB, COL.comp2, 0.07, 0.05);
    ball(xA, yA, COL.pos); ball(xB, yB, COL.pos);
    lab('A', xA, yA, -0.55, -0.55, '#93c5fd'); lab('B', xB, yB, 0.55, 0.55, '#93c5fd');
    lab('ΑΒ', (xA + xB) / 2, (yA + yB) / 2, -dy / (hyp(dx, dy) || 1) * 0.8, dx / (hyp(dx, dy) || 1) * 0.8, '#93c5fd', 0.7);
    lines = [{ t: `ΑΒ = (xΒ − xΑ, yΒ − yΑ) = (${fmt(xB)} − ${par(xA)}, ${fmt(yB)} − ${par(yA)}) = ${tup(dx, dy)}`, size: 58, weight: 650, color: '#93c5fd' },
             { t: `|ΑΒ| = √(${fmt(dx)}² + ${fmt(dy)}²) = ${norm(dx, dy)}`, size: 56, color: '#e2e8f0' },
             { t: `Το μωβ διάνυσμα από το Ο είναι ίσο με το ΑΒ`, size: 46, color: '#d8b4fe' }];
    hint = `<b>Διάνυσμα ΑΒ:</b> αρχή το Α(${fmt(xA)}, ${fmt(yA)}) και πέρας το Β(${fmt(xB)}, ${fmt(yB)}). Οι συντεταγμένες του είναι η διαφορά των συντεταγμένων του πέρατος και της αρχής: ΑΒ = ${tup(dx, dy)}. Το πράσινο και το τιρκουάζ τμήμα είναι οι συνιστώσες του.`;
  } else if (s === 1) {
    const [ax, ay, bx, by] = v, sub = st.dec === 1, sg = sub ? -1 : 1, rx = ax + sg * bx, ry = ay + sg * by;
    vec(0, 0, ax, ay, COL.pos, 0.12, 0.1);
    vec(0, 0, bx, by, COL.neg2, 0.08, 0.0, true);
    if (!sub) {
      vec(ax, ay, rx, ry, COL.b, 0.12, 0.1);
      vec(0, 0, rx, ry, COL.res, 0.14, 0.2);
      dashLine(bx, by, rx, ry, COL.grey);
      lab('α', ax / 2, ay / 2, -0.5, 0.5, '#93c5fd'); lab('β', ax + bx / 2, ay + by / 2, 0.55, 0.4, '#86efac'); lab('α + β', rx / 2, ry / 2, 0.8, -0.6, '#d8b4fe', 0.7);
    } else {
      vec(ax, ay, rx, ry, COL.neg, 0.1, 0.1);
      vec(0, 0, rx, ry, COL.res, 0.14, 0.2);
      vec(bx, by, ax, ay, COL.res, 0.07, -0.1, true);
      lab('α', ax / 2, ay / 2, -0.5, 0.5, '#93c5fd'); lab('β', bx / 2, by / 2, 0.55, -0.4, '#86efac'); lab('−β', ax + (-bx) / 2, ay + (-by) / 2, 0.6, 0.5, '#fca5a5'); lab('α − β', rx / 2, ry / 2, 0.8, -0.6, '#d8b4fe', 0.7);
    }
    ball(rx, ry, COL.res, 0.24);
    const m = hyp(rx, ry);
    lines = [{ t: sub ? `α − β = ${tup(ax, ay)} − ${tup(bx, by)} = ${tup(rx, ry)}` : `α + β = ${tup(ax, ay)} + ${tup(bx, by)} = ${tup(rx, ry)}`, size: 62, weight: 650, color: '#d8b4fe' },
             { t: `|${sub ? 'α − β' : 'α + β'}|${eq(m)}${f2(m)},   |α| ${eq(hyp(ax, ay))} ${f2(hyp(ax, ay))},   |β| ${eq(hyp(bx, by))} ${f2(hyp(bx, by))}`, size: 50, color: '#e2e8f0' },
             { t: sub ? 'Αφαίρεση σημαίνει πρόσθεση του αντιθέτου: α − β = α + (−β)' : 'Κανόνας παραλληλογράμμου: η διαγώνιος από το Ο είναι το άθροισμα', size: 46, color: CSStxt(s) }];
    hint = sub
      ? `<b>Αφαίρεση:</b> το α − β είναι το άθροισμα του α και του αντίθετου −β. Το κόκκινο διάνυσμα −β ξεκινά από το πέρας του α, και το μωβ α − β ξεκινά από το Ο. Το διακεκομμένο μωβ ξεκινά από το πέρας του β και καταλήγει στο πέρας του α.`
      : `<b>Πρόσθεση:</b> το β μεταφέρεται ώστε η αρχή του να συμπέσει με το πέρας του α (κανόνας τριγώνου). Το άθροισμα α + β ξεκινά από το Ο, και είναι η διαγώνιος του παραλληλογράμμου με πλευρές α και β.`;
  } else if (s === 2) {
    const [ax, ay, l] = v, rx = l * ax, ry = l * ay, a = hyp(ax, ay);
    if (a > 0) { const R = 9 / a; ln(-ax * R, -ay * R, ax * R, ay * R, COL.grey, 0.02, -0.02); }
    vec(0, 0, ax, ay, COL.pos, 0.15, 0);
    vec(0, 0, rx, ry, COL.res, 0.09, 0.22);
    lab('α', ax / 2, ay / 2, -ay / (a || 1) * 0.8, ax / (a || 1) * 0.8, '#93c5fd', 0.7);
    if (l !== 0) lab('λα', rx / 2, ry / 2, ay / (a || 1) * 0.8, -ax / (a || 1) * 0.8, '#d8b4fe', 0.7);
    ball(0, 0, COL.ink, 0.12);
    lines = [{ t: `|λα| = |λ| · |α| = ${fmt(Math.abs(l))} · ${f2(a)} = ${f2(Math.abs(l) * a)}`, size: 62, weight: 650, color: '#d8b4fe' },
             { t: `λα = ${fmt(l)} · ${tup(ax, ay)} = ${tup(rx, ry)}`, size: 54, color: '#e2e8f0' },
             { t: l > 0 ? 'λ > 0: τα α και λα είναι ομόρροπα' : l < 0 ? 'λ < 0: τα α και λα είναι αντίρροπα' : 'λ = 0: το 0α είναι το μηδενικό διάνυσμα', size: 48, color: l < 0 ? '#fca5a5' : '#86efac' }];
    hint = `<b>Αριθμός επί διάνυσμα:</b> το λα είναι παράλληλο στο α και έχει μέτρο |λ|·|α|. Αν λ > 0 έχει την ίδια φορά με το α, αν λ < 0 την αντίθετη, και αν λ = 0 είναι το μηδενικό διάνυσμα. Το λα σχεδιάζεται σε ελαφρώς διαφορετικό βάθος, ώστε να φαίνονται και τα δύο διανύσματα.`;
  } else if (s === 3) {
    const [ax, ay, bx, by] = v, a = hyp(ax, ay), b = hyp(bx, by), dp = ax * bx + ay * by, ok = a > 0 && b > 0;
    const q = a > 0 ? dp / (a * a) : 0, px = q * ax, py = q * ay;
    vec(0, 0, bx, by, COL.b, 0.12, 0.05);
    vec(0, 0, ax, ay, COL.pos, 0.12, 0.12);
    if (a > 0) { vec(0, 0, px, py, COL.comp2, 0.08, 0.2); dashLine(bx, by, px, py, COL.grey); }
    let phi = 0;
    if (ok) {
      phi = Math.acos(Math.max(-1, Math.min(1, dp / (a * b))));
      const cr = ax * by - ay * bx, start = cr >= 0 ? Math.atan2(ay, ax) : Math.atan2(by, bx);
      if (phi > 0.02) {
        const arc = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.05, 8, 40, phi), mat(COL.res));
        arc.rotation.z = start; arc.position.z = 0.05; arc.userData.box = false; dyn.add(arc);
        const mid = start + phi / 2; lab('φ', Math.cos(mid) * 1.75, Math.sin(mid) * 1.75, 0, 0, '#d8b4fe', 0.7);
      }
    }
    lab('α', ax / 2, ay / 2, 0.2, ay >= 0 ? -0.7 : 0.7, '#93c5fd', 0.7); lab('β', bx / 2, by / 2, -0.6, 0.2, '#86efac', 0.7);
    const cs = ok ? dp / (a * b) : 0;
    lines = [{ t: `α · β = αx·βx + αy·βy = ${par(ax)}·${par(bx)} + ${par(ay)}·${par(by)} = ${fmt(dp)}`, size: 58, weight: 650, color: '#d8b4fe' },
             { t: ok ? `συνφ = α·β / (|α||β|) = ${fmt(dp)} / (${f2(a)} · ${f2(b)})${eq(cs)}${f2(cs)},   φ ≈ ${f2(phi * 180 / Math.PI)}°` : 'Το ένα διάνυσμα είναι μηδενικό: δεν ορίζεται γωνία', size: 48, color: '#e2e8f0' },
             { t: dp > 0 ? 'α · β > 0: η γωνία είναι οξεία' : dp < 0 ? 'α · β < 0: η γωνία είναι αμβλεία' : 'α · β = 0: τα διανύσματα είναι κάθετα', size: 48, color: dp === 0 ? '#86efac' : '#fde68a' }];
    hint = `<b>Εσωτερικό γινόμενο:</b> α · β = αx·βx + αy·βy = |α||β|συνφ. Το τιρκουάζ διάνυσμα είναι η προβολή του β στον φορέα του α, και το γινόμενο είναι θετικό για οξεία γωνία, αρνητικό για αμβλεία και μηδέν όταν τα διανύσματα είναι κάθετα.`;
  } else {
    const [U, tu, W, tw] = v, ux = U / 50 * Math.cos(rad(tu)), uy = U / 50 * Math.sin(rad(tu)), wx = W / 50 * Math.cos(rad(tw)), wy = W / 50 * Math.sin(rad(tw));
    const gx = ux + wx, gy = uy + wy, G = 50 * hyp(gx, gy);
    let tg = Math.atan2(gy, gx) * 180 / Math.PI; if (tg < 0) tg += 360;
    let eps = ((tg - tu + 180) % 360 + 360) % 360 - 180;
    vec(0, 0, ux, uy, COL.pos, 0.12, 0.05);
    vec(ux, uy, gx, gy, COL.b, 0.12, 0.05);
    vec(0, 0, gx, gy, COL.res, 0.15, 0.2);
    ball(0, 0, COL.ink, 0.15);
    lab('u', ux / 2, uy / 2, 0.1, -0.7, '#93c5fd', 0.7);
    lab('w', ux + wx / 2, uy + wy / 2, 0.1, 0.7, '#86efac', 0.7);
    lab('v', gx / 2, gy / 2, -0.7, 0.1, '#d8b4fe', 0.7);
    lines = [{ t: `|v| = |u + w|${eq(G)}${f2(G)} km/h`, size: 64, weight: 650, color: '#d8b4fe' },
             { t: `Διεύθυνση του v: ${f2(tg)}°.   Εκτροπή από την u: ${f2(Math.abs(eps))}°`, size: 50, color: '#e2e8f0' },
             { t: `Αεροσκάφος: ${fmt(U)} km/h προς ${fmt(tu)}°.   Άνεμος: ${fmt(W)} km/h προς ${fmt(tw)}°`, size: 44, color: '#94a3b8' }];
    hint = `<b>Πτήση με άνεμο:</b> η ταχύτητα ως προς το έδαφος είναι το άθροισμα v = u + w. Η μονάδα του πλέγματος είναι 50 km/h. Το μπλε διάνυσμα είναι η ταχύτητα του αεροσκάφους ως προς τον αέρα, το πράσινο η ταχύτητα του ανέμου και το μωβ η πραγματική κίνηση.`;
  }
  setPanel(lines, 8.4);
  hintEl.innerHTML = hint;
}
function CSStxt(s) { return '#d8b4fe'; }

function renderRows() {
  const sc = SCENES[st.scene];
  rowsEl.innerHTML = '';
  sc.p.forEach((q, i) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span>${q.label}</span><input type="range" min="${q.min}" max="${q.max}" step="${q.step}"><b></b>`;
    const inp = row.querySelector('input'), out = row.querySelector('b');
    inp.value = st.v[st.scene][i];
    out.textContent = fmt(+inp.value) + q.unit;
    inp.oninput = () => { st.v[st.scene][i] = +inp.value; out.textContent = fmt(+inp.value) + q.unit; build(); };
    row._set = val => { inp.value = val; out.textContent = fmt(val) + q.unit; };
    rowsEl.appendChild(row);
  });
}
function refresh() {            // ενημέρωση ολισθητών από τις τιμές
  const sc = SCENES[st.scene];
  [...rowsEl.children].forEach((row, i) => row._set(st.v[st.scene][i]));
}
function update() {
  document.documentElement.style.setProperty('--acc', SCENES[st.scene].acc);
  segD.style.display = st.scene === 1 ? 'flex' : 'none';
  document.querySelectorAll('#segK button').forEach(x => x.classList.toggle('on', +x.dataset.k === st.scene));
  document.querySelectorAll('#segD button').forEach(x => x.classList.toggle('on', +x.dataset.d === st.dec));
  build();
}
function bump(which, dir) {          // αλλαγή της παραμέτρου which κατά ένα βήμα
  const sc = SCENES[st.scene], i = Math.min(which, sc.p.length - 1), q = sc.p[i];
  const val = st.v[st.scene][i] + dir * q.step;
  st.v[st.scene][i] = Math.min(q.max, Math.max(q.min, Math.round(val * 100) / 100));
  refresh(); build();
}
SCENES.forEach((sc, k) => {
  const b = document.createElement('button'); b.dataset.k = k; b.textContent = sc.name;
  b.onclick = () => { st.scene = k; renderRows(); update(); };
  segK.appendChild(b);
});
document.querySelectorAll('#segD button').forEach(x => x.onclick = () => { st.dec = +x.dataset.d; update(); });
function next() {
  const ex = SCENES[st.scene].ex, cur = st.v[st.scene];
  const i = ex.findIndex(e => e.every((t, j) => t === cur[j]));
  st.v[st.scene] = ex[(i + 1) % ex.length].slice();
  refresh(); build();
}
renderRows();
update();

// ------------------------------------------------------------------ XR
const btnAR = $('btnAR'), btnVR = $('btnVR'), note = $('note');
let placed = false, floorRef = true;
async function checkXR() {
  const msg = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) { note.textContent = msg; note.style.display = 'block'; return; }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) { note.textContent = msg; note.style.display = 'block'; }
}
checkXR();

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    session.addEventListener('end', () => {
      room.visible = false;
      scene.background = null;
      root.position.set(0, 0, 0);
      root.quaternion.identity();
      root.scale.setScalar(1);
      camera.position.copy(HOME_CAM);
      controls.target.copy(HOME_TGT);
      controls.update();
    });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

// στην πρώτη εικόνα του XR, το πλέγμα τοποθετείται 90 cm μπροστά από τον χρήστη, στο ύψος των ματιών
function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * 1.1, p.y - 0.1, p.z + dir.z * 1.1);
  root.rotation.set(0, yaw, 0);
  root.scale.setScalar(1);
  room.children[0].position.y = floorRef ? 0 : p.y - 1.5;
  placed = true;
}

// χειριστήρια: σύντομο πάτημα = επόμενο παράδειγμα, παρατεταμένο πάτημα πάνω στο σχήμα = μετακίνηση,
// μοχλός αριστερά και δεξιά = αλλαγή μιας παραμέτρου (αριστερό χειριστήριο: η πρώτη, δεξί: η δεύτερη), πάτημα του μοχλού = επόμενη παράμετρος, μοχλός πάνω και κάτω = μέγεθος
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    const targets = [];
    world.traverse(o => { if (o.isMesh && o.visible && o.userData.box) targets.push(o); });
    if (ray.intersectObjects(targets, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    if (ctl.userData.grab) { scene.attach(root); ctl.userData.grab = false; }
    if (performance.now() - ctl.userData.t0 < 280) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [makeController(0), makeController(1)];

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let last = performance.now(), acc = 0;
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (frame && !placed) placeInFront(frame);
  if (renderer.xr.isPresenting) {
        acc += dt;
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (!gp || !gp.axes || !gp.axes.length) return;
      const ax = gp.axes.length > 3 ? gp.axes[2] : gp.axes[0];
      const ay = gp.axes.length > 3 ? gp.axes[3] : gp.axes[1];
      const ud = c.userData;
      if (ud.act === undefined) ud.act = c.userData.source.handedness === 'right' ? 1 : 0;
      const pr = !!(gp.buttons && gp.buttons[3] && gp.buttons[3].pressed);
      if (pr && !ud.pr) ud.act = (ud.act + 1) % SCENES[st.scene].p.length;
      ud.pr = pr;
      if (Math.abs(ax) > 0.5 && acc > 0.2) { acc = 0; bump(ud.act, ax > 0 ? 1 : -1); }
      if (Math.abs(ay) > 0.5) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ay * dt * 0.9), 0.5, 3));
    });
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
});
</script>
