<!DOCTYPE html>

<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#1565C0}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px;white-space:nowrap}

  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.35}

  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:860px;text-align:center;line-height:1.5}

  .nogl #fallback{display:block} .nogl #c,.nogl #segS,.nogl #segT,.nogl #hint{display:none}
  @media (max-width:560px){ .seg button{padding:9px 10px;font-size:12.5px} #btnPlay{min-width:112px} #hint{font-size:11.5px}
    #bar{gap:10px;padding:10px 12px} #bar h1{font-size:14px} #bar .lv{font-size:10.5px} #bar .lv span{display:block} }

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
// Σενάριο «Όρια και εφαρμογές» (Μαθηματικά Γ΄ Λυκείου Προσανατολισμού, Κεφάλαιο 1, §1.3 έως §1.7): εννέα καταστάσεις,
// όπως οι εννέα εφαρμογές GeoGebra του σεναρίου. Κέντρο Καινοτομίας Θεσσαλίας.
// Κάθε κατάσταση είναι ένας πίνακας με τετραγωνισμένο χαρτί και άξονες, που στέκεται πάνω σε μια βάση. Οι καμπύλες είναι
// σωλήνες λίγο μπροστά από το χαρτί, τα σημεία που πλησιάζουν και οι ζώνες ε, δ και M στέκονται ακόμη πιο μπροστά, ώστε
// όταν ο θεατής κινείται να φαίνεται το βάθος. Τα χρώματα είναι τα ίδια με τις εφαρμογές GeoGebra: η f μπλε, το όριο και οι
// ασύμπτωτες κόκκινα, το δ πορτοκαλί, τα ε και M πράσινα, το δεξιό όριο μωβ.
// Μονάδα μήκους της σκηνής: 1 cm. Ο πίνακας έχει πλάτος 48 cm και ύψος 30 cm.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CM = 0.012;                       // 1 cm της σκηνής σε μέτρα (ο πίνακας: 0,58 m πλάτος)
const BX0 = -24, BX1 = 24, BY0 = 4, BY1 = 34;   // ο πίνακας
const WY0 = 6, WY1 = 32;                // το ύψος του πεδίου της γραφικής παράστασης πάνω στον πίνακα
const PANEL_Y = 36.5;                   // η κάτω πλευρά του πίνακα τίτλου
const TABLE = 0.78, DIST = 1.15;        // XR: ύψος θρανίου και απόσταση της σκηνής από τον χρήστη (m)
const AZ = 18, EL = 12;                 // η σκηνή φαίνεται από εμπρός-δεξιά (18°) και από ψηλά (12°)
const FOV = 26;
const PX = 30;                          // pixels ανά cm στην υφή του πίνακα

const COL = { B: '#1565C0', R: '#C62828', O: '#EF6C00', G: '#2E7D32', P: '#6A1B9A', K: '#616161', N: '#17365D' };
const TXT = { B: '#7FB2E5', R: '#EF8A84', O: '#F7A864', G: '#7FD18A', P: '#C59BE0', K: '#cbd5e1', N: '#9fb8d8' };
const INK = '#eaf1f8', KEIMENO = '#262626';

const rad = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const num = (x, d = 2) => { const s = (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toFixed(d); return s.replace('.', ',').replace('-', '−'); };
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 5;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.8, 1.6, 1.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.5);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// δάπεδο και θρανίο μόνο σε αδιαφανή λειτουργία (VR)
const room = new THREE.Group();
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Group();
  floor.name = 'floor';
  room.add(floor);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.renderOrder = -2;
  floor.add(disc);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.material.depthWrite = false;
  grid.renderOrder = -1;
  grid.position.y = 0.002;
  floor.add(grid);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.5), new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 }));
  desk.name = 'desk';
  room.add(desk);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();         // η σκηνή σε εκατοστά
world.scale.setScalar(CM);
root.add(world);

// ------------------------------------------------------------------ κείμενα σε υφή
const FONT = '"Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif';
function roundRect(ctx, w, h, r) {
  ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
  ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath();
}
function canvasTexture(cv) {
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
// ετικέτα με περίγραμμα, πάντα στραμμένη προς τον θεατή· η υφή έχει πλάτος για το μεγαλύτερο κείμενο (template)
function label(text, color, height, template) {
  const size = 120, pad = 40;
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  ctx.font = `700 ${size}px ${FONT}`;
  const w = Math.ceil(ctx.measureText(template || text).width) + 2 * pad, h = Math.ceil(size * 1.5);
  cv.width = w; cv.height = h;
  const tex = canvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  sp.renderOrder = 8;
  sp.userData = { h: height, aspect: w / h, k: 1, cv, ctx, tex, text: null, color: null, scalable: true };
  fitLabel(sp);
  setText(sp, text, color);
  return sp;
}
function setText(sp, text, color) {
  const u = sp.userData;
  if (u.text === text && u.color === color) return;
  u.text = text; u.color = color;
  const { cv, ctx } = u;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = `700 120px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 22;
  ctx.strokeStyle = 'rgba(14,20,32,.9)';
  ctx.strokeText(text, cv.width / 2, cv.height / 2);
  ctx.fillStyle = color;
  ctx.fillText(text, cv.width / 2, cv.height / 2);
  u.tex.needsUpdate = true;
}
function fitLabel(sp) { const u = sp.userData, s = u.h * u.k; sp.scale.set(s * u.aspect, s, 1); }

// ------------------------------------------------------------------ βοηθητικά γεωμετρίας
const plateGeo = new THREE.PlaneGeometry(1, 1);
const unitBox = new THREE.BoxGeometry(1, 1, 1);
function kouti(sx, sy, sz, c, mat) {
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(sx, sy, sz);
  m.position.copy(c);
  return m;
}
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 12, 1);
function setBar(m, a, b, r) {
  m.position.copy(a).add(b).multiplyScalar(0.5);
  const d = b.clone().sub(a), l = d.length();
  if (l > 1e-6) m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / l));
  m.scale.set(r, Math.max(l, 1e-4), r);
  m.visible = l > 0.05;
}
function bar(a, b, r, mat) { const m = new THREE.Mesh(unitCyl, mat); setBar(m, a, b, r); return m; }
function dashedBar(a, b, r, mat, dash = 1.0, gap = 0.7) {
  const g = new THREE.Group(), d = b.clone().sub(a), l = d.length();
  for (let s = 0; s < l; s += dash + gap) {
    const e = Math.min(s + dash, l);
    g.add(bar(a.clone().addScaledVector(d, s / l), a.clone().addScaledVector(d, e / l), r, mat));
  }
  return g;
}
const ballGeo = new THREE.SphereGeometry(1, 24, 16);
function ball(r, mat) { const m = new THREE.Mesh(ballGeo, mat); m.scale.setScalar(r); return m; }
// σωλήνας κατά μήκος της καμπύλης fn(t), t από t0 έως t1· με reveal φαίνεται μόνο το κομμάτι ως το t
class FnCurve extends THREE.Curve {
  constructor(fn, t0, t1) { super(); this.fn = fn; this.t0 = t0; this.t1 = t1; }
  getPoint(u, target = new THREE.Vector3()) { return target.copy(this.fn(this.t0 + (this.t1 - this.t0) * u)); }
  getPointAt(u, target) { return this.getPoint(u, target); }
  getTangentAt(u, target) { return this.getTangent(u, target); }
}
function tube(fn, t0, t1, seg, r, mat, rs = 6) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new FnCurve(fn, t0, t1), seg, r, rs, false), mat);
  m.userData.tube = { seg, rs, t0, t1, r, fn };
  return m;
}
function reveal(m, t) {
  const u = m.userData.tube, f = THREE.MathUtils.clamp((t - u.t0) / (u.t1 - u.t0), 0, 1);
  m.geometry.setDrawRange(0, Math.round(f * u.seg) * u.rs * 6);
}
function retube(m, a, b) {              // αλλάζει το διάστημα του σωλήνα (για τα κομμάτια των ζωνών δ)
  const u = m.userData.tube;
  m.visible = b - a > 1e-4;
  if (!m.visible) return;
  m.geometry.dispose();
  m.geometry = new THREE.TubeGeometry(new FnCurve(u.fn, a, b), u.seg, u.r, u.rs, false);
}

// ------------------------------------------------------------------ υλικά
const flat = {}, lit = {};
const bm = (c, op = 1) => flat[c + op] || (flat[c + op] = new THREE.MeshBasicMaterial({
  color: c, transparent: op < 1, opacity: op, depthWrite: op >= 1, side: THREE.DoubleSide }));
const glow = c => lit[c] || (lit[c] = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.3, roughness: 0.45 }));
const M = {
  vasi: new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.85 }),
  toixos: new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.9 })
};

// ------------------------------------------------------------------ ο πίνακας: χαρτί με άξονες, ανά κατάσταση
// spec: xmin, xmax, ymin, ymax (το πεδίο της γραφικής παράστασης), bx0, bx1 (πού πέφτει στον πίνακα), xt, yt (υποδιαιρέσεις:
// αριθμοί ή ζεύγη [τιμή, κείμενο]), extras (σχέδιο στην υφή, σε συντεταγμένες πίνακα)
function mapper(S) {
  return {
    X: x => S.bx0 + (x - S.xmin) / (S.xmax - S.xmin) * (S.bx1 - S.bx0),
    Y: y => WY0 + (y - S.ymin) / (S.ymax - S.ymin) * (WY1 - WY0)
  };
}
const tl = v => String(+v.toFixed(3)).replace('.', ',').replace('-', '−');
function boardTexture(S) {
  const { X, Y } = S.m;
  const cv = document.createElement('canvas');
  cv.width = (BX1 - BX0) * PX; cv.height = (BY1 - BY0) * PX;
  const ctx = cv.getContext('2d');
  const cx = bx => (bx - BX0) * PX, cy = by => (BY1 - by) * PX;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#A6A6A6'; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, cv.width - 4, cv.height - 4);
  const seg = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  const tick = t => Array.isArray(t) ? t : [t, tl(t)];
  const xa = Y(Math.min(Math.max(0, S.ymin), S.ymax)), ya = X(Math.min(Math.max(0, S.xmin), S.xmax));
  ctx.strokeStyle = '#EDEDED'; ctx.lineWidth = 2;
  for (const t of S.xt) seg(cx(X(tick(t)[0])), cy(Y(S.ymin)), cx(X(tick(t)[0])), cy(Y(S.ymax)));
  for (const t of S.yt) seg(cx(X(S.xmin)), cy(Y(tick(t)[0])), cx(X(S.xmax)), cy(Y(tick(t)[0])));
  ctx.strokeStyle = '#D5D5D5'; ctx.lineWidth = 3;
  ctx.strokeRect(cx(X(S.xmin)), cy(Y(S.ymax)), cx(X(S.xmax)) - cx(X(S.xmin)), cy(Y(S.ymin)) - cy(Y(S.ymax)));
  if (S.extras) S.extras(ctx, cx, cy);
  ctx.strokeStyle = KEIMENO; ctx.fillStyle = KEIMENO; ctx.lineWidth = 4;
  const x0 = X(S.xmin) - 0.5, x1 = X(S.xmax) + 1.4, y0 = Y(S.ymin) - 0.5, y1 = Y(S.ymax) + 1.4;
  seg(cx(x0), cy(xa), cx(x1), cy(xa));
  seg(cx(ya), cy(y0), cx(ya), cy(y1));
  const arrow = (x, y, dx, dy) => { ctx.beginPath(); ctx.moveTo(x + dx * 26, y + dy * 26);
    ctx.lineTo(x - dy * 11, y + dx * 11); ctx.lineTo(x + dy * 11, y - dx * 11); ctx.closePath(); ctx.fill(); };
  arrow(cx(x1), cy(xa), 1, 0);
  arrow(cx(ya), cy(y1), 0, -1);
  ctx.font = `600 38px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const t of S.xt) {
    const [v, s] = tick(t), px = cx(X(v));
    seg(px, cy(xa) - 8, px, cy(xa) + 8);
    ctx.fillText(s, px, cy(xa) + 12);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const t of S.yt) {
    const [v, s] = tick(t), py = cy(Y(v));
    seg(cx(ya) - 8, py, cx(ya) + 8, py);
    ctx.fillText(s, cx(ya) - 14, py);
  }
  ctx.font = `italic 600 42px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('x', cx(x1) + 4, cy(xa) - 26);
  ctx.fillText('y', cx(ya) + 18, cy(y1) + 6);
  return canvasTexture(cv);
}

// ------------------------------------------------------------------ εργαλεία για κάθε κατάσταση
// kit(g, m): δημιουργεί αντικείμενα στο group g με συντεταγμένες της γραφικής παράστασης (x, y) μέσω του mapper m
function kit(g, m) {
  const P = (x, y, z = 0.9) => V(m.X(x), m.Y(y), z);
  const K = { P };
  K.vtube = (vec, a, b, seg, r, color) => { const t = tube(vec, a, b, seg, r, bm(COL[color])); g.add(t); return t; };
  K.curve = (f, a, b, seg, r, color, z = 0.6) => K.vtube(t => P(t, f(t), z), a, b, seg, r, color);
  K.dash = (x0, y0, x1, y1, color, r = 0.11, z = 0.5) => { const d = dashedBar(P(x0, y0, z), P(x1, y1, z), r, bm(COL[color])); g.add(d); return d; };
  K.line = (color, r = 0.12, op = 1) => { const b = bar(V(0, 0, 0), V(1, 0, 0), r, bm(COL[color], op)); g.add(b); return b; };
  K.setLine = (b, x0, y0, x1, y1, z = 0.8, r) => setBar(b, P(x0, y0, z), P(x1, y1, z), r !== undefined ? r : b.scale.x);
  K.ball = (color, r = 0.65, z = 0.95) => { const b = ball(r, glow(COL[color])); b.position.z = z; g.add(b); return b; };
  K.put = (o, x, y, z) => { o.position.copy(P(x, y, z === undefined ? o.position.z : z)); };
  K.hole = (x, y, color, r = 0.75) => {         // ανοιχτός κύκλος: το σημείο που λείπει
    const h = new THREE.Group();

function fitView(sd) {

async function startXR(kind) {

    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;

function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  const y = THREE.MathUtils.clamp(floorY + TABLE, p.y - 0.9, p.y - 0.4);
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * DIST, y, p.z + dir.z * DIST);
  root.rotation.set(0, yaw - rad(AZ), 0);
  root.scale.setScalar(1);
  const desk = room.getObjectByName('desk');
  desk.position.set(root.position.x, y - 0.029, root.position.z);
  desk.rotation.y = yaw - rad(AZ);
  room.getObjectByName('floor').position.y = floorY;
  setLabelScale(1);
  panelXR();
  placed = true;
}

    const held = performance.now() - ctl.userData.t0, grabbed = ctl.userData.grab;
    if (grabbed) { scene.attach(root); ctl.userData.grab = false; }
    if (held < 280 || (!grabbed && held < 800)) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [0, 1, 2, 3].map(makeController);

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const raw = (now - last) / 1000;
  const dt = raw < 1 ? raw : 0;
  last = now;
  if (frame && !placed) placeInFront(frame);
  step(dt);
  if (renderer.xr.isPresenting) {
    faceViewer(renderer.xr.getCamera(), true);
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * Math.min(dt, 0.1) * 0.9), 0.5, 3));
      }
    });
  } else {
    controls.update();
    faceViewer(camera, false);
  }
  renderer.render(scene, camera);
});
</script>
