<!DOCTYPE html>

<title>Παραλληλόγραμμα — XR</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#1565C0}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px;white-space:nowrap}
  #bar h1{font-size:15px;margin:0;font-weight:640;white-space:nowrap}
  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.35}
  #dock{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg button{font:600 14px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:10px 14px;cursor:pointer}
  .seg button.on{color:#fff;background:var(--acc);border-color:transparent}
  #btnPlay{min-width:132px}
  .xr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .xr button{font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:#2dd4bf;
    border:none;border-radius:12px;padding:14px 22px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer;
    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:860px;text-align:center;line-height:1.5}
  #hint b{color:var(--ink)}
  #note{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;max-width:720px;text-align:center;line-height:1.55;display:none}
  #fallback{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(80vw,110vh);height:auto}
  .nogl #fallback{display:block} .nogl #c,.nogl #segS,.nogl #segT,.nogl #hint{display:none}
  @media (max-width:560px){ .seg button{padding:9px 10px;font-size:12.5px} #btnPlay{min-width:112px} #hint{font-size:11.5px}
    #bar{gap:10px;padding:10px 12px} #bar h1{font-size:14px} #bar .lv{font-size:10.5px} #bar .lv span{display:block} }
</style>

<body>

<text x="98" y="236" font-size="16" fill="#262626">Α</text><text x="292" y="238" font-size="16" fill="#262626">Β</text>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}
</script>
<script type="module">
// Σενάριο «Παραλληλόγραμμα» (Γεωμετρία Α΄ Λυκείου, Κεφάλαιο 5): δέκα καταστάσεις, όπως οι εφαρμογές GeoGebra του σεναρίου.
// Κέντρο Καινοτομίας Θεσσαλίας.
// Ο πίνακας είναι ένα λευκό χαρτί 12 × 8 μονάδων (2,4 cm η μονάδα) πάνω σε βάση. Τα σχήματα είναι διαφανή πρίσματα μικρού
// ύψους, με ράβδους στις πλευρές και σφαίρες στις κορυφές, ώστε όταν ο θεατής κινείται να ξεχωρίζουν τα επίπεδα.
// Χρώματα: οι πλευρές μπλε, η διαγώνιος ΑΓ πράσινη, η διαγώνιος ΒΔ μωβ, οι γωνίες Α και Γ μπλε, οι Β και Δ κόκκινες,
// ό,τι αλλάζει ή προκύπτει πορτοκαλί. Μονάδα σκηνής: 1 cm.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CM = 0.01;                 // 1 cm της σκηνής σε μέτρα
const U = 2.4;                   // cm ανά μονάδα του πίνακα
const BW = 12, BH = 8;           // ο πίνακας σε μονάδες
const W = BW * U, H = BH * U;    // πλάτος και βάθος του πίνακα σε cm
const Y0 = 0;                    // το ύψος της επιφάνειας του πίνακα
const PH = 1.0;                  // ύψος των πρισμάτων
const HB = 1.1;                  // ύψος των ράβδων και των σημείων
const TABLE = 0.78, DIST = 1.0;  // XR: ύψος θρανίου και απόσταση της σκηνής από τον χρήστη (m)
const AZ = 0, EL = 42;           // η σκηνή φαίνεται από εμπρός και από ψηλά
const FOV = 26;

const COL = { B: '#1565C0', R: '#C62828', O: '#EF6C00', G: '#2E7D32', P: '#6A1B9A', K: '#616161' };
const TXT = { B: '#7FB2E5', R: '#EF8A84', O: '#F7A864', G: '#7FD18A', P: '#C59BE0', K: '#cbd5e1' };
const INK = '#eaf1f8', KEIMENO = '#262626';

const rad = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const num = (x, d = 1) => { const s = (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toFixed(d); return s.replace('.', ',').replace('-', '−'); };
// σημείο της σκηνής από μαθηματικές συντεταγμένες (x, y) του πίνακα και ύψος h
const P = (x, y, h = 0) => V(U * (x - BW / 2), Y0 + h, -U * (y - BH / 2));

// ------------------------------------------------------------------ γεωμετρία στο επίπεδο (σημεία {x, y})
const pt = (x, y) => ({ x, y });
const add = (a, b) => pt(a.x + b.x, a.y + b.y);
const sub = (a, b) => pt(a.x - b.x, a.y - b.y);
const mul = (a, k) => pt(a.x * k, a.y * k);
const mid = (a, b) => pt((a.x + b.x) / 2, (a.y + b.y) / 2);
const len = a => Math.hypot(a.x, a.y);
const dist = (a, b) => len(sub(a, b));
const unit = a => mul(a, 1 / (len(a) || 1));
const lerpP = (a, b, t) => pt(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const cross = (a, b) => a.x * b.y - a.y * b.x;
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cis = (r, th) => pt(r * Math.cos(th), r * Math.sin(th));
// το παραλληλόγραμμο ΑΒΓΔ: ΑΒ = a, ΑΔ = b, γωνία Α = φ (σε μοίρες)
function para(A, a, b, phi) {
  const B = add(A, pt(a, 0)), D = add(A, cis(b, rad(phi)));
  return { A, B, C: add(B, sub(D, A)), D };
}
// τομή των ευθειών p + s·u και q + t·v: επιστρέφει το s
function isect(p, u, q, v) { return cross(sub(q, p), v) / cross(u, v); }

// ------------------------------------------------------------------ οι καταστάσεις
// Κάθε κατάσταση έχει τίτλο, γραμμές του πίνακα, κείμενο και συνάρτηση draw(p, d), όπου p από 0 έως 1 ο χρόνος της
// κίνησης και d το αντικείμενο σχεδίασης (δείτε το Draw παρακάτω).
const mark = (d, F) => {            // γωνίες και ίσες πλευρές ενός παραλληλογράμμου
  d.arc(F.A, F.B, F.D, 'B'); d.arc(F.C, F.D, F.B, 'B');
  d.arc(F.B, F.C, F.A, 'R'); d.arc(F.D, F.A, F.C, 'R');
  d.tick(F.A, F.B, 1, 'B'); d.tick(F.D, F.C, 1, 'B'); d.tick(F.A, F.D, 2, 'B'); d.tick(F.B, F.C, 2, 'B');
};
const quad = (d, F, col = 'B', op = 0.45, frac = 1) => { d.prism([F.A, F.B, F.C, F.D], col, op); d.edges([F.A, F.B, F.C, F.D], col, frac); };
const names4 = (d, F) => d.names([['Α', F.A], ['Β', F.B], ['Γ', F.C], ['Δ', F.D]], mid(F.A, F.C));
const A0 = pt(2.4, 1.4);

const STATES = [
  { title: 'Το παραλληλόγραμμο και οι ιδιότητές του', tEnd: 4,
    lines: [['ΑΒ = ΓΔ και ΑΔ = ΒΓ', 'B'], ['Α = Γ και Β = Δ', 'R'], ['Οι απέναντι πλευρές είναι παράλληλες', 'K']],
    hint: '<b>Παραλληλόγραμμο:</b> τετράπλευρο με τις απέναντι πλευρές παράλληλες. Οι απέναντι πλευρές του είναι ίσες (ένα και δύο σημάδια) και οι απέναντι γωνίες του ίσες (Α = Γ μπλε, Β = Δ κόκκινες). Οι γωνίες που είναι προσκείμενες σε μία πλευρά είναι παραπληρωματικές.',
    draw(p, d) { const F = para(A0, 5, 3, 65), e = clamp01(p / 0.5); quad(d, F, 'B', 0.45 * e, e); names4(d, F);
      if (e > 0.99) mark(d, F);
      d.status('Παραλληλόγραμμο ΑΒΓΔ', 'B'); } },
  { title: 'Οι διαγώνιοι διχοτομούνται', tEnd: 4,
    lines: [['ΑΜ = ΜΓ', 'G'], ['ΒΜ = ΜΔ', 'P'], ['Οι διαγώνιες τέμνονται στο μέσο τους', 'O']],
    hint: '<b>Διαγώνιοι παραλληλογράμμου:</b> οι ΑΓ (πράσινη) και ΒΔ (μωβ) τέμνονται στο Μ και το Μ είναι μέσο και των δύο. Όσο αλλάζει η γωνία Α, το σχήμα μένει παραλληλόγραμμο και οι διαγώνιοι εξακολουθούν να διχοτομούνται.',
    draw(p, d) { const F = para(A0, 5, 3, lerp(62, 108, smooth(p))), M = mid(F.A, F.C); quad(d, F); names4(d, F);
      d.seg(F.A, F.C, 'G'); d.seg(F.B, F.D, 'P'); d.tick(F.A, M, 1, 'G'); d.tick(M, F.C, 1, 'G'); d.tick(F.B, M, 2, 'P'); d.tick(M, F.D, 2, 'P');
      d.ball(M, 'O'); d.names([['Μ', M]], pt(M.x - 0.5, M.y - 2), 'O');
      d.status('ΑΜ = ΜΓ και ΒΜ = ΜΔ', 'O'); } },
  { title: 'Κριτήριο: δύο ίσες και παράλληλες πλευρές', tEnd: 4,
    lines: [['ΑΒ ∥ ΔΓ και ΔΓ μεγαλώνει', 'B'], ['Όταν ΔΓ = ΑΒ', 'O'], ['το ΑΒΓΔ γίνεται παραλληλόγραμμο', 'O']],
    hint: '<b>Κριτήριο:</b> αν δύο απέναντι πλευρές ενός τετραπλεύρου είναι ίσες και παράλληλες, τότε το τετράπλευρο είναι παραλληλόγραμμο. Εδώ η ΔΓ είναι πάντα παράλληλη προς την ΑΒ. Όσο η ΔΓ είναι μικρότερη, το ΑΒΓΔ είναι τραπέζιο. Όταν ΔΓ = ΑΒ, γίνεται παραλληλόγραμμο και οι ΑΔ, ΒΓ γίνονται παράλληλες.',
    draw(p, d) { const l = lerp(3, 5, smooth(p)), A = pt(2.4, 1.4), B = pt(7.4, 1.4), D = pt(3.4, 4.8), C = add(D, pt(l, 0));
      const eq = Math.abs(l - 5) < 1e-6, F = { A, B, C, D };
      quad(d, F, eq ? 'B' : 'R', eq ? 0.5 : 0.35); names4(d, F);
      d.seg(A, B, 'B', 0.3); d.seg(D, C, 'O', 0.3);
      if (eq) { d.tick(A, B, 1, 'B'); d.tick(D, C, 1, 'B'); }
      d.status(eq ? 'ΔΓ = ΑΒ: παραλληλόγραμμο' : `ΔΓ = ${num(l)} < ΑΒ = 5: τραπέζιο`, eq ? 'B' : 'R'); } },
  { title: 'Το ορθογώνιο: ίσες διαγώνιοι', tEnd: 4,
    lines: [['Γωνία Α = 90°', 'R'], ['ΑΓ = ΒΔ', 'G'], ['Οι κορυφές ανήκουν σε κύκλο κέντρου Μ', 'P']],
    hint: '<b>Ορθογώνιο:</b> παραλληλόγραμμο με μία ορθή γωνία. Όταν η γωνία Α γίνεται 90°, οι διαγώνιοι ΑΓ και ΒΔ γίνονται ίσες και οι τέσσερις κορυφές βρίσκονται σε κύκλο με κέντρο το Μ. Αντίστροφα, ένα παραλληλόγραμμο με ίσες διαγώνιους είναι ορθογώνιο.',
    draw(p, d) { const phi = lerp(62, 90, smooth(p)), F = para(A0, 5, 3, phi), M = mid(F.A, F.C), ok = phi > 89.99;
      quad(d, F, ok ? 'G' : 'B', 0.4); names4(d, F); d.seg(F.A, F.C, 'G'); d.seg(F.B, F.D, 'P');
      d.ball(M, 'O'); d.names([['Μ', M]], pt(M.x, M.y - 2), 'O');
      if (ok) { d.ring(M, dist(M, F.A), 'P'); d.right(F.A, F.B, F.D); }
      else d.arc(F.A, F.B, F.D, 'R');
      d.status(ok ? `ΑΓ = ΒΔ = ${num(dist(F.A, F.C))}: ορθογώνιο` : `ΑΓ = ${num(dist(F.A, F.C))}, ΒΔ = ${num(dist(F.B, F.D))}`, ok ? 'G' : 'R'); } },
  { title: 'Ο ρόμβος: κάθετες διαγώνιοι', tEnd: 4,
    lines: [['ΑΒ = ΑΔ', 'B'], ['ΑΓ ⊥ ΒΔ', 'O'], ['Οι διαγώνιοι διχοτομούν τις γωνίες', 'G']],
    hint: '<b>Ρόμβος:</b> παραλληλόγραμμο με δύο διαδοχικές πλευρές ίσες. Όταν η ΑΔ γίνεται ίση με την ΑΒ, οι διαγώνιοι ΑΓ και ΒΔ γίνονται κάθετες και διχοτομούν τις γωνίες του. Αντίστροφα, ένα παραλληλόγραμμο με κάθετες διαγώνιους είναι ρόμβος.',
    draw(p, d) { const b = lerp(2.2, 4, smooth(p)), F = para(A0, 4, b, 70), M = mid(F.A, F.C), ok = Math.abs(b - 4) < 1e-6;
      quad(d, F, ok ? 'O' : 'B', 0.4); names4(d, F); d.seg(F.A, F.C, 'G'); d.seg(F.B, F.D, 'P');
      d.ball(M, 'O'); d.names([['Μ', M]], pt(M.x + 0.4, M.y - 2.2), 'O');
      if (ok) { d.right(M, F.B, F.C); d.tick(F.A, F.B, 1, 'B'); d.tick(F.B, F.C, 1, 'B'); d.tick(F.C, F.D, 1, 'B'); d.tick(F.D, F.A, 1, 'B'); }
      d.status(ok ? 'ΑΒ = ΑΔ: ρόμβος, ΑΓ ⊥ ΒΔ' : `ΑΔ = ${num(b)} ≠ ΑΒ = 4`, ok ? 'O' : 'R'); } },
  { title: 'Το τετράγωνο και η ταξινόμηση', tEnd: 6,
    lines: [['Παραλληλόγραμμο', 'B'], ['Ορθογώνιο: μία ορθή γωνία', 'R'], ['Τετράγωνο: ορθογώνιο και ρόμβος', 'O']],
    hint: '<b>Ταξινόμηση:</b> ξεκινάμε από ένα παραλληλόγραμμο. Με ορθή γωνία γίνεται ορθογώνιο. Όταν οι διαδοχικές πλευρές γίνουν ίσες, γίνεται τετράγωνο: ορθογώνιο και ρόμβος μαζί, με ίσες και κάθετες διαγώνιους.',
    draw(p, d) { const s1 = smooth(clamp01(p / 0.45)), s2 = smooth(clamp01((p - 0.55) / 0.45)), phi = lerp(65, 90, s1), b = lerp(3, 4.4, s2);
      const F = para(A0, 4.4, b, phi), M = mid(F.A, F.C), rect = phi > 89.99, sq = rect && b > 4.4 - 1e-6;
      quad(d, F, sq ? 'O' : rect ? 'R' : 'B', 0.4); names4(d, F);
      if (rect) { d.right(F.A, F.B, F.D); d.right(F.B, F.C, F.A); d.right(F.C, F.D, F.B); d.right(F.D, F.A, F.C); }
      if (sq) { d.seg(F.A, F.C, 'G'); d.seg(F.B, F.D, 'P'); d.ball(M, 'O'); }
      d.status(sq ? 'Τετράγωνο' : rect ? 'Ορθογώνιο' : 'Παραλληλόγραμμο', sq ? 'O' : rect ? 'R' : 'B'); } },
  { title: 'Οι διχοτόμοι σχηματίζουν ορθογώνιο', tEnd: 5,
    lines: [['Οι διχοτόμοι των γωνιών Α, Β, Γ, Δ', 'G'], ['τέμνονται στα Ε, Ζ, Η, Θ', 'O'], ['Το ΕΖΗΘ είναι ορθογώνιο', 'O']],
    hint: '<b>Διχοτόμοι:</b> οι διχοτόμοι των γωνιών ενός παραλληλογράμμου σχηματίζουν, με τις τομές τους Ε, Ζ, Η, Θ, ένα ορθογώνιο. Οι διχοτόμοι δύο προσκείμενων γωνιών τέμνονται κάθετα, επειδή οι γωνίες αυτές είναι παραπληρωματικές.',
    draw(p, d) { const F = para(A0, 5, 3, 65), u = pt(1, 0), v = unit(sub(F.D, F.A)), nu = mul(u, -1), nv = mul(v, -1);
      const dA = unit(add(u, v)), dB = unit(add(nu, v)), dC = unit(add(nu, nv)), dD = unit(add(u, nv));
      const E = add(F.A, mul(dA, isect(F.A, dA, F.B, dB))), Z = add(F.B, mul(dB, isect(F.B, dB, F.C, dC)));
      const Hh = add(F.C, mul(dC, isect(F.C, dC, F.D, dD))), Th = add(F.D, mul(dD, isect(F.D, dD, F.A, dA)));
      const e = clamp01(p / 0.6), r = smooth(clamp01((p - 0.6) / 0.4));
      quad(d, F, 'B', 0.3); names4(d, F);
      d.seg(F.A, lerpP(F.A, dist(F.A, Th) > dist(F.A, E) ? Th : E, e), 'G', 0.2);
      d.seg(F.B, lerpP(F.B, dist(F.B, E) > dist(F.B, Z) ? E : Z, e), 'G', 0.2);

}

}

const PRISM_TRIS = 16;
class Draw {
  constructor() { this.bars = []; this.balls = []; this.prisms = []; this.labels = []; this.cb = this.cba = this.cp = this.cl = 0; this.cent = pt(6, 4);
    this.statusLbl = label('x', TXT.K, 1.9, 'ΑΓ = 10,0, ΒΔ = 10,0 ορθογώνιο ');
    this.statusLbl.position.copy(P(6, 8.6, HB + 0.8)); figure.add(this.statusLbl); }
  begin() { this.cb = this.cba = this.cp = this.cl = 0; }
  end() {
    for (let i = this.cb; i < this.bars.length; i++) this.bars[i].visible = false;
    for (let i = this.cba; i < this.balls.length; i++) this.balls[i].visible = false;
    for (let i = this.cp; i < this.prisms.length; i++) this.prisms[i].visible = false;
    for (let i = this.cl; i < this.labels.length; i++) this.labels[i].visible = false;
  }
  bar(a, b, k, r) {
    let m = this.bars[this.cb++];
    if (!m) { m = new THREE.Mesh(unitCyl, glow(k)); figure.add(m); this.bars.push(m); }
    m.material = glow(k); m.visible = true; setBar(m, a, b, r); return m;
  }
  seg(a, b, k, r = 0.22) { this.bar(P(a.x, a.y, HB), P(b.x, b.y, HB), k, r); }
  edges(pts, k, frac = 1, r = 0.26) {
    const n = pts.length, f = frac * n;
    pts.forEach((a, i) => { if (f > i) { const c = pts[(i + 1) % n]; this.seg(a, lerpP(a, c, Math.min(1, f - i)), k, r); } });
  }

    let m = this.balls[this.cba++];
    if (!m) { m = new THREE.Mesh(ballGeo, glow(k)); figure.add(m); this.balls.push(m); }
    m.material = glow(k); m.visible = true; m.position.copy(P(p.x, p.y, HB)); m.scale.setScalar(r);
  }

    }
    m.material = prismMat(k, op); m.visible = true;
    const a = m.geometry.attributes.position.array, n = pts.length;
    let o = 0;
    const put = v => { a[o++] = v.x; a[o++] = v.y; a[o++] = v.z; };
    const top = pts.map(q => P(q.x, q.y, PH)), bot = pts.map(q => P(q.x, q.y, 0.05));
    for (let i = 1; i < n - 1; i++) { put(top[0]); put(top[i]); put(top[i + 1]); }
    for (let i = 0; i < n; i++) { const j = (i + 1) % n; put(bot[i]); put(bot[j]); put(top[j]); put(bot[i]); put(top[j]); put(top[i]); }

    while (dl > Math.PI) dl -= 2 * Math.PI;
    while (dl <= -Math.PI) dl += 2 * Math.PI;
    const N = 8;
    for (let i = 0; i < N; i++) this.seg(add(v, cis(r, t1 + dl * i / N)), add(v, cis(r, t1 + dl * (i + 1) / N)), k, 0.17);

}

}

  current = (k + STATES.length) % STATES.length;
  const S = STATES[current];
  document.querySelectorAll('#segS button').forEach(b => b.classList.toggle('on', +b.dataset.k === current));
  hintEl.innerHTML = hintHTML(current);
  setPanel(S);
  tNow = 0; playing = true; hold = 0;

}
document.querySelectorAll('#segS button').forEach(b => b.onclick = () => select(+b.dataset.k));
function next() { select(current + 1); }
function play() {
  const S = STATES[current];

  else { if (tNow >= S.tEnd - 1e-9) tNow = 0; playing = true; hold = 0; }
  updateButtons();
}
btnPlay.onclick = play;
document.getElementById('btnReset').onclick = () => { tNow = 0; playing = false; hold = 0; updateButtons(); };
btnSpeed.onclick = () => { speed = speed === 2 ? 1 : 2; updateButtons(); };

function step(dt) {
  const S = STATES[current];
  if (playing) {
    tNow += dt * speed;
    if (tNow >= S.tEnd) { tNow = S.tEnd; playing = false; hold = 0; updateButtons(); }
  } else if (renderer.xr.isPresenting && tNow >= S.tEnd - 1e-9) {
    hold += dt;
    if (hold > 5) { tNow = 0; playing = true; hold = 0; updateButtons(); }
  }
  dr.begin();
  S.draw(clamp01(tNow / S.tEnd), dr);
  dr.end();
}

const eyeW = new THREE.Vector3(), pw0 = new THREE.Vector3(), camU = new THREE.Vector3();

function faceViewer(cam, xr) {
  cam.getWorldPosition(eyeW);
  world.getWorldQuaternion(qP).invert();
  if (xr) {
    panel.getWorldPosition(pw0);
    qY.setFromAxisAngle(UP, Math.atan2(eyeW.x - pw0.x, eyeW.z - pw0.z));
    panel.quaternion.copy(qP).multiply(qY);
  } else {
    panel.quaternion.copy(qP).multiply(cam.quaternion);
    camU.setFromMatrixColumn(cam.matrixWorld, 1).normalize();
    panel.position.copy(ANCHOR).addScaledVector(camU, panel.scale.y / 2);
  }
}

const FIT = [];
for (const x of [-W / 2 - 1, W / 2 + 1]) for (const y of [Y0 - 1, Y0 + 5]) for (const z of [-H / 2 - 4, H / 2 + 1]) FIT.push(V(x, y, z));
const PANEL_MAX = Math.max(...STATES.map(S => S.lines.length));
let barBottom = 62, dockTop = 600, frameH = 800, touched = false, viewReady = false;
controls.addEventListener('start', () => { touched = true; });
function dockTopMax() {
  const dock = document.getElementById('dock'), keep = hintEl.innerHTML;
  let top = dock.getBoundingClientRect().top;
  for (let k = 0; k < STATES.length; k++) { hintEl.innerHTML = hintHTML(k); top = Math.min(top, dock.getBoundingClientRect().top); }
  hintEl.innerHTML = keep;
  return top;
}
function layoutView() {
  const Wd = window.innerWidth, Hh = window.innerHeight;
  barBottom = Math.round(document.getElementById('bar').getBoundingClientRect().bottom);
  dockTop = Math.round(dockTopMax());
  const dy = Math.max(0, Math.round(Hh / 2 - (barBottom + dockTop) / 2));
  frameH = Hh + 2 * dy;
  camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(rad(FOV / 2)) * frameH / Hh));
  camera.aspect = Wd / frameH;
  if (dy) camera.setViewOffset(Wd, frameH, 0, 2 * dy, Wd, Hh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if (!renderer.xr.isPresenting) setLabelScale(Wd / Hh < 1 ? 1.5 : 1.25);
}
function fitView() {
  const Wd = window.innerWidth, Hh = window.innerHeight;
  const yTop = 1 - 2 * (barBottom + 8) / Hh, yBot = 1 - 2 * (dockTop - 8) / Hh;
  const yMid = (yTop + yBot) / 2, hy = 0.95 * (yTop - yBot) / 2, hx = 0.95;
  const tgt = world.localToWorld(V(0, Y0 + 2, 0));
  const right = new THREE.Vector3(), up = new THREE.Vector3(), corner = new THREE.Vector3();
  let Dd = 1.2;
  for (let it = 0; it < 14; it++) {
    camera.position.copy(VIEW_DIR).multiplyScalar(Dd).add(tgt);
    camera.lookAt(tgt);
    camera.updateMatrixWorld();
    faceViewer(camera, false);
    scene.updateMatrixWorld(true);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    const addp = q => { q.project(camera); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); };
    for (const cc of FIT) addp(world.localToWorld(cc.clone()));
    for (const [u, vv] of [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]]) addp(panel.localToWorld(corner.set(u, vv, 0)));
    const hh = Dd * Math.tan(rad(camera.fov / 2)) * Hh / frameH, ww = Dd * Math.tan(rad(camera.fov / 2)) * Wd / frameH;
    right.setFromMatrixColumn(camera.matrixWorld, 0);
    up.setFromMatrixColumn(camera.matrixWorld, 1);
    tgt.addScaledVector(right, (x0 + x1) / 2 * ww).addScaledVector(up, ((y0 + y1) / 2 - yMid) * hh);
    const r = Math.max((x1 - x0) / 2 / hx, (y1 - y0) / 2 / Math.max(hy, 0.05));
    Dd = THREE.MathUtils.clamp(Dd * r, controls.minDistance, controls.maxDistance);
  }
  return { D: Dd, tgt };
}
function homeView() {
  const keep = panel.scale.clone();
  panel.scale.set(PW, PW * panelH(PANEL_MAX) / PTW, 1);
  const a = fitView();
  camera.position.copy(VIEW_DIR).multiplyScalar(a.D).add(a.tgt);
  controls.target.copy(a.tgt);
  controls.update();
  panel.scale.copy(keep);
  faceViewer(camera, false);
}
function setLabelScale(k) {
  world.traverse(o => { if (o.userData.scalable) { o.userData.k = k; fitLabel(o); } });
}

{
  const q = parseInt(new URLSearchParams(location.search).get('k'), 10);
  select(Number.isFinite(q) && q >= 0 && q < STATES.length ? q : 0);
  const u = parseFloat(new URLSearchParams(location.search).get('u'));
  if (Number.isFinite(u)) { tNow = clamp01(u) * STATES[current].tEnd; playing = false; updateButtons(); }
}
step(0);
layoutView();
homeView();
viewReady = true;

// ------------------------------------------------------------------ XR
const btnAR = document.getElementById('btnAR'), btnVR = document.getElementById('btnVR');
const note = document.getElementById('note');
let placed = false, floorRef = true;
async function checkXR() {
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
  }
}
checkXR().then(() => { layoutView(); if (!touched) homeView(); });

function resetView() {
  camera.near = 0.01; camera.far = 60;
  root.position.set(0, 0, 0); root.quaternion.identity(); root.scale.setScalar(1);
  room.visible = false; scene.background = null;
  layoutView(); homeView(); touched = false;
}
async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    camera.near = 0.02; camera.far = 50; camera.updateProjectionMatrix();
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    if (!playing && tNow < STATES[current].tEnd - 1e-9) { playing = true; updateButtons(); }
    session.addEventListener('end', () => { resetView(); });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  const y = THREE.MathUtils.clamp(floorY + TABLE, p.y - 0.9, p.y - 0.4);
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * DIST, y - Y0 * CM, p.z + dir.z * DIST);
  root.rotation.set(0, yaw - rad(AZ), 0);
  root.scale.setScalar(1);
  const desk = room.getObjectByName('desk');
  desk.position.set(p.x + dir.x * DIST, y - 0.029, p.z + dir.z * DIST);
  desk.rotation.y = yaw - rad(AZ);
  room.getObjectByName('floor').position.y = floorY;
  setLabelScale(1);
  panelXR();
  placed = true;
}

// χειριστήρια: σύντομο πάτημα = επόμενη κατάσταση, παρατεταμένο πάτημα πάνω στη σκηνή = μετακίνηση, μοχλός = μέγεθος
const hit = new THREE.Mesh(new THREE.BoxGeometry(W + 4, 10, H + 4), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
hit.position.set(0, Y0 + 4, 0);
hit.visible = false;
world.add(hit);
const rayc = new THREE.Raycaster();
const rotM = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    rotM.identity().extractRotation(ctl.matrixWorld);
    rayc.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    rayc.ray.direction.set(0, 0, -1).applyMatrix4(rotM);
    if (rayc.intersectObject(hit, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    const held = performance.now() - ctl.userData.t0, grabbed = ctl.userData.grab;
    if (grabbed) { scene.attach(root); ctl.userData.grab = false; }
    if (held < 280 || (!grabbed && held < 800)) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [0, 1, 2, 3].map(makeController);

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const raw = (now - last) / 1000;
  const dt = raw < 1 ? raw : 0;
  last = now;
  if (frame && !placed) placeInFront(frame);
  step(dt);
  if (renderer.xr.isPresenting) {
    faceViewer(renderer.xr.getCamera(), true);
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * Math.min(dt, 0.1) * 0.9), 0.5, 3));
      }
    });
  } else {
    controls.update();
    faceViewer(camera, false);
  }
  renderer.render(scene, camera);
});
</script>
