<!DOCTYPE html>
<html lang="el">

<title>Εξισώσεις με παραγοντοποίηση και ανισώσεις 1ου βαθμού — AR</title>
<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#9fb0c6;--line:rgba(255,255,255,.12);--or:#E36C09}
  *{box-sizing:border-box}

  body.xr #c{display:none}
  body.xr.dom #ui{background:rgba(14,20,32,.78);width:min(340px,70%)}
  body.xr:not(.dom) #ui{display:none}
  a{color:#5ed0c0}

<canvas id="c"></canvas>
<div id="ui">

<script type="module">
import * as THREE from 'three';

/* ---------- Βοηθητικά ---------- */
const SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
const sup=n=>String(n).split('').map(c=>SUP[c]||c).join('');
const fmt=n=>String(Math.round(n*100)/100).replace('-','−').replace('.',',');
const co=a=>a===1?'':a===-1?'−':fmt(a);
const mono=(a,k)=>k===0?fmt(a):co(a)+'x'+(k===1?'':sup(k));
const xs=v=>v===0?'x':v>0?'x + '+v:'x − '+Math.abs(v);       // x + v
const fac=v=>v===0?'x':v>0?'(x − '+v+')':'(x + '+Math.abs(v)+')'; // x − v
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a); const lcm=(a,b)=>a/gcd(a,b)*b;
const B='#1F6FB2',G='#2E9E4F',P='#7B4FA0',R='#C0392B',O='#E36C09',K='#555555';

/* ---------- Βοηθητικά για τα σενάρια 67 ---------- */
const SYM=['<','≤','>','≥'];
const symf=v=>SYM[v-1];
const rat=v=>{ if(Number.isInteger(v)) return String(v).replace('-','−'); for(let q=2;q<=40;q++){const p=v*q; if(Math.abs(p-Math.round(p))<1e-9) return String(Math.round(p)).replace('-','−')+'/'+q;} return fmt(v); };
const plus=b=>b===0?'':b>0?' + '+fmt(b):' − '+fmt(-b);
const axs=a=>a===0?'0·x':a===1?'x':a===-1?'−x':fmt(a)+'x';
const lin=(a,b)=>axs(a)+plus(b);
const quad=(a,b)=>co(a)+'x²'+(b===0?'':(b>0?' + ':' − ')+(Math.abs(b)===1?'':Math.abs(b))+'x');
// λύση ανίσωσης E·x ⋄ F  (s: 1 <, 2 ≤, 3 >, 4 ≥)
function ineq(E,F,s){
  if(E===0){const T=s===1?0<F:s===2?0<=F:s===3?0>F:0>=F; return {E,F,s,R:0,lo:T?-Infinity:1,hi:T?Infinity:-1,loC:false,hiC:false,T,up:false,s2:s};}
  const s2=E<0?[3,4,1,2][s-1]:s; const R=F/E; const up=s2>=3; const closed=(s2===2||s2===4);
  return {E,F,s,R,s2,up,T:null,lo:up?R:-Infinity,hi:up?Infinity:R,loC:up&&closed,hiC:!up&&closed};
}
function both(A,B){ // κοινή λύση δύο διαστημάτων
  const lo=Math.max(A.lo,B.lo),hi=Math.min(A.hi,B.hi);
  const loC=A.lo>B.lo?A.loC:B.lo>A.lo?B.loC:(A.loC&&B.loC), hiC=A.hi<B.hi?A.hiC:B.hi<A.hi?B.hiC:(A.hiC&&B.hiC);
  return {lo,hi,loC,hiC};
}
const isEmpty=r=>r.lo>r.hi||(r.lo===r.hi&&!(r.loC&&r.hiC));
function ivs(r){
  if(isEmpty(r)) return '∅'; if(r.lo===-Infinity&&r.hi===Infinity) return 'ℝ'; if(r.lo===r.hi) return '{'+rat(r.lo)+'}';
  return (r.lo===-Infinity?'(−∞':(r.loC?'[':'(')+rat(r.lo))+', '+(r.hi===Infinity?'+∞)':rat(r.hi)+(r.hiC?']':')'));
}
const bandOf=(r,y,c)=>({y,lo:r.lo,hi:r.hi,loC:r.loC,hiC:r.hiC,c,emp:isEmpty(r)});
const ieqText=(a,b,s,c)=>lin(a,b)+' '+symf(s)+' '+fmt(c);

/* ---------- Καταστάσεις ---------- */
const S=[
{t:'Γινόμενο ίσο με μηδέν',s:'§ 5.4 Εξισώσεις με παραγοντοποίηση',view:[-8,-12,8,14],
 p:[['p','p',-6,6,1,2],['q','q',-6,6,1,-3],['t','t (δοκιμή)',-8,8,.5,1]],
 cur:p=>[{f:x=>x-p.p,c:B,w:.6},{f:x=>x-p.q,c:G,w:.6},{f:x=>(x-p.p)*(x-p.q),c:P,w:1.6}],
 pts:p=>[{x:p.p,y:0,c:R},{x:p.q,y:0,c:R},{x:p.t,y:(p.t-p.p)*(p.t-p.q),c:O}],vl:()=>[],
 lines:p=>[[fac(p.p)+fac(p.q)+' = 0',K],['⇔ x = '+fmt(p.p)+' ή x = '+fmt(p.q),P],['Για x = '+fmt(p.t)+': f·g = '+fmt((p.t-p.p)*(p.t-p.q)),O]]},
{t:'Κοινός παράγοντας',s:'§ 5.4 ax² + bx = x(ax + b)',view:[-7,-14,7,22],
 p:[['a','a',1,5,1,2],['b','b',-9,9,1,-6]],
 cur:p=>[{f:x=>p.a*x*x+p.b*x,c:P,w:1.6},{f:x=>p.a*x+p.b,c:G,w:.5}],
 pts:p=>[{x:0,y:0,c:R},{x:-p.b/p.a,y:0,c:R}],vl:()=>[],
 lines:p=>[[quad(p.a,p.b)+' = 0',K],['x('+lin(p.a,p.b)+') = 0',B],[p.b===0?'⇔ x = 0 (διπλή)':'⇔ x = 0 ή x = '+rat(-p.b/p.a),P]]},
{t:'Εξίσωση x² = c',s:'§ 5.4 Διαφορά τετραγώνων',view:[-9,-6,9,70],
 p:[['c','c',-9,64,1,16]],
 cur:p=>[{f:x=>x*x,c:P,w:1.6},{f:x=>p.c,c:O}],
 pts:p=>p.c>=0?[{x:Math.sqrt(p.c),y:p.c,c:R},{x:-Math.sqrt(p.c),y:p.c,c:R}]:[],vl:()=>[],
 lines:p=>{const r=Math.sqrt(Math.max(p.c,0)),ok=Number.isInteger(r);
   return [['x² = '+p.c+' ⇔ x² − '+(p.c<0?'('+p.c+')':p.c)+' = 0',K],
     [p.c<0?'Αδύνατη στο ℝ':p.c===0?'x = 0':ok?'(x − '+r+')(x + '+r+') = 0':'(x − √'+p.c+')(x + √'+p.c+') = 0',B],
     [p.c<0?'Κανένα σημείο τομής':p.c===0?'Διπλή λύση':ok?'x = '+r+' ή x = −'+r:'x = ±√'+p.c+' ≈ ±'+fmt(r),P]];}},
{t:'Τριώνυμο x² + (m+n)x + mn',s:'§ 5.4 Παραγοντοποίηση τριωνύμου',view:[-10,-12,8,22],
 p:[['m','m',-6,6,1,2],['n','n',-6,6,1,3]],
 cur:p=>[{f:x=>x*x+(p.m+p.n)*x+p.m*p.n,c:P,w:1.6},{f:x=>x+p.m,c:B,w:.5},{f:x=>x+p.n,c:G,w:.5}],
 pts:p=>[{x:-p.m,y:0,c:R},{x:-p.n,y:0,c:R}],vl:()=>[],
 lines:p=>[['x²'+(p.m+p.n===0?'':(p.m+p.n>0?' + ':' − ')+(Math.abs(p.m+p.n)===1?'':Math.abs(p.m+p.n))+'x')+plus(p.m*p.n)+' = 0',K],
   ['('+xs(p.m)+')('+xs(p.n)+') = 0',B],['x = '+fmt(-p.m)+' ή x = '+fmt(-p.n),P],['Άθροισμα '+(p.m+p.n)+', γινόμενο '+(p.m*p.n),O]]},
{t:'Βολή μπάλας',s:'§ 5.4 Εφαρμογή: h(t) = vt − 5t²',view:[-1,-12,10,95],
 p:[['v','v (m/s)',5,40,5,20],['t','t (s)',0,8,.25,1]],
 cur:p=>[{f:x=>(x>=0&&x<=p.v/5)?p.v*x-5*x*x:NaN,c:P,w:1.6}],
 pts:p=>[{x:0,y:0,c:R},{x:p.v/5,y:0,c:R},{x:p.v/10,y:p.v*p.v/20,c:G},...(p.t<=p.v/5?[{x:p.t,y:p.v*p.t-5*p.t*p.t,c:O}]:[])],vl:()=>[],
 lines:p=>[['h(t) = '+axs(p.v).replace('x','t')+' − 5t² = t('+p.v+' − 5t)',K],['h = 0 ⇔ t = 0 ή t = '+rat(p.v/5),P],['Μέγιστο ύψος '+fmt(p.v*p.v/20)+' m στα '+fmt(p.v/10)+' s',G],[p.t<=p.v/5?'Στο t = '+fmt(p.t)+' s: h = '+fmt(p.v*p.t-5*p.t*p.t)+' m':'Η μπάλα έχει ήδη προσγειωθεί',O]]},
{t:'Ανίσωση ax + b ⋄ c',s:'§ 5.5 Ανισώσεις 1ου βαθμού',view:[-18,-24,18,24],
 p:[['a','a',-5,5,1,2],['b','b',-9,9,1,1],['c','c',-9,9,1,7],['s','φορά',1,4,1,1,symf]],
 cur:p=>[{f:x=>p.a*x+p.b,c:B,w:1.4},{f:x=>p.c,c:O,w:.8}],
 pts:p=>{const r=ineq(p.a,p.c-p.b,p.s);return r.E!==0?[{x:r.R,y:p.c,c:R}]:[];},vl:()=>[],
 bd:p=>[bandOf(ineq(p.a,p.c-p.b,p.s),0,G)],
 lines:p=>{const r=ineq(p.a,p.c-p.b,p.s);
   return [[ieqText(p.a,p.b,p.s,p.c),K],[axs(p.a)+' '+symf(p.s)+' '+fmt(p.c-p.b),B],
   [r.E===0?'0·x '+symf(p.s)+' '+fmt(r.F)+(r.T?' (ισχύει πάντα)':' (δεν ισχύει)'):'x '+symf(r.s2)+' '+rat(r.R)+(r.E<0?'  (η φορά άλλαξε)':''),R],['Λύση: '+ivs(r),P]];}},
{t:'Σύστημα δύο ανισώσεων',s:'§ 5.5 Κοινή λύση',view:[-14,-1.5,14,6],noy:true,
 p:[['a1','a₁',-4,4,1,2],['b1','b₁',-9,9,1,-3],['c1','c₁',-9,9,1,5],['a2','a₂',-4,4,1,1],['b2','b₂',-9,9,1,4],['c2','c₂',-9,9,1,9]],
 cur:()=>[],pts:()=>[],vl:()=>[],
 bd:p=>{const A=ineq(p.a1,p.c1-p.b1,4),Bq=ineq(p.a2,p.c2-p.b2,1);return [bandOf(A,4.2,B),bandOf(Bq,2.8,G),bandOf(both(A,Bq),1.4,P)];},
 lines:p=>{const A=ineq(p.a1,p.c1-p.b1,4),Bq=ineq(p.a2,p.c2-p.b2,1);
   return [['(1) '+lin(p.a1,p.b1)+' ≥ '+fmt(p.c1)+' ⇒ '+ivs(A),B],['(2) '+lin(p.a2,p.b2)+' < '+fmt(p.c2)+' ⇒ '+ivs(Bq),G],['Κοινή λύση: '+ivs(both(A,Bq)),P]];}},
{t:'Ποια προσφορά συμφέρει;',s:'§ 5.5 Εφαρμογή: σύγκριση προσφορών',view:[-3,-20,24,300],
 p:[['fa','Α: πάγιο (€)',0,50,5,10],['ra','Α: € ανά ώρα',1,15,1,5],['fb','Β: πάγιο (€)',0,50,5,30],['rb','Β: € ανά ώρα',1,15,1,3]],
 cur:p=>[{f:x=>x<0?NaN:p.fa+p.ra*x,c:B,w:1.5},{f:x=>x<0?NaN:p.fb+p.rb*x,c:G,w:1.5}],
 pts:p=>{const E=p.ra-p.rb;if(E===0)return[];const R_=(p.fb-p.fa)/E;return R_>=0?[{x:R_,y:p.fa+p.ra*R_,c:R}]:[];},vl:()=>[],
 bd:p=>[bandOf(both(ineq(p.ra-p.rb,p.fb-p.fa,1),{lo:0,hi:Infinity,loC:true,hiC:false}),0,P)],
 lines:p=>{const r=ineq(p.ra-p.rb,p.fb-p.fa,1),k=both(r,{lo:0,hi:Infinity,loC:true,hiC:false});
   return [[p.fa+' + '+p.ra+'x < '+p.fb+' + '+p.rb+'x',K],[axs(p.ra-p.rb)+' < '+fmt(p.fb-p.fa),B],[r.E===0?(r.T?'Ισχύει πάντα':'Δεν ισχύει ποτέ'):'x '+symf(r.s2)+' '+rat(r.R),R],['Με x ≥ 0: '+ivs(k),P]];}},
{t:'Πόσα εισιτήρια;',s:'§ 5.5 Εφαρμογή: px + f ≤ B',view:[-2,-10,42,140],
 p:[['pr','Τιμή (€)',2,15,1,6],['fe','Πάγια (€)',0,30,1,8],['bu','Προϋπολογισμός (€)',20,120,5,70]],
 cur:p=>[{f:x=>p.pr*x+p.fe,c:B,w:1.2},{f:x=>p.bu,c:O,w:.8}],
 pts:p=>{const r=ineq(p.pr,p.bu-p.fe,2),n=r.F>=0?Math.floor(r.R+1e-9):-1,o=[];for(let j=0;j<=n&&j<=42;j++)o.push({x:j,y:p.pr*j+p.fe,c:G});if(n+1<=42)o.push({x:n+1,y:p.pr*(n+1)+p.fe,c:R});return o;},vl:()=>[],
 lines:p=>{const r=ineq(p.pr,p.bu-p.fe,2),n=r.F>=0?Math.floor(r.R+1e-9):-1;
   return [[axs(p.pr)+plus(p.fe)+' ≤ '+p.bu,K],[axs(p.pr)+' ≤ '+(p.bu-p.fe),B],[r.F<0?'Αδύνατη (ούτε για x = 0)':'x ≤ '+rat(r.R),R],[n<0?'Δεν επαρκεί ο προϋπολογισμός':'Μέγιστο: '+n+' εισιτήρια ('+(p.pr*n+p.fe)+' €)',P]];}}
];

/* ---------- Κατάσταση εφαρμογής ---------- */
let si=0; const val={};
const q=new URLSearchParams(location.search); const k0=parseInt(q.get('k')||'1',10);
if(k0>=1&&k0<=S.length) si=k0-1;
const $=id=>document.getElementById(id);
function resetVals(){S[si].p.forEach(d=>val[d[0]]=d[5]);}
resetVals();

/* ---------- Σκηνή ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.xr.enabled=true;
const scene=new THREE.Scene(); scene.background=null;
const cam=new THREE.PerspectiveCamera(50,1,.05,50); cam.position.set(0,1.35,1.9);
scene.add(new THREE.AmbientLight(0xffffff,1.0));
const root=new THREE.Group(); scene.add(root);
const board=new THREE.Group(); root.add(board);
const BW=1.0, BH=.7;                       // μέγεθος γραφήματος σε μέτρα
board.position.set(.25,1.3,0);
const bg=new THREE.Mesh(new THREE.PlaneGeometry(BW+.08,BH+.08),new THREE.MeshBasicMaterial({color:0x111a2b,transparent:true,opacity:.92}));
bg.position.z=-.002; board.add(bg);
const dyn=new THREE.Group(); board.add(dyn);

function label(text,size,color,w){ // sprite με κείμενο
  const c=document.createElement('canvas'); c.width=128; c.height=64; const g=c.getContext('2d');
  g.fillStyle=color||'#9fb0c6'; g.font='bold '+(size||34)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,64,32);
  const t=new THREE.CanvasTexture(c); const m=new THREE.Mesh(new THREE.PlaneGeometry(w||.07,(w||.07)/2),new THREE.MeshBasicMaterial({map:t,transparent:true}));
  return m;
}
function niceStep(r){const e=Math.pow(10,Math.floor(Math.log10(r/5))),m=r/5/e;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e;}
function disposeGroup(g){while(g.children.length){const o=g.children.pop();o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material){if(n.material.map)n.material.map.dispose();n.material.dispose();}});}}
let mapX,mapY,V;
function strip(pts,w,color,z){ // λωρίδα πάχους w πάνω από πολυγραμμή (σε μέτρα)
  const pos=[],idx=[];let n=0;
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];let dx=x2-x1,dy=y2-y1;const L=Math.hypot(dx,dy)||1e-9;dx/=L;dy/=L;
    const nx=-dy*w/2,ny=dx*w/2;
    pos.push(x1+nx,y1+ny,z, x1-nx,y1-ny,z, x2+nx,y2+ny,z, x2-nx,y2-ny,z);
    idx.push(n,n+1,n+2,n+1,n+3,n+2);n+=4;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));
}
function drawGraph(){
  disposeGroup(dyn);
  const st=S[si]; V=st.view; const [x0,y0,x1,y1]=V;
  mapX=x=>(x-x0)/(x1-x0)*BW-BW/2; mapY=y=>(y-y0)/(y1-y0)*BH-BH/2;
  // πλέγμα και άξονες
  const sx=niceStep(x1-x0), sy=niceStep(y1-y0);
  for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx){const xx=Math.round(x*1e6)/1e6;
    dyn.add(strip([[mapX(xx),-BH/2],[mapX(xx),BH/2]],xx===0?.004:.0012,xx===0?0xcbd5e1:0x2a3a55,0));
    if(xx!==0){const l=label(String(xx).replace('-','−'),30,'#9fb0c6',.07);l.position.set(mapX(xx),Math.max(-BH/2+.02,Math.min(BH/2-.02,mapY(0)-.025)),.002);dyn.add(l);} }
  for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy){const yy=Math.round(y*1e6)/1e6; if(st.noy&&yy!==0)continue;
    dyn.add(strip([[-BW/2,mapY(yy)],[BW/2,mapY(yy)]],yy===0?.004:.0012,yy===0?0xcbd5e1:0x2a3a55,0));
    if(yy!==0&&!st.noy){const l=label(String(yy).replace('-','−'),30,'#9fb0c6',.07);l.position.set(Math.max(-BW/2+.04,Math.min(BW/2-.04,mapX(0)-.04)),mapY(yy),.002);dyn.add(l);} }
  // καμπύλες
  const N=500;
  st.cur(val).forEach((cv,ci)=>{
    let seg=[];const flush=()=>{if(seg.length>1)dyn.add(strip(seg,.0075*(cv.w||1),cv.c,.004+ci*.0005));seg=[];};
    let prev=null;
    for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N,y=cv.f(x);
      if(!isFinite(y)||y<y0-(y1-y0)*.02||y>y1+(y1-y0)*.02){flush();prev=null;continue;}
      if(prev!==null&&Math.abs(y-prev)>(y1-y0)*.45){flush();}
      seg.push([mapX(x),mapY(y)]);prev=y;}
    flush();
  });
  (st.vl?st.vl(val):[]).forEach(v=>{dyn.add(strip([[mapX(v.x),-BH/2],[mapX(v.x),BH/2]],.004,v.c,.003));});
  (st.hl?st.hl(val):[]).forEach(v=>{dyn.add(strip([[-BW/2,mapY(v.y)],[BW/2,mapY(v.y)]],.004,v.c,.003));});
  (st.bd?st.bd(val):[]).forEach(b=>{
    if(b.emp)return; const lo=Math.max(b.lo,x0),hi=Math.min(b.hi,x1); if(lo<hi)dyn.add(strip([[mapX(lo),mapY(b.y)],[mapX(hi),mapY(b.y)]],.014,b.c,.005));
    [[b.lo,b.loC],[b.hi,b.hiC]].forEach(([v,cl])=>{ if(!isFinite(v)||v<x0||v>x1)return;
      const m=new THREE.Mesh(new THREE.CircleGeometry(.014,24),new THREE.MeshBasicMaterial({color:cl?new THREE.Color(b.c):0x111a2b}));m.position.set(mapX(v),mapY(b.y),.009);dyn.add(m);
      if(!cl){const r=new THREE.Mesh(new THREE.RingGeometry(.011,.016,24),new THREE.MeshBasicMaterial({color:new THREE.Color(b.c)}));r.position.set(mapX(v),mapY(b.y),.01);dyn.add(r);} });
  });
  st.pts(val).forEach(p=>{
    if(!isFinite(p.y)||p.x<x0||p.x>x1||p.y<y0||p.y>y1)return;
    const m=new THREE.Mesh(new THREE.CircleGeometry(p.big?.018:.014,24),new THREE.MeshBasicMaterial({color:p.hole?0x111a2b:new THREE.Color(p.c)}));
    m.position.set(mapX(p.x),mapY(p.y),.008);dyn.add(m);
    if(p.hole){const r=new THREE.Mesh(new THREE.RingGeometry(.011,.016,24),new THREE.MeshBasicMaterial({color:new THREE.Color(p.c)}));r.position.set(mapX(p.x),mapY(p.y),.009);dyn.add(r);}
  });
}

/* ---------- HTML πάνελ ---------- */
function buildUI(){
  const st=S[si];
  $('ttl').textContent=st.t; $('sec').textContent=st.s; $('stn').textContent=(si+1)+' από '+S.length;
  const box=$('sls'); box.innerHTML='';
  st.p.forEach(d=>{
    const w=document.createElement('div');w.className='sl';
    const l=document.createElement('label');const nm=document.createElement('span');nm.textContent=d[1];const vv=document.createElement('span');vv.id='v_'+d[0];l.append(nm,vv);
    const r=document.createElement('input');r.type='range';r.min=d[2];r.max=d[3];r.step=d[4];r.value=val[d[0]];
    r.addEventListener('input',()=>{val[d[0]]=parseFloat(r.value);refresh();});
    w.append(l,r);box.append(w);
  });
  refresh();
}
function refresh(){
  const st=S[si];
  st.p.forEach(d=>{const e=$('v_'+d[0]);if(e)e.textContent=d[6]?d[6](val[d[0]]):fmt(val[d[0]]);});
  const ls=st.lines(val); const L=$('lines'); L.innerHTML='';
  ls.forEach(([t,c])=>{const d=document.createElement('div');d.textContent=t;d.style.color=(c===K?'#cbd5e1':c);L.append(d);});
  drawGraph(); panelDirty=true;
}
function go(n){si=(n+S.length)%S.length;resetVals();buildUI();history.replaceState(null,'','?k='+(si+1));}
$('prev').onclick=()=>go(si-1);$('next').onclick=()=>go(si+1);

/* ---------- 3D πάνελ για γυαλιά ---------- */
const PW=.62,PH=.62*704/1024;
const pc=document.createElement('canvas');pc.width=1024;pc.height=704;const pg=pc.getContext('2d');
const ptex=new THREE.CanvasTexture(pc);const panel=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshBasicMaterial({map:ptex,transparent:true}));
panel.position.set(-.55,1.3,0);panel.visible=false;root.add(panel);
let hits=[],panelDirty=true;
function btn(x,y,w,h,txt,fn,fill){pg.fillStyle=fill||'#1b2740';pg.strokeStyle='rgba(255,255,255,.25)';pg.lineWidth=2;
  pg.beginPath();pg.roundRect(x,y,w,h,12);pg.fill();pg.stroke();pg.fillStyle='#eaf1f8';pg.font='bold 34px sans-serif';pg.textAlign='center';pg.textBaseline='middle';pg.fillText(txt,x+w/2,y+h/2+2);hits.push({x,y,w,h,fn});}
function drawPanel(){
  const st=S[si];hits=[];
  pg.clearRect(0,0,1024,704);pg.fillStyle='rgba(14,20,32,.92)';pg.beginPath();pg.roundRect(0,0,1024,704,28);pg.fill();
  pg.textAlign='left';pg.textBaseline='alphabetic';pg.fillStyle='#eaf1f8';pg.font='bold 42px sans-serif';pg.fillText(st.t,30,64);
  pg.fillStyle='#9fb0c6';pg.font='28px sans-serif';pg.fillText(st.s,30,102);
  let y=130;
  st.lines(val).forEach(([t,c])=>{pg.fillStyle=c==='#555555'?'#cbd5e1':c;pg.font='34px sans-serif';pg.fillText(t,30,y+34);y+=48;});
  y=y+10;const rh=Math.min(76,(618-y)/st.p.length),bh=rh-12;
  st.p.forEach(d=>{const v=val[d[0]];
    pg.fillStyle='#E36C09';pg.font='30px sans-serif';pg.textAlign='left';pg.fillText(d[1]+' = '+(d[6]?d[6](v):fmt(v)),30,y+rh*.6);
    btn(500,y,100,bh,'−−',()=>adj(d,-5));btn(610,y,100,bh,'−',()=>adj(d,-1));btn(720,y,100,bh,'+',()=>adj(d,1));btn(830,y,100,bh,'++',()=>adj(d,5));
    y+=rh;});
  btn(30,626,120,64,'‹',()=>go(si-1));pg.fillStyle='#eaf1f8';pg.font='bold 30px sans-serif';pg.textAlign='center';pg.fillText((si+1)+' από '+S.length,512,668);
  btn(874,626,120,64,'›',()=>go(si+1));
  ptex.needsUpdate=true;panelDirty=false;
}
function adj(d,m){const [id,,mn,mx,stp]=d;let v=val[id]+m*stp;v=Math.max(mn,Math.min(mx,Math.round(v/stp)*stp));val[id]=v;
  const r=document.querySelector('#sls .sl:nth-child('+(S[si].p.indexOf(d)+1)+') input');if(r)r.value=v;refresh();}

/* ---------- Είσοδος ---------- */
let rotY=0,rotX=0,drag=null,zoom=1.25;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-drag.x)*.006;rotX=Math.max(-.7,Math.min(.7,rotX+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('wheel',e=>{zoom=Math.max(.8,Math.min(4,zoom*(1+e.deltaY*.001)));e.preventDefault();},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);

/* ---------- AR / VR ---------- */
const msg=$('msg');let session=null,hitSrc=null,placed=false;
const reticle=new THREE.Mesh(new THREE.RingGeometry(.08,.1,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xE36C09}));
reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
const ray=new THREE.Raycaster();const tmp=new THREE.Matrix4();
const ctrls=[0,1].map(i=>{const c=renderer.xr.getController(i);
  const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1.5)]),new THREE.LineBasicMaterial({color:0xE36C09}));c.add(ln);
  c.addEventListener('select',()=>onSelect(c));scene.add(c);return c;});
function onSelect(c){
  if(!session)return;
  if(hitSrc&&!placed&&reticle.visible){root.position.setFromMatrixPosition(reticle.matrix);root.position.y+=0;board.position.set(.2,.45,0);panel.visible=false;placed=true;return;}
  if(!panel.visible)return;
  tmp.identity().extractRotation(c.matrixWorld);ray.ray.origin.setFromMatrixPosition(c.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(tmp);
  const h=ray.intersectObject(panel)[0];if(!h||!h.uv)return;
  const px=h.uv.x*1024,py=(1-h.uv.y)*704;const b=hits.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);if(b)b.fn();
}
async function start(mode){
  if(!navigator.xr){msg.textContent='Το WebXR δεν υποστηρίζεται σε αυτόν τον περιηγητή. Χρησιμοποίησε την προβολή 3D.';return;}
  const ok=await navigator.xr.isSessionSupported(mode).catch(()=>false);
  if(!ok){msg.textContent=(mode==='immersive-ar'?'Το AR':'Το VR')+' δεν είναι διαθέσιμο εδώ. Δοκίμασε το άλλο ή την προβολή 3D.';return;}
  const opt={optionalFeatures:['local-floor','hit-test','dom-overlay'],domOverlay:{root:document.body}};
  try{session=await navigator.xr.requestSession(mode,opt);}catch(e){msg.textContent='Δεν άνοιξε η συνεδρία: '+e.message;return;}
  renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(session);
  document.body.classList.add('xr');
  const dom=!!session.domOverlayState;if(dom)document.body.classList.add('dom');
  placed=false;root.position.set(0,0,-1.3);root.rotation.set(0,0,0);board.rotation.set(0,0,0);board.position.set(.25,1.3,0);
  if(mode==='immersive-ar'&&dom){
    // tablet: ολισθητές HTML + τοποθέτηση με hit-test
    panel.visible=false;
    try{const vs=await session.requestReferenceSpace('viewer');hitSrc=await session.requestHitTestSource({space:vs});}catch(e){hitSrc=null;}
    if(hitSrc){root.position.set(0,0,0);board.position.set(0,.45,-1.2);}
    msg.textContent=hitSrc?'Πάτησε στο τραπέζι για να τοποθετηθεί το γράφημα.':'';
  }else{panel.visible=true;panelDirty=true;hitSrc=null;}
  session.addEventListener('end',()=>{session=null;hitSrc=null;document.body.classList.remove('xr','dom');reticle.visible=false;root.position.set(0,0,0);board.position.set(.25,1.3,0);panel.visible=false;resize();});
}
$('bAR').onclick=()=>start('immersive-ar');$('bVR').onclick=()=>start('immersive-vr');

/* ---------- Βρόχος ---------- */
renderer.setAnimationLoop((t,frame)=>{
  if(!renderer.xr.isPresenting){
    root.rotation.set(0,0,0);root.position.set(0,0,0);
    cam.position.set(0,1.3,zoom);cam.lookAt(0,1.3,0);panel.visible=false;
    const off=innerWidth>760?.32:0;board.rotation.set(rotX,rotY,0);board.position.set(off,1.3,0);
  }else if(frame&&hitSrc&&!placed){
    const hs=frame.getHitTestResults(hitSrc);
    if(hs.length){const pose=hs[0].getPose(renderer.xr.getReferenceSpace());reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix);}else reticle.visible=false;
  }
  if(placed)reticle.visible=false;
  if(panel.visible&&panelDirty)drawPanel();
  renderer.render(scene,cam);
});
resize();buildUI();
window.__app={S,val,go,get si(){return si;},adj,drawPanel,pc};
</script>
