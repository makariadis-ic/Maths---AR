<style>
  :root{--bg:#0e1420;--ink:#eaf1f8;--dim:#96a8bd;--line:rgba(255,255,255,.12);--acc:#C2185B}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;
    background:radial-gradient(120% 90% at 50% 0%,#17263c 0%,#0e1420 60%)}
  #bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:linear-gradient(180deg,rgba(14,20,32,.92),transparent)}
  #bar a{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);
    padding:8px 12px;border-radius:9px;white-space:nowrap}
  #bar h1{font-size:15px;margin:0;font-weight:640;white-space:nowrap}
  #bar .lv{font-size:11.5px;color:var(--dim);margin-left:auto;text-align:right;line-height:1.35}
  #dock{position:fixed;left:0;right:0;bottom:14px;z-index:10;display:flex;flex-direction:column;
    align-items:center;gap:8px;padding:0 12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg button{font:600 14px/1 "Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:rgba(14,20,32,.92);border:1px solid var(--line);border-radius:9px;
    padding:10px 14px;cursor:pointer}
  .seg button.on{color:#fff;background:var(--acc);border-color:transparent}
  #btnPlay{min-width:132px}
  .xr{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .xr button{font:650 15px/1 "Segoe UI",system-ui,sans-serif;color:#08131a;background:#2dd4bf;
    border:none;border-radius:12px;padding:14px 22px;box-shadow:0 12px 34px rgba(0,0,0,.5);cursor:pointer;
    display:none}
  .xr button.vr{background:#c084fc}
  #hint{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.86);border:1px solid var(--line);
    padding:8px 13px;border-radius:10px;max-width:860px;text-align:center;line-height:1.5}
  #hint b{color:var(--ink)}
  #note{font-size:12.5px;color:var(--dim);background:rgba(14,20,32,.9);border:1px solid var(--line);
    padding:9px 14px;border-radius:10px;max-width:720px;text-align:center;line-height:1.55;display:none}
  #fallback{display:none;position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(80vw,110vh);height:auto}
  .nogl #fallback{display:block} .nogl #c,.nogl #segS,.nogl #segT,.nogl #hint{display:none}
  @media (max-width:560px){ .seg button{padding:9px 10px;font-size:12.5px} #btnPlay{min-width:112px} #hint{font-size:11.5px}
    #bar{gap:10px;padding:10px 12px} #bar h1{font-size:14px} #bar .lv{font-size:10.5px} #bar .lv span{display:block} }
</style>

<script type="module">
// Σενάριο «Στατιστική» (Μαθηματικά Γενικής Παιδείας Γ΄ Λυκείου, Κεφάλαιο 2, §2.1 έως §2.7): δέκα καταστάσεις, όπως οι δέκα
// εφαρμογές GeoGebra του σεναρίου. Κέντρο Καινοτομίας Θεσσαλίας.
// Κάθε κατάσταση είναι ένας πίνακας με τετραγωνισμένο χαρτί, που στέκεται πάνω σε μια βάση. Οι ράβδοι, τα κουτιά και τα
// τετράγωνα των αποκλίσεων είναι στερεά με πάχος, οι καμπύλες σωλήνες λίγο μπροστά από το χαρτί και τα χωρία στέκονται σε
// διαφορετικά βάθη, ώστε όταν ο θεατής κινείται να ξεχωρίζει ποιο είναι ποιο. Τα χρώματα είναι τα ίδια με τις εφαρμογές
// GeoGebra: μπλε το κύριο δεδομένο (η πρώτη ομάδα), μωβ η δεύτερη ομάδα, πορτοκαλί ό,τι αλλάζει, πράσινο το θετικό, κόκκινο το
// αρνητικό, γκρι τα βοηθητικά. Συμβολισμός όπως στις εφαρμογές: x̄, δ, Mo, s² = Σ(xᵢ − x̄)²/ν και s = √s² με διαιρέτη ν.
// Μονάδα μήκους της σκηνής: 1 cm. Ο πίνακας έχει πλάτος 48 cm και ύψος 30 cm.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CM = 0.012;                       // 1 cm της σκηνής σε μέτρα (ο πίνακας: 0,58 m πλάτος)
const BX0 = -24, BX1 = 24, BY0 = 4, BY1 = 34;   // ο πίνακας
const WY0 = 6, WY1 = 32;                // το ύψος του πεδίου της γραφικής παράστασης πάνω στον πίνακα
const PANEL_Y = 36.5;                   // η κάτω πλευρά του πίνακα τίτλου
const TABLE = 0.78, DIST = 1.15;        // XR: ύψος θρανίου και απόσταση της σκηνής από τον χρήστη (m)
const AZ = 18, EL = 12;                 // η σκηνή φαίνεται από εμπρός-δεξιά (18°) και από ψηλά (12°)
const FOV = 26;
const PX = 30;                          // pixels ανά cm στην υφή του πίνακα

const COL = { B: '#1565C0', R: '#C62828', O: '#EF6C00', G: '#2E7D32', P: '#6A1B9A', K: '#616161', N: '#17365D' };
const TXT = { B: '#7FB2E5', R: '#EF8A84', O: '#F7A864', G: '#7FD18A', P: '#C59BE0', K: '#cbd5e1', N: '#9fb8d8' };
const INK = '#eaf1f8', KEIMENO = '#262626';

const rad = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const num = (x, d = 2) => { const s = (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x + Math.sign(x) * 1e-9).toFixed(d); return s.replace('.', ',').replace('-', '−'); };
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const approx = v => { const r = Math.round(v * 100) / 100; return Math.abs(v - r) < 1e-9 ? '= ' + tl(r) : '≈ ' + num(v); };

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 5;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.8, 1.6, 1.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.5);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// δάπεδο και θρανίο μόνο σε αδιαφανή λειτουργία (VR)
const room = new THREE.Group();
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Group();
  floor.name = 'floor';
  room.add(floor);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.renderOrder = -2;
  floor.add(disc);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.material.depthWrite = false;
  grid.renderOrder = -1;
  grid.position.y = 0.002;
  floor.add(grid);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.5), new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 }));
  desk.name = 'desk';
  room.add(desk);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();         // η σκηνή σε εκατοστά
world.scale.setScalar(CM);
root.add(world);

// ------------------------------------------------------------------ κείμενα σε υφή
const FONT = '"Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif';
function roundRect(ctx, w, h, r) {
  ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
  ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath();
}
function canvasTexture(cv) {
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
// στοιχειοθεσία των κειμένων: _{…} δείκτης, ^{…} εκθέτης, ∫{α}{β} ολοκλήρωμα με άκρα, ]{α}{β} αγκύλη με άκρα,
// π.χ. '∫{0}{1} x e^{x} dx = [x e^{x}]{0}{1} − …'
function parseRich(s) {
  const out = [];
  let i = 0, buf = '';
  const flush = () => { if (buf) { out.push({ t: 'n', s: buf }); buf = ''; } };
  const group = () => {
    let depth = 0, j = i;
    for (; j < s.length; j++) { if (s[j] === '{') depth++; else if (s[j] === '}' && --depth === 0) break; }
    const c = s.slice(i + 1, j);
    i = j + 1;
    return c;
  };
  while (i < s.length) {
    const ch = s[i];
    if ((ch === '_' || ch === '^') && s[i + 1] === '{') { flush(); i++; out.push({ t: ch === '_' ? 'sub' : 'sup', s: group() }); }
    else if ((ch === '∫' || ch === ']') && s[i + 1] === '{') { flush(); i++; const lo = group(), hi = group(); out.push({ t: ch === '∫' ? 'int' : 'br', lo, hi }); }
    else { buf += ch; i++; }
  }
  flush();
  return out;
}
const isTall = s => /[∫\]]\{/.test(s);
function richLayout(ctx, s, size, weight) {
  const F = k => `${weight} ${Math.round(size * k)}px ${FONT}`;
  const W = (t, k) => { ctx.font = F(k); return ctx.measureText(t).width; };
  const parts = [];
  let x = 0;
  for (const r of parseRich(s)) {
    if (r.t === 'n') { parts.push({ s: r.s, x, dy: 0, k: 1 }); x += W(r.s, 1); }
    else if (r.t === 'sub' || r.t === 'sup') {
      parts.push({ s: r.s, x: x + size * 0.02, dy: r.t === 'sub' ? size * 0.3 : -size * 0.38, k: 0.7 });
      x += W(r.s, 0.7) + size * 0.06;
    } else if (r.t === 'int') {
      const wi = W('∫', 1.45);
      parts.push({ s: '∫', x, dy: -size * 0.04, k: 1.45 });
      parts.push({ s: r.hi, x: x + wi * 0.92, dy: -size * 0.62, k: 0.75 });
      parts.push({ s: r.lo, x: x + wi * 0.4, dy: size * 0.62, k: 0.75 });
      x += Math.max(wi * 0.92 + W(r.hi, 0.75), wi * 0.4 + W(r.lo, 0.75)) + size * 0.14;
    } else {
      const wb = W(']', 1);

const btnPlay = document.getElementById('btnPlay'), btnSpeed = document.getElementById('btnSpeed');

  btnPlay.textContent = playing ? 'Παύση' : 'Αναπαραγωγή';
  btnSpeed.classList.toggle('on', speed === 2);
}
const boardTex = [];
function select(k) {
  current = (k + STATES.length) % STATES.length;
  const S = STATES[current];
  document.querySelectorAll('#segS button').forEach(b => b.classList.toggle('on', +b.dataset.k === current));
  hintEl.innerHTML = hintHTML(current);
  setPanel(S);
  STATES.forEach((s, i) => { s.g.visible = i === current; });
  boardTex[current] = boardTex[current] || boardTexture(S.spec);
  boardMat.map = boardTex[current];
  boardMat.needsUpdate = true;
  tNow = 0;
  playing = true;
  hold = 0;
  if (Number.isFinite(FREEZE)) { tNow = FREEZE * S.dur; playing = false; }
  updateButtons();
  if (viewReady && !touched && !renderer.xr.isPresenting) homeView();
}
let viewReady = false;
document.querySelectorAll('#segS button').forEach(b => b.onclick = () => select(+b.dataset.k));
function next() { select(current + 1); }
btnPlay.onclick = () => {
  const S = STATES[current];
  if (playing) playing = false;
  else { if (tNow >= S.dur - 1e-9) tNow = 0; playing = true; hold = 0; }
  updateButtons();
};
document.getElementById('btnReset').onclick = () => { tNow = 0; playing = false; hold = 0; updateButtons(); };
btnSpeed.onclick = () => { speed = speed === 2 ? 1 : 2; updateButtons(); };

function step(dt) {
  const S = STATES[current];
  if (playing) {
    tNow += dt * speed;
    if (tNow >= S.dur) { tNow = S.dur; playing = false; hold = 0; updateButtons(); }
  } else if (renderer.xr.isPresenting && tNow >= S.dur - 1e-9) {
    // στο XR δεν υπάρχουν κουμπιά: η κατάσταση ξαναπαίζει από την αρχή 5 s αφού τελειώσει
    hold += dt;
    if (hold > 5) { tNow = 0; playing = true; hold = 0; updateButtons(); }
  }
  S.upd(Math.min(tNow / S.dur, 1) * 0.9999);
}

// ο πίνακας γυρίζει προς τον θεατή (στο XR μόνο γύρω από τον κατακόρυφο άξονα)
const eyeW = new THREE.Vector3(), pw = new THREE.Vector3(), camR = new THREE.Vector3(), camU = new THREE.Vector3();
const qP = new THREE.Quaternion(), qY = new THREE.Quaternion();
function faceViewer(cam, xr) {
  cam.getWorldPosition(eyeW);
  world.getWorldQuaternion(qP).invert();
  if (xr) {
    panel.getWorldPosition(pw);
    qY.setFromAxisAngle(UP, Math.atan2(eyeW.x - pw.x, eyeW.z - pw.z));
    panel.quaternion.copy(qP).multiply(qY);
  } else {
    panel.quaternion.copy(qP).multiply(cam.quaternion);
    camR.setFromMatrixColumn(cam.matrixWorld, 0).normalize();
    camU.setFromMatrixColumn(cam.matrixWorld, 1).normalize();
    if (side) panel.position.copy(SIDE).addScaledVector(camR, -PW / 2).addScaledVector(camU, -panel.scale.y / 2);
    else panel.position.copy(ANCHOR).addScaledVector(camU, panel.scale.y / 2);
  }
}

// ------------------------------------------------------------------ πλαίσιο της προβολής 3D
const VIEW_DIR = V(Math.sin(rad(AZ)) * Math.cos(rad(EL)), Math.sin(rad(EL)), Math.cos(rad(AZ)) * Math.cos(rad(EL))).normalize();
const FIT = [];
for (const x of [BX0, BX1]) for (const y of [0, FY1]) for (const z of [-1, 8]) FIT.push(V(x, y, z));
const PANEL_MAX = Math.max(...STATES.map(S => S.lines.length));
let barBottom = 62, dockTop = 600, frameH = 800, touched = false;
controls.addEventListener('start', () => { touched = true; });
function dockTopMax() {
  const dock = document.getElementById('dock'), keep = hintEl.innerHTML;
  let top = dock.getBoundingClientRect().top;
  for (let k = 0; k < STATES.length; k++) { hintEl.innerHTML = hintHTML(k); top = Math.min(top, dock.getBoundingClientRect().top); }
  hintEl.innerHTML = keep;
  return top;
}
function layoutView() {
  const W = window.innerWidth, Hh = window.innerHeight;
  barBottom = Math.round(document.getElementById('bar').getBoundingClientRect().bottom);
  dockTop = Math.round(dockTopMax());
  const dy = Math.max(0, Math.round(Hh / 2 - (barBottom + dockTop) / 2));
  frameH = Hh + 2 * dy;
  camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(rad(FOV / 2)) * frameH / Hh));
  camera.aspect = W / frameH;
  if (dy) camera.setViewOffset(W, frameH, 0, 2 * dy, W, Hh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if (!renderer.xr.isPresenting) setLabelScale(W / Hh < 1 ? 1.5 : 1.25);
}
// ο πίνακας τίτλου μπαίνει πάνω από τη σκηνή ή αριστερά της, όπου η σκηνή βγαίνει μεγαλύτερη
function fitView(sd) {
  side = sd;
  const W = window.innerWidth, Hh = window.innerHeight;
  const yTop = 1 - 2 * (barBottom + 8) / Hh, yBot = 1 - 2 * (dockTop - 8) / Hh;
  const yMid = (yTop + yBot) / 2, hy = 0.95 * (yTop - yBot) / 2, hx = 0.95;
  const tgt = world.localToWorld(V(0, 19, 0));
  const right = new THREE.Vector3(), up = new THREE.Vector3(), corner = new THREE.Vector3();
  let D = 1.6;
  for (let it = 0; it < 14; it++) {
    camera.position.copy(VIEW_DIR).multiplyScalar(D).add(tgt);
    camera.lookAt(tgt);
    camera.updateMatrixWorld();
    faceViewer(camera, false);
    scene.updateMatrixWorld(true);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    const add = q => { q.project(camera); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); };
    for (const c of FIT) add(world.localToWorld(c.clone()));
    for (const [u, v] of [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]]) add(panel.localToWorld(corner.set(u, v, 0)));
    const hh = D * Math.tan(rad(camera.fov / 2)) * Hh / frameH, ww = D * Math.tan(rad(camera.fov / 2)) * W / frameH;
    right.setFromMatrixColumn(camera.matrixWorld, 0);
    up.setFromMatrixColumn(camera.matrixWorld, 1);
    tgt.addScaledVector(right, (x0 + x1) / 2 * ww).addScaledVector(up, ((y0 + y1) / 2 - yMid) * hh);
    const r = Math.max((x1 - x0) / 2 / hx, (y1 - y0) / 2 / Math.max(hy, 0.05));
    D = THREE.MathUtils.clamp(D * r, controls.minDistance, controls.maxDistance);
  }
  return { D, tgt, sd };
}
function homeView() {
  const keep = panel.scale.clone();
  panel.scale.set(PW, PW * panelH(PANEL_MAX) / PTW, 1);
  const a = fitView(false), b = fitView(true), best = b.D < a.D * 0.97 ? b : a;
  side = best.sd;
  camera.position.copy(VIEW_DIR).multiplyScalar(best.D).add(best.tgt);
  controls.target.copy(best.tgt);
  controls.update();
  panel.scale.copy(keep);
  faceViewer(camera, false);
}
function setLabelScale(k) {
  world.traverse(o => { if (o.userData.scalable) { o.userData.k = k; fitLabel(o); } });
}

{
  const q = parseInt(Q.get('k'), 10);
  select(Number.isFinite(q) && q >= 0 && q < STATES.length ? q : 0);
}
step(0);
layoutView();
homeView();
viewReady = true;

// ------------------------------------------------------------------ XR
const btnAR = document.getElementById('btnAR'), btnVR = document.getElementById('btnVR');
const note = document.getElementById('note');
let placed = false, floorRef = true;
async function checkXR() {
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
  }
}
checkXR().then(() => { layoutView(); if (!touched) homeView(); });

function resetView() {
  camera.near = 0.01;
  camera.far = 60;
  root.position.set(0, 0, 0);
  root.quaternion.identity();
  root.scale.setScalar(1);
  room.visible = false;
  scene.background = null;
  layoutView();
  homeView();
  touched = false;
}

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    camera.near = 0.02;
    camera.far = 50;
    camera.updateProjectionMatrix();
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    // μέσα στα γυαλιά δεν υπάρχουν κουμπιά για τον χρόνο: η κίνηση συνεχίζει
    if (!playing && tNow < STATES[current].dur - 1e-9) { playing = true; updateButtons(); }
    session.addEventListener('end', () => { resetView(); });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

// στην πρώτη εικόνα του XR, η σκηνή τοποθετείται μπροστά από τον χρήστη (το κέντρο της 1,15 m μακριά), στο ύψος ενός
// θρανίου, πάντα κάτω από τα μάτια
function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  const y = THREE.MathUtils.clamp(floorY + TABLE, p.y - 0.9, p.y - 0.4);
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * DIST, y, p.z + dir.z * DIST);
  root.rotation.set(0, yaw - rad(AZ), 0);
  root.scale.setScalar(1);
  const desk = room.getObjectByName('desk');
  desk.position.set(root.position.x, y - 0.029, root.position.z);
  desk.rotation.y = yaw - rad(AZ);
  room.getObjectByName('floor').position.y = floorY;
  setLabelScale(1);
  panelXR();
  placed = true;
}

// χειριστήρια: σύντομο πάτημα (σκανδάλη ή τσίμπημα) = επόμενη κατάσταση, παρατεταμένο πάτημα πάνω στη σκηνή = μεταφορά,
// μοχλός = μέγεθος. Ένα πάτημα έως 0,8 s που δεν έπιασε τη σκηνή μετρά επίσης ως «επόμενη κατάσταση».
const hit = new THREE.Mesh(new THREE.BoxGeometry(54, 44, 12), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
hit.position.set(0, 22, 3);
hit.visible = false;
world.add(hit);
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    if (ray.intersectObject(hit, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    const held = performance.now() - ctl.userData.t0, grabbed = ctl.userData.grab;
    if (grabbed) { scene.attach(root); ctl.userData.grab = false; }
    if (held < 280 || (!grabbed && held < 800)) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [0, 1, 2, 3].map(makeController);

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const raw = (now - last) / 1000;
  const dt = raw < 1 ? raw : 0;
  last = now;
  if (frame && !placed) placeInFront(frame);
  step(dt);
  if (renderer.xr.isPresenting) {
    faceViewer(renderer.xr.getCamera(), true);
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * Math.min(dt, 0.1) * 0.9), 0.5, 3));
      }
    });
  } else {
    controls.update();
    faceViewer(camera, false);
  }
  renderer.render(scene, camera);
});
</script>
