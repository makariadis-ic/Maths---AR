{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",

<script type="module">
// Σενάριο 12 «Τριγωνομετρία στο Κέντρο Καινοτομίας» (Άλγεβρα Β΄ Λυκείου, Κεφάλαιο 3, §3.1–3.5): Ο κύκλος και η έλικα.
// Κέντρο Καινοτομίας Θεσσαλίας.
// Το σημείο M(συνt, ημt) του τριγωνομετρικού κύκλου γυρίζει με 1 rad το δευτερόλεπτο. Το σημείο P έχει τις ίδιες
// συντεταγμένες, αλλά ταυτόχρονα απομακρύνεται κατά μήκος του άξονα t, κάθετα στον κύκλο: γράφει μια έλικα. Η σκιά της
// έλικας στον πλάγιο τοίχο είναι η γραφική παράσταση της y = ημt, στο δάπεδο της y = συνt, και από μπροστά φαίνεται ο
// κύκλος. Με ακτίνα ρ = 2 και διπλάσια γωνιακή ταχύτητα η σκιά γίνεται y = 2ημ(2t) (μέγιστο 2, περίοδος π). Το επίπεδο
// y = 1/2 κόβει την έλικα σε δύο σειρές σημείων: t = 2κπ + π/6 και t = 2κπ + 5π/6. Τέλος, το παιχνίδι στο ελατήριο
// (h = 1 + (1/3)συν3t, Β΄ Ομάδα, άσκ. 3 της §3.4) κινείται όπως η σκιά σημείου που γυρίζει σε κύκλο ακτίνας 1/3 m.
// Μονάδα μήκους της σκηνής: 1 cm. Η μονάδα των αξόνων είναι 6 cm και το 1 rad του άξονα t είναι επίσης 6 cm (ίδια κλίμακα).
// Στο ελατήριο: 1 m = 18 cm και 1 s = 12 cm, ώστε ο κύκλος αναφοράς (ακτίνα 1/3 m, κέντρο στο 1 m) να είναι ο ίδιος κύκλος.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CM = 0.01;                        // 1 cm της σκηνής σε μέτρα
const R = 6;                            // η μονάδα των αξόνων (ακτίνα του τριγωνομετρικού κύκλου)
const K = 6;                            // 1 rad στον άξονα t
const YC = 18;                          // ύψος του κέντρου O του κύκλου πάνω από τη βάση
const TMAX = 4 * Math.PI;               // ο χρόνος των καταστάσεων 2–5: δύο στροφές
const L = K * TMAX;                     // μήκος της έλικας: 75,4 cm
const SM = 18, KS = 12;                 // ελατήριο: 1 m = 18 cm, 1 s = 12 cm (2π s = 75,4 cm)
const XW = -16;                         // ο πλάγιος τοίχος
const ZF = 3, ZB = -(L + 5);            // μπροστινή και πίσω άκρη της βάσης και του τοίχου
const WALL_H = 36;
const BX = [-16.6, 23.4];               // πλάτος της βάσης
const XS = 14, XP = 22;                 // το ελατήριο και ο ορθοστάτης του
const SET_CX = (BX[0] + BX[1]) / 2, SET_CZ = (ZF + ZB) / 2;   // κέντρο της σκηνής: στο XR μπαίνει 1,2 m μπροστά
const PANEL_Y = 39.5;                   // η κάτω πλευρά του πίνακα με τον τίτλο και τις γραμμές
const TABLE = 0.78, DIST = 1.2;         // XR: ύψος θρανίου και απόσταση του κέντρου της σκηνής από τον χρήστη (m)
const AZ = 50, EL = 24;                 // η σκηνή φαίνεται από εμπρός-δεξιά (50°) και από ψηλά (24°), και στο XR (AZ)
const TH5 = Math.PI / 6;                // κατάσταση 5: ημθ = 1/2
const TH6 = Math.acos(0.75);            // κατάσταση 6: συνθ = 0,75 (h = 1,25 m)

// χρώματα: ημίτονο κόκκινο, συνημίτονο μπλε, η έλικα και η οικογένεια t = 2κπ + θ πορτοκαλί, η οικογένεια
// t = 2κπ + (π − θ) και τα επίπεδα μωβ (όπως στις εφαρμογές GeoGebra του σεναρίου)
const COL = { S: '#C0392B', C: '#1F6FB2', O: '#E36C09', P: '#7B4FA0', G: '#94a3b8' };
const TXT = { S: '#E8857A', C: '#7FB2E5', O: '#F2A46F', P: '#B89BD4' };     // πιο ανοιχτά, για σκούρο φόντο
const INK = '#eaf1f8', KEIMENO = '#262626';

const rad = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const num = (x, d = 2) => { const s = (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toFixed(d); return s.replace('.', ',').replace('-', '−'); };

// ------------------------------------------------------------------ οι έξι καταστάσεις
// tEnd: ο χρόνος της κατάστασης (rad στις 1–5, s στην 6)
const STATES = [
  { tEnd: 2 * Math.PI, unit: 'rad',
    title: 'Ο τριγωνομετρικός κύκλος: M(συνt, ημt)',
    lines: [['Η γωνία t μεγαλώνει 1 rad το δευτερόλεπτο'], ['συνt: η τετμημένη του M', 'C'], ['ημt: η τεταγμένη του M', 'S']],
    hint: '<b>Ο τριγωνομετρικός κύκλος:</b> κύκλος με κέντρο O(0, 0) και ακτίνα 1. Η γωνία t, σε rad, μεγαλώνει 1 rad το δευτερόλεπτο, με αρχική πλευρά την OA, και η τελική της πλευρά τέμνει τον κύκλο στο M. Η τετμημένη του M είναι το συνt (μπλε) και η τεταγμένη του το ημt (κόκκινο), δηλαδή M(συνt, ημt). Σε 2π ≈ 6,28 s το M κάνει μία ολόκληρη στροφή και ξαναβρίσκεται στο A.' },
  { tEnd: TMAX, unit: 'rad',
    title: 'Η έλικα: η γωνία t γίνεται και βάθος',
    lines: [['Το P έχει τις συντεταγμένες του M και προχωρά στον άξονα t'], ['Κάθε 2π το P κάνει μία στροφή'], ['ημ(t + 2π) = ημt, συν(t + 2π) = συνt']],
    hint: '<b>Η έλικα:</b> το σημείο P έχει κάθε στιγμή τις ίδιες συντεταγμένες (συνt, ημt) με το M, αλλά ταυτόχρονα προχωρά κατά μήκος του άξονα t, κάθετα στον κύκλο. Το 1 rad στον άξονα t έχει το ίδιο μήκος με τη μονάδα του κύκλου. Έτσι το P γράφει μια έλικα: κάθε 2π ξαναβρίσκεται στην ίδια θέση του κύκλου του, μία στροφή πιο πέρα. Γι\' αυτό ημ(t + 2π) = ημt και συν(t + 2π) = συνt: οι συναρτήσεις ημίτονο και συνημίτονο είναι περιοδικές με περίοδο 2π.' },
  { tEnd: TMAX, unit: 'rad',
    title: 'Οι σκιές της έλικας',
    lines: [['Στον τοίχο: η γραφική παράσταση της y = ημt', 'S'], ['Στο δάπεδο: η γραφική παράσταση της y = συνt', 'C'], ['Από μπροστά: ο τριγωνομετρικός κύκλος']],
    hint: '<b>Οι σκιές της έλικας:</b> η σκιά του P στον πλάγιο τοίχο κρατά το ύψος του, ημt, και τη θέση του στον άξονα t: γράφει τη γραφική παράσταση της y = ημt (κόκκινη). Η σκιά στο δάπεδο κρατά την τετμημένη του, συνt, και γράφει τη γραφική παράσταση της y = συνt (μπλε). Από μπροστά η έλικα φαίνεται ως ο τριγωνομετρικός κύκλος. Και οι δύο γραφικές παραστάσεις έχουν μέγιστο 1, ελάχιστο −1 και περίοδο 2π.' },
  { tEnd: TMAX, unit: 'rad',
    title: 'Η συνάρτηση f(t) = 2ημ(2t)',
    lines: [['ρ = 2: η ακτίνα της έλικας, μέγιστο 2, ελάχιστο −2', 'S'], ['ω = 2: μία στροφή σε T = 2π/ω = π', 'O'], ['Για σύγκριση: y = ημt (αχνή)']],
    hint: '<b>Η συνάρτηση f(t) = 2ημ(2t):</b> τώρα ο κύκλος έχει ακτίνα ρ = 2 και το σημείο γυρίζει με διπλάσια ταχύτητα, 2 rad το δευτερόλεπτο, ενώ προχωρά στον άξονα t όπως πριν. Η έλικα είναι φαρδύτερη και πυκνότερη: η σκιά της στον τοίχο είναι η y = 2ημ(2t), με μέγιστο 2, ελάχιστο −2 και περίοδο π. Γενικά, η f(t) = ρημ(ωt), με ρ, ω > 0, έχει μέγιστο ρ, ελάχιστο −ρ και περίοδο T = 2π/ω (Σχόλιο της §3.4): το ρ είναι η ακτίνα της έλικας και το T η απόσταση δύο διαδοχικών στροφών.' },
  { tEnd: TMAX, unit: 'rad',
    title: 'Η εξίσωση ημt = 1/2',
    lines: [['Το επίπεδο y = 1/2 κόβει την έλικα σε δύο σειρές σημείων', 'P'], ['t = 2κπ + π/6', 'O'], ['ή t = 2κπ + 5π/6, κ ∈ ℤ', 'P']],
    hint: '<b>Η εξίσωση ημt = 1/2:</b> οι λύσεις είναι οι θέσεις όπου η έλικα έχει ύψος 1/2, δηλαδή τα σημεία όπου την κόβει το οριζόντιο επίπεδο y = 1/2. Στον κύκλο υπάρχουν δύο τέτοια σημεία, στις γωνίες θ = π/6 και π − θ = 5π/6. Επειδή η έλικα επαναλαμβάνεται κάθε 2π, τα σημεία τομής σχηματίζουν δύο σειρές: t = 2κπ + π/6 (πορτοκαλί) ή t = 2κπ + 5π/6 (μωβ), κ ∈ ℤ, όπως ο τύπος της §3.5 για την ημx = ημθ. Από το 0 έως το 4π: π/6, 5π/6, 13π/6 και 17π/6.' },
  { tEnd: 2 * Math.PI, unit: 's',
    title: 'Το παιχνίδι στο ελατήριο: h(t) = 1 + (1/3)συν3t',
    lines: [['Κινείται όπως η σκιά σημείου που γυρίζει σε κύκλο ακτίνας 1/3 m'], ['Περίοδος T = 2π/3 ≈ 2,09 s: τρεις στροφές σε 2π s', 'O'], ['h(t) = 1,25 m: t ≈ 0,24, 1,85, 2,34, 3,95, 4,43, 6,04 s', 'P']],
    hint: '<b>Το παιχνίδι στο ελατήριο</b> (§3.4, Β΄ Ομάδα, άσκηση 3): το ύψος του από το πάτωμα είναι h(t) = 1 + (1/3)συν3t (h σε m, t σε s). Είναι το ύψος ενός σημείου που γυρίζει σε κύκλο ακτίνας 1/3 m με κέντρο στο 1 m, κάνοντας 3 rad το δευτερόλεπτο, με αρχή την ψηλότερη θέση: μέγιστο 4/3 m, ελάχιστο 2/3 m, περίοδος 2π/3 ≈ 2,09 s. Η έλικα του σημείου ρίχνει στον τοίχο τη γραφική παράσταση της h. Το επίπεδο h = 1,25 m την κόβει όπου συν3t = 0,75: 3t = 2κπ ± θ, με θ ≈ 0,72, και στο [0, 2π] t ≈ 0,24, 1,85, 2,34, 3,95, 4,43 και 6,04 s. Κλίμακα: 1 m = 18 cm.' }
];
// αδιάσπαστα κενά γύρω από τα σύμβολα πράξεων και σχέσεων και ανάμεσα σε αριθμό και μονάδα
const hintHTML = k => STATES[k].hint.replace(/ (=|·|×|→|≈|:|\+|−|±) /g, ' $1 ')
  .replace(/(\d) (cm|m|s|rad)(?!\p{L})/gu, '$1 $2');

// ------------------------------------------------------------------ τα σημεία: M στον κύκλο, P στην έλικα
// κάθε κατάσταση: x, y (ως προς τη σκηνή) και βάθος z για τον χρόνο t
function pos(k, t, z0 = null) {
  let x, y, z;
  if (k === 3) { x = 2 * R * Math.cos(2 * t); y = YC + 2 * R * Math.sin(2 * t); z = -K * t; }
  else if (k === 5) { x = -R * Math.sin(3 * t); y = YC + R * Math.cos(3 * t); z = -KS * t; }
  else { x = R * Math.cos(t); y = YC + R * Math.sin(t); z = -K * t; }
  return V(x, y, z0 === null ? z : z0);
}

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const FOV = 26;
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 5;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.8, 1.6, 1.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.5);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// δάπεδο και θρανίο μόνο σε αδιαφανή λειτουργία (VR)
const room = new THREE.Group();
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Group();
  floor.name = 'floor';
  room.add(floor);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.renderOrder = -2;
  floor.add(disc);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.material.depthWrite = false;
  grid.renderOrder = -1;
  grid.position.y = 0.002;
  floor.add(grid);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.04, 1.0), new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 }));
  desk.name = 'desk';
  room.add(desk);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();         // η σκηνή σε εκατοστά
world.scale.setScalar(CM);
world.position.set(-SET_CX * CM, 0, -SET_CZ * CM);
root.add(world);

// ------------------------------------------------------------------ κείμενα σε υφή
const FONT = '"Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif';
function roundRect(ctx, w, h, r) {

  sp.renderOrder = 8;

}
function setText(sp, text, color) {

const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 14, 1);
function setBar(m, a, b, r) {
  m.position.copy(a).add(b).multiplyScalar(0.5);
  const d = b.clone().sub(a), l = d.length();
  if (l > 1e-6) m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / l));
  m.scale.set(r, Math.max(l, 1e-4), r);
  m.visible = l > 0.05;
}
function bar(a, b, r, mat) { const m = new THREE.Mesh(unitCyl, mat); setBar(m, a, b, r); return m; }
function dashedBar(a, b, r, mat, dash = 1.1, gap = 0.75) {
  const g = new THREE.Group(), d = b.clone().sub(a), l = d.length();
  for (let s = 0; s < l; s += dash + gap) {
    const e = Math.min(s + dash, l);
    g.add(bar(a.clone().addScaledVector(d, s / l), a.clone().addScaledVector(d, e / l), r, mat));
  }
  return g;
}
function cone(at, dir, r, h, mat) {         // βέλος: κώνος με τη βάση στο at, προς την κατεύθυνση dir
  const g = new THREE.ConeGeometry(r, h, 18);

}

// σωλήνας κατά μήκος της καμπύλης fn(t), t από t0 έως t1· με reveal φαίνεται μόνο το κομμάτι ως το t
class FnCurve extends THREE.Curve {
  constructor(fn, t0, t1) { super(); this.fn = fn; this.t0 = t0; this.t1 = t1; }
  getPoint(u, target = new THREE.Vector3()) { return target.copy(this.fn(this.t0 + (this.t1 - this.t0) * u)); }
  // ισαπέχουσες τιμές του t (όχι ίσα τόξα): το κομμάτι i του σωλήνα αντιστοιχεί στο t0 + i(t1 − t0)/seg
  getPointAt(u, target) { return this.getPoint(u, target); }
  getTangentAt(u, target) { return this.getTangent(u, target); }
}
function tube(fn, t0, t1, seg, r, mat, rs = 8) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new FnCurve(fn, t0, t1), seg, r, rs, false), mat);
  m.userData.tube = { seg, rs, t0, t1 };

}
function reveal(m, t) {
  const u = m.userData.tube, f = THREE.MathUtils.clamp((t - u.t0) / (u.t1 - u.t0), 0, 1);
  m.geometry.setDrawRange(0, Math.round(f * u.seg) * u.rs * 6);
}

// ------------------------------------------------------------------ υφές: ο τοίχος και το δάπεδο με κάνναβο
const PX = 24;                          // pixels ανά cm στις υφές
// τοίχος (x = XW): οριζόντια ο άξονας t (z = 0 αριστερά, προς τα πίσω δεξιά), κατακόρυφα το ύψος της σκηνής
function wallTexture(kind) {
  const W = ZF - ZB, Hh = WALL_H;
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * PX); cv.height = Math.round(Hh * PX);
  const ctx = cv.getContext('2d');
  const X = z => (ZF - z) * PX, Y = y => (Hh - y) * PX;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#A6A6A6'; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, cv.width - 4, cv.height - 4);
  const seg = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  const arrow = (x, y, dx, dy) => { ctx.beginPath(); ctx.moveTo(x + dx * 26, y + dy * 26);
    ctx.lineTo(x - dy * 11, y + dx * 11); ctx.lineTo(x + dy * 11, y - dx * 11); ctx.closePath(); ctx.fill(); };
  const zEnd = -L - 1.5;
  ctx.font = `600 40px ${FONT}`;
  if (kind === 'trig') {
    // κάνναβος: κάθε π/2 στον άξονα t, κάθε 1/2 μονάδα στο ύψος (από −2 έως 2)
    ctx.strokeStyle = '#EDEDED'; ctx.lineWidth = 2;
    for (let i = 1; i <= 8; i++) seg(X(-K * i * Math.PI / 2), Y(YC - 2 * R), X(-K * i * Math.PI / 2), Y(YC + 2 * R));
    for (let j = -4; j <= 4; j++) seg(X(0), Y(YC + j * R / 2), X(-L), Y(YC + j * R / 2));
    ctx.strokeStyle = KEIMENO; ctx.fillStyle = KEIMENO; ctx.lineWidth = 4;
    seg(X(0), Y(YC), X(zEnd), Y(YC)); arrow(X(zEnd), Y(YC), 1, 0);
    seg(X(0), Y(YC - 2 * R - 1), X(0), Y(YC + 2 * R + 1.5)); arrow(X(0), Y(YC + 2 * R + 1.5), 0, -1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const PI = ['', 'π/2', 'π', '3π/2', '2π', '5π/2', '3π', '7π/2', '4π'];
    for (let i = 1; i <= 8; i++) { seg(X(-K * i * Math.PI / 2), Y(YC) - 8, X(-K * i * Math.PI / 2), Y(YC) + 8); ctx.fillText(PI[i], X(-K * i * Math.PI / 2), Y(YC) + 12); }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const j of [-2, -1, 1, 2]) ctx.fillText(String(j).replace('-', '−'), X(0) - 14, Y(YC + j * R));
    ctx.font = `italic 600 44px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillText('t', X(zEnd) + 14, Y(YC) - 30);
    ctx.fillText('y', X(0) + 18, Y(YC + 2 * R + 1.2));
  } else {
    // ελατήριο: οριζόντια ο χρόνος t σε s (1 s = 12 cm), κατακόρυφα το ύψος h σε m (1 m = 18 cm), h = 0 στη βάση
    ctx.strokeStyle = '#EDEDED'; ctx.lineWidth = 2;
    for (let i = 1; i <= 6; i++) seg(X(-KS * i), Y(0.3), X(-KS * i), Y(1.6 * SM));
    for (let j = 1; j <= 16; j++) if (j % 5) seg(X(0), Y(j * SM / 10), X(-L), Y(j * SM / 10));
    ctx.strokeStyle = '#D9D9D9'; ctx.lineWidth = 3;
    for (const j of [5, 10, 15]) seg(X(0), Y(j * SM / 10), X(-L), Y(j * SM / 10));
    ctx.strokeStyle = KEIMENO; ctx.fillStyle = KEIMENO; ctx.lineWidth = 4;
    seg(X(0), Y(0.35), X(zEnd), Y(0.35)); arrow(X(zEnd), Y(0.35), 1, 0);
    seg(X(0), Y(0.35), X(0), Y(1.75 * SM)); arrow(X(0), Y(1.75 * SM), 0, -1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    for (let i = 1; i <= 6; i++) { seg(X(-KS * i), Y(0.35) - 8, X(-KS * i), Y(0.35) + 8); ctx.fillText(String(i), X(-KS * i), Y(0.35) - 12); }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const [j, s] of [[0.5, '0,5'], [1, '1'], [1.5, '1,5']]) ctx.fillText(s, X(0) - 14, Y(j * SM));
    ctx.font = `italic 600 44px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('t', X(zEnd) - 6, Y(0.35) - 40);
    ctx.font = `600 40px ${FONT}`;
    ctx.fillText(' (s)', X(zEnd) + 16, Y(0.35) - 40);
    ctx.font = `italic 600 44px ${FONT}`; ctx.textBaseline = 'middle';
    ctx.fillText('h', X(0) + 18, Y(1.72 * SM));
    ctx.font = `600 40px ${FONT}`;
    ctx.fillText(' (m)', X(0) + 42, Y(1.72 * SM));
  }
  return canvasTexture(cv);
}
// δάπεδο (y = 0): οριζόντια η τετμημένη x (από −14 έως 14 cm), προς τα πάνω της υφής ο άξονας t (προς τα πίσω)
function floorTexture() {
  const X0 = -14, X1 = 14, W = X1 - X0, Hh = ZF - ZB;
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * PX); cv.height = Math.round(Hh * PX);

  const X = x => (x - X0) * PX, Y = z => (z - ZB) * PX;   // z = ZF στο κάτω μέρος της υφής, z = ZB στο πάνω
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#A6A6A6'; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, cv.width - 4, cv.height - 4);
  const seg = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };
  ctx.strokeStyle = '#EDEDED'; ctx.lineWidth = 2;
  for (let i = 1; i <= 8; i++) seg(X(-2 * R), Y(-K * i * Math.PI / 2), X(2 * R), Y(-K * i * Math.PI / 2));
  for (let j = -4; j <= 4; j++) seg(X(j * R / 2), Y(0), X(j * R / 2), Y(-L));
  ctx.strokeStyle = KEIMENO; ctx.fillStyle = KEIMENO; ctx.lineWidth = 4;
  const zEnd = -L - 1.5;
  seg(X(0), Y(0), X(0), Y(zEnd));
  ctx.beginPath(); ctx.moveTo(X(0), Y(zEnd) - 26); ctx.lineTo(X(0) - 11, Y(zEnd)); ctx.lineTo(X(0) + 11, Y(zEnd)); ctx.closePath(); ctx.fill();
  seg(X(-2 * R - 1), Y(0), X(2 * R + 1), Y(0));
  ctx.font = `600 40px ${FONT}`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const PI = ['', '', 'π', '', '2π', '', '3π', '', '4π'];
  for (let i = 2; i <= 8; i += 2) ctx.fillText(PI[i], X(0) - 12, Y(-K * i * Math.PI / 2));
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const j of [-2, -1, 1, 2]) ctx.fillText(String(j).replace('-', '−'), X(j * R), Y(0) + 10);
  ctx.font = `italic 600 44px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('t', X(0) + 14, Y(zEnd) + 10);
  return canvasTexture(cv);
}

  floorText.visible = c === 2;

  for (const k of [4, 5]) {

    for (const s of sol[k].pts) for (const o of s.items) o.visible = false;   // οι ετικέτες στον τοίχο δεν είναι στο g
  }

  ringP.visible = cosP.visible = sinP.visible = axP.visible = c === 1;
  shW.visible = prW.visible = c >= 2;

  shF.visible = prF.visible = lblShF.visible = c === 2 || c === 3;

}

function step(dt) {
  const S = STATES[current], c = current;
  if (playing) {
    tNow += dt * speed;
    if (tNow >= S.tEnd) { tNow = S.tEnd; playing = false; hold = 0; updateButtons(); }
  } else if (renderer.xr.isPresenting && tNow >= S.tEnd - 1e-9) {
    // στο XR δεν υπάρχουν κουμπιά: η κατάσταση ξαναπαίζει από την αρχή 5 s αφού τελειώσει
    hold += dt;
    if (hold > 5) { tNow = 0; playing = true; hold = 0; updateButtons(); }
  }
  const t = tNow, end = t >= S.tEnd - 1e-9;
  // ο χρόνος: σε rad (και μοίρες στον κύκλο) ή σε s (ελατήριο)
  if (c === 0) setText(timeLabel, t < 1e-9 ? 't = 0 rad (0°)' : `t ≈ ${num(t)} rad (${Math.round(t * 180 / Math.PI)}°)`, INK);
  else if (c === 5) setText(timeLabel, t < 1e-9 ? 't = 0 s' : `t ≈ ${num(t)} s`, INK);
  else setText(timeLabel, t < 1e-9 ? 't = 0 rad' : `t ≈ ${num(t)} rad`, INK);
  // M στον κύκλο μπροστά
  const m = pos(c, t, 0);
  ptM.position.copy(m);
  setBar(OM, V(0, YC, 0), m, 0.16);
  lblM.position.copy(m).add(V(m.x >= 0 ? 1.6 : -1.6, 1.4, 0.3));
  if (c <= 1) {
    setBar(cosBar, V(0, YC, 0.02), V(m.x, YC, 0.02), 0.38);
    setBar(sinBar, V(m.x, YC, 0.02), V(m.x, m.y, 0.02), 0.38);
    lblCos.position.set(m.x / 2, YC + (m.y >= YC ? -1.7 : 1.7), 0.4);
    lblSin.position.set(m.x + (m.x >= 0 ? 4.6 : -4.6), (YC + m.y) / 2, 0.4);
    setText(lblCos, `συνt ≈ ${num(Math.cos(t))}`, TXT.C);
    setText(lblSin, `ημt ≈ ${num(Math.sin(t))}`, TXT.S);
  }
  if (c === 0) {
    reveal(arcT, t);
    lblArc.visible = t > 0.4;
    lblArc.position.set(3.1 * Math.cos(t / 2), YC + 3.1 * Math.sin(t / 2), 0.3);
  }
  if (c === 0) return;
  // P στην έλικα
  const p = pos(c, t);
  ptP.position.copy(p);
  lblP.position.copy(p).add(V(p.x >= 0 ? 1.6 : -1.6, 1.4, 0));
  const hx = c === 1 || c === 2 || c === 4 ? 1 : c;

    setBar(sinP, V(p.x, YC, p.z), p, 0.3);
    ringP.visible = axP.visible = t > 0.05;
  }
  if (c >= 2) {
    const w = V(XW + 0.4, p.y, p.z);

    setBar(prW, p, w, 0.08);
    reveal(wallLine[hx], t);

    lblShF.position.copy(f).add(V(0, 1.7, 0));
  }
  if (c === 4 || c === 5) for (const s of sol[c].pts) for (const o of s.items) o.visible = t >= s.t - 1e-9;

  }

const eyeW = new THREE.Vector3(), pw = new THREE.Vector3(), camR = new THREE.Vector3(), camU = new THREE.Vector3();

function faceViewer(cam, xr) {

    panel.quaternion.copy(qP).multiply(qY);
  } else {

    camR.setFromMatrixColumn(cam.matrixWorld, 0).normalize();
    camU.setFromMatrixColumn(cam.matrixWorld, 1).normalize();
    if (side) panel.position.copy(SIDE).addScaledVector(camR, -PW / 2).addScaledVector(camU, -panel.scale.y / 2);
    else panel.position.copy(ANCHOR).addScaledVector(camU, panel.scale.y / 2);
  }
}

// ------------------------------------------------------------------ πλαίσιο της προβολής 3D
// Η κάμερα κοιτά από εμπρός, από δεξιά και από ψηλά, ώστε να φαίνονται ο κύκλος, η έλικα σε βάθος και ο τοίχος.
const VIEW_DIR = V(Math.sin(rad(AZ)) * Math.cos(rad(EL)), Math.sin(rad(EL)), Math.cos(rad(AZ)) * Math.cos(rad(EL))).normalize();
const FIT = [], FIT0 = [];
for (const x of [FX0, FX1]) for (const y of [0, FY1]) for (const z of [ZF, ZB]) FIT.push(V(x, y, z));
for (const x of [FX0, FX1]) for (const y of [0, YC + 2 * R + 6.5]) for (const z of [-1, ZF]) FIT0.push(V(x, y, z));
const VIEW0 = V(Math.sin(rad(16)) * Math.cos(rad(12)), Math.sin(rad(12)), Math.cos(rad(16)) * Math.cos(rad(12))).normalize();
const viewDir = () => current === 0 ? VIEW0 : VIEW_DIR;
const PANEL_MAX = Math.max(...STATES.map(S => S.lines.length));
let barBottom = 62, dockTop = 600, frameH = 800, touched = false;
controls.addEventListener('start', () => { touched = true; });
function dockTopMax() {
  const dock = document.getElementById('dock'), keep = hintEl.innerHTML;
  let top = dock.getBoundingClientRect().top;
  for (let k = 0; k < STATES.length; k++) { hintEl.innerHTML = hintHTML(k); top = Math.min(top, dock.getBoundingClientRect().top); }
  hintEl.innerHTML = keep;
  return top;
}
function layoutView() {
  const W = window.innerWidth, Hh = window.innerHeight;
  barBottom = Math.round(document.getElementById('bar').getBoundingClientRect().bottom);
  dockTop = Math.round(dockTopMax());
  const dy = Math.max(0, Math.round(Hh / 2 - (barBottom + dockTop) / 2));
  frameH = Hh + 2 * dy;
  camera.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(rad(FOV / 2)) * frameH / Hh));
  camera.aspect = W / frameH;
  if (dy) camera.setViewOffset(W, frameH, 0, 2 * dy, W, Hh); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  if (!renderer.xr.isPresenting) setLabelScale(W / Hh < 1 ? 1.5 : 1.3);
}
// ο πίνακας μπαίνει πάνω από τη σκηνή ή αριστερά της, όπου η σκηνή βγαίνει μεγαλύτερη
function fitView(sd) {
  side = sd;
  const W = window.innerWidth, Hh = window.innerHeight;
  const yTop = 1 - 2 * (barBottom + 8) / Hh, yBot = 1 - 2 * (dockTop - 8) / Hh;
  const yMid = (yTop + yBot) / 2, hy = 0.95 * (yTop - yBot) / 2, hx = 0.95;
  const tgt = current === 0 ? world.localToWorld(V(0, YC, 0)) : world.localToWorld(V(SET_CX, 18, SET_CZ));
  const right = new THREE.Vector3(), up = new THREE.Vector3(), corner = new THREE.Vector3();
  let D = 1.8;
  for (let it = 0; it < 14; it++) {
    camera.position.copy(viewDir()).multiplyScalar(D).add(tgt);
    camera.lookAt(tgt);
    camera.updateMatrixWorld();
    faceViewer(camera, false);
    scene.updateMatrixWorld(true);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    const add = q => { q.project(camera); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); };
    for (const c of current === 0 ? FIT0 : FIT) add(world.localToWorld(c.clone()));
    for (const [u, v] of [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5]]) add(panel.localToWorld(corner.set(u, v, 0)));
    const hh = D * Math.tan(rad(camera.fov / 2)) * Hh / frameH, ww = D * Math.tan(rad(camera.fov / 2)) * W / frameH;
    right.setFromMatrixColumn(camera.matrixWorld, 0);
    up.setFromMatrixColumn(camera.matrixWorld, 1);
    tgt.addScaledVector(right, (x0 + x1) / 2 * ww).addScaledVector(up, ((y0 + y1) / 2 - yMid) * hh);
    const r = Math.max((x1 - x0) / 2 / hx, (y1 - y0) / 2 / Math.max(hy, 0.05));
    D = THREE.MathUtils.clamp(D * r, controls.minDistance, controls.maxDistance);
  }
  return { D, tgt, sd };
}
function homeView() {
  const keep = panel.scale.clone();
  panel.scale.set(PW, PW * panelH(PANEL_MAX) / PTW, 1);
  const a = fitView(false), b = fitView(true), best = b.D < a.D * 0.97 ? b : a;
  side = best.sd;
  camera.position.copy(viewDir()).multiplyScalar(best.D).add(best.tgt);
  controls.target.copy(best.tgt);
  controls.update();
  panel.scale.copy(keep);
  faceViewer(camera, false);
}
function setLabelScale(k) {
  world.traverse(o => { if (o.userData.scalable) { o.userData.k = k; fitLabel(o); } });
}

{
  const q = parseInt(new URLSearchParams(location.search).get('k'), 10);
  select(Number.isFinite(q) && q >= 0 && q < STATES.length ? q : 0);
}
step(0);
layoutView();
homeView();
viewReady = true;

// ------------------------------------------------------------------ XR
const btnAR = document.getElementById('btnAR'), btnVR = document.getElementById('btnVR');
const note = document.getElementById('note');
let placed = false, floorRef = true;
async function checkXR() {
  if (!window.isSecureContext) {
    note.textContent = 'Η σελίδα δεν σερβίρεται μέσω HTTPS, οπότε το AR/VR δεν είναι διαθέσιμο. Προβολή σε 3D.';
    note.style.display = 'block';
    return;
  }
  if (!navigator.xr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
    return;
  }
  const [ar, vr] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false)]);
  if (ar) btnAR.style.display = 'inline-block';
  if (vr) btnVR.style.display = 'inline-block';
  if (!ar && !vr) {
    note.textContent = 'Προβολή σε 3D. Η λειτουργία AR/VR ανοίγει στον browser των γυαλιών Magic Leap 2 ή Meta Quest 3.';
    note.style.display = 'block';
  }
}
checkXR().then(() => { layoutView(); if (!touched) homeView(); });

function resetView() {
  camera.near = 0.01;
  camera.far = 60;
  root.position.set(0, 0, 0);
  root.quaternion.identity();
  root.scale.setScalar(1);
  room.visible = false;
  scene.background = null;
  layoutView();
  homeView();
  touched = false;
}

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {
    const session = await navigator.xr.requestSession(kind, { optionalFeatures: ['local-floor', 'hand-tracking'] });
    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);
    floorRef = ref === 'local-floor';
    camera.near = 0.02;
    camera.far = 50;
    camera.updateProjectionMatrix();
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    // μέσα στα γυαλιά δεν υπάρχουν κουμπιά για τον χρόνο: η κίνηση συνεχίζει
    if (!playing && tNow < STATES[current].tEnd - 1e-9) { playing = true; updateButtons(); }
    session.addEventListener('end', () => { resetView(); });
  } catch (err) {
    note.textContent = 'Δεν ξεκίνησε η λειτουργία ' + (kind === 'immersive-ar' ? 'AR' : 'VR') + ': ' + (err.message || err);
    note.style.display = 'block';
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

// στην πρώτη εικόνα του XR, η σκηνή τοποθετείται μπροστά από τον χρήστη (το κέντρο της 1,2 m μακριά, ο κύκλος περίπου
// 0,8 m), στο ύψος ενός θρανίου, πάντα κάτω από τα μάτια
function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);
  if (!pose) return;
  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  const y = THREE.MathUtils.clamp(floorY + TABLE, p.y - 0.9, p.y - 0.4);
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * DIST, y, p.z + dir.z * DIST);
  root.rotation.set(0, yaw - rad(AZ), 0);     // όπως στην προβολή 3D: ο κύκλος αριστερά, η έλικα προς τα δεξιά
  root.scale.setScalar(1);
  const desk = room.getObjectByName('desk');
  desk.position.set(root.position.x, y - 0.029, root.position.z);
  desk.rotation.y = yaw - rad(AZ);
  room.getObjectByName('floor').position.y = floorY;
  setLabelScale(1);
  panelXR();
  placed = true;
}

// χειριστήρια: σύντομο πάτημα (σκανδάλη ή τσίμπημα) = επόμενη κατάσταση, παρατεταμένο πάτημα πάνω στη σκηνή = μετακίνηση,
// μοχλός = μέγεθος. Ένα πάτημα έως 0,8 s που δεν έπιασε τη σκηνή μετρά επίσης ως «επόμενη κατάσταση».
const hit = new THREE.Mesh(new THREE.BoxGeometry(46, 44, 90), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
hit.position.set(SET_CX, 20, SET_CZ);
hit.visible = false;
world.add(hit);
const ray = new THREE.Raycaster();
const rot = new THREE.Matrix4();
function makeController(i) {
  const ctl = renderer.xr.getController(i);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.7 }));
  line.scale.z = 2.5;
  line.visible = false;
  ctl.add(line);
  ctl.userData = { line, t0: 0, grab: false, source: null };
  ctl.addEventListener('connected', e => { ctl.userData.source = e.data; line.visible = e.data.targetRayMode === 'tracked-pointer'; });
  ctl.addEventListener('disconnected', () => { ctl.userData.source = null; line.visible = false; });
  ctl.addEventListener('selectstart', () => {
    ctl.userData.t0 = performance.now();
    rot.identity().extractRotation(ctl.matrixWorld);
    ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);
    ray.ray.direction.set(0, 0, -1).applyMatrix4(rot);
    if (ray.intersectObject(hit, false).length) { ctl.userData.grab = true; ctl.attach(root); }
  });
  ctl.addEventListener('selectend', () => {
    const held = performance.now() - ctl.userData.t0, grabbed = ctl.userData.grab;
    if (grabbed) { scene.attach(root); ctl.userData.grab = false; }
    if (held < 280 || (!grabbed && held < 800)) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [0, 1, 2, 3].map(makeController);

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const raw = (now - last) / 1000;
  const dt = raw < 1 ? raw : 0;
  last = now;
  if (frame && !placed) placeInFront(frame);
  step(dt);
  if (renderer.xr.isPresenting) {
    faceViewer(renderer.xr.getCamera(), true);
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * Math.min(dt, 0.1) * 0.9), 0.5, 3));
      }
    });
  } else {
    controls.update();
    faceViewer(camera, false);
  }
  renderer.render(scene, camera);
});
</script>
