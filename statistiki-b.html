{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",

<script type="module">
// Σενάριο «Περιγραφική Στατιστική» (Μαθηματικά Β΄ Γυμνασίου, Κεφάλαιο 4, §4.1 έως §4.5, χωρίς τη μέση τιμή ομαδοποιημένης
// κατανομής): οκτώ καταστάσεις που αντιστοιχούν στις επτά εφαρμογές GeoGebra του σεναρίου (η §4.2 έχει δύο: κυκλικό και
// γραμμικό διάγραμμα). Κέντρο Καινοτομίας Θεσσαλίας.
// Κάθε κατάσταση είναι ένας πίνακας που στέκεται πάνω σε μια βάση. Οι ράβδοι, τα πλακίδια, οι κύβοι και οι κυκλικοί τομείς
// είναι στερεά με πάχος και στέκονται μπροστά από το χαρτί, ώστε όταν ο θεατής κινείται να φαίνεται το βάθος τους. Τα χρώματα
// είναι τα ίδια με τις εφαρμογές GeoGebra: μπλε το κύριο, πορτοκαλί ό,τι αλλάζει, πράσινο τα θετικά, κόκκινο τα αρνητικά,
// μωβ η δεύτερη ομάδα και η διάμεσος, γκρι τα βοηθητικά.
// Μονάδα μήκους της σκηνής: 1 cm. Ο πίνακας έχει πλάτος 48 cm και ύψος 30 cm.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CM = 0.012;                       // 1 cm της σκηνής σε μέτρα (ο πίνακας: 0,58 m πλάτος)
const BX0 = -24, BX1 = 24, BY0 = 4, BY1 = 34;   // ο πίνακας
const WY0 = 6, WY1 = 32;                // το ύψος του πεδίου της γραφικής παράστασης πάνω στον πίνακα
const PANEL_Y = 36.5;                   // η κάτω πλευρά του πίνακα τίτλου
const TABLE = 0.78, DIST = 1.15;        // XR: ύψος θρανίου και απόσταση της σκηνής από τον χρήστη (m)
const AZ = 18, EL = 12;                 // η σκηνή φαίνεται από εμπρός-δεξιά (18°) και από ψηλά (12°)
const FOV = 26;
const PX = 30;                          // pixels ανά cm στην υφή του πίνακα

const COL = { B: '#4F81BD', R: '#C00000', O: '#E36C09', G: '#548235', P: '#7030A0', K: '#7F7F7F', N: '#17365D', A: '#F4B400' };
const TXT = { B: '#8FB4E3', R: '#F08A84', O: '#F7A864', G: '#8FD08A', P: '#C59BE0', K: '#cbd5e1', N: '#9fb8d8', A: '#F8CF5C' };
const INK = '#eaf1f8', KEIMENO = '#262626';

const rad = THREE.MathUtils.degToRad;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);
const num = (x, d = 2) => { const s = (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x + Math.sign(x) * 1e-9).toFixed(d); return s.replace('.', ',').replace('-', '−'); };
const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const approx = v => { const r = Math.round(v * 100) / 100; return Math.abs(v - r) < 1e-9 ? '= ' + tl(r) : '≈ ' + num(v); };

// ------------------------------------------------------------------ renderer, σκηνή, κάμερα
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  if (!renderer.getContext()) throw new Error('no gl');
} catch (err) {
  document.documentElement.classList.add('nogl');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.01, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxDistance = 5;

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3446, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.8, 1.6, 1.2);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ff, 0.5);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// δάπεδο και θρανίο μόνο σε αδιαφανή λειτουργία (VR)
const room = new THREE.Group();
room.visible = false;
scene.add(room);
{
  const floor = new THREE.Group();
  floor.name = 'floor';
  room.add(floor);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: 0x1b2433, roughness: 0.95, depthWrite: false }));
  disc.rotation.x = -Math.PI / 2;
  disc.renderOrder = -2;
  floor.add(disc);
  const grid = new THREE.GridHelper(12, 24, 0x3b4a63, 0x27324a);
  grid.material.depthWrite = false;
  grid.renderOrder = -1;
  grid.position.y = 0.002;
  floor.add(grid);
  const desk = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.04, 0.5), new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.7 }));
  desk.name = 'desk';
  room.add(desk);
}

const root = new THREE.Group();
scene.add(root);
const world = new THREE.Group();         // η σκηνή σε εκατοστά
world.scale.setScalar(CM);
root.add(world);

// ------------------------------------------------------------------ κείμενα σε υφή
const FONT = '"Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif';
function roundRect(ctx, w, h, r) {
  ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r);
  ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.closePath();
}
function canvasTexture(cv) {
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
// στοιχειοθεσία των κειμένων: _{…} δείκτης, ^{…} εκθέτης, ∫{α}{β} ολοκλήρωμα με άκρα, ]{α}{β} αγκύλη με άκρα,
// π.χ. '∫{0}{1} x e^{x} dx = [x e^{x}]{0}{1} − …'
function parseRich(s) {
  const out = [];
  let i = 0, buf = '';
  const flush = () => { if (buf) { out.push({ t: 'n', s: buf }); buf = ''; } };
  const group = () => {
    let depth = 0, j = i;
    for (; j < s.length; j++) { if (s[j] === '{') depth++; else if (s[j] === '}' && --depth === 0) break; }
    const c = s.slice(i + 1, j);
    i = j + 1;
    return c;
  };
  while (i < s.length) {
    const ch = s[i];
    if ((ch === '_' || ch === '^') && s[i + 1] === '{') { flush(); i++; out.push({ t: ch === '_' ? 'sub' : 'sup', s: group() }); }
    else if ((ch === '∫' || ch === ']') && s[i + 1] === '{') { flush(); i++; const lo = group(), hi = group(); out.push({ t: ch === '∫' ? 'int' : 'br', lo, hi }); }
    else { buf += ch; i++; }
  }
  flush();
  return out;
}
const isTall = s => /[∫\]]\{/.test(s);
function richLayout(ctx, s, size, weight) {
  const F = k => `${weight} ${Math.round(size * k)}px ${FONT}`;
  const W = (t, k) => { ctx.font = F(k); return ctx.measureText(t).width; };
  const parts = [];
  let x = 0;
  for (const r of parseRich(s)) {
    if (r.t === 'n') { parts.push({ s: r.s, x, dy: 0, k: 1 }); x += W(r.s, 1); }
    else if (r.t === 'sub' || r.t === 'sup') {
      parts.push({ s: r.s, x: x + size * 0.02, dy: r.t === 'sub' ? size * 0.3 : -size * 0.38, k: 0.7 });
      x += W(r.s, 0.7) + size * 0.06;
    } else if (r.t === 'int') {
      const wi = W('∫', 1.45);
      parts.push({ s: '∫', x, dy: -size * 0.04, k: 1.45 });
      parts.push({ s: r.hi, x: x + wi * 0.92, dy: -size * 0.62, k: 0.75 });
      parts.push({ s: r.lo, x: x + wi * 0.4, dy: size * 0.62, k: 0.75 });
      x += Math.max(wi * 0.92 + W(r.hi, 0.75), wi * 0.4 + W(r.lo, 0.75)) + size * 0.14;
    } else {
      const wb = W(']', 1);
      parts.push({ s: ']', x, dy: 0, k: 1 });
      const xl = x + wb + size * 0.04;
      parts.push({ s: r.hi, x: xl, dy: -size * 0.55, k: 0.75 });
      parts.push({ s: r.lo, x: xl, dy: size * 0.55, k: 0.75 });
      x = xl + Math.max(W(r.hi, 0.75), W(r.lo, 0.75)) + size * 0.08;
    }
  }
  return { w: x, parts, F };
}
function richDraw(ctx, L, x0, y, stroke) {      // stroke: πάχος του περιγράμματος για το κανονικό μέγεθος
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (const p of L.parts) {
    ctx.font = L.F(p.k);
    if (stroke) { ctx.lineWidth = stroke * Math.min(p.k, 1); ctx.strokeText(p.s, x0 + p.x, y + p.dy); } else ctx.fillText(p.s, x0 + p.x, y + p.dy);
  }
}
const measureCtx = document.createElement('canvas').getContext('2d');
// ετικέτα με περίγραμμα, πάντα στραμμένη προς τον θεατή· η υφή έχει πλάτος για το μεγαλύτερο κείμενο (template) και
// μεγαλώνει, αν χρειαστεί, για μεγαλύτερο κείμενο
const LS = 120, LPAD = 40;
function labelCanvas(sp, w, h) {
  const u = sp.userData;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  if (u.tex) u.tex.dispose();
  Object.assign(u, { cv, ctx: cv.getContext('2d'), tex: canvasTexture(cv), aspect: w / h, h: u.base * h / (LS * 1.5) });
  sp.material.map = u.tex;
  sp.material.needsUpdate = true;
  fitLabel(sp);
}
function label(text, color, height, template) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false, depthTest: false }));
  sp.renderOrder = 8;
  const t = template || text, L = richLayout(measureCtx, t, LS, 700);
  sp.userData = { base: height * (isTall(t) ? 1.12 : 1), k: 1, text: null, color: null, scalable: true };
  labelCanvas(sp, Math.ceil(L.w) + 2 * LPAD, Math.ceil(LS * (isTall(t) ? 2.2 : 1.5)));
  setText(sp, text, color);
  return sp;
}
function setText(sp, text, color) {
  const u = sp.userData;
  if (u.text === text && u.color === color) return;
  u.text = text; u.color = color;
  const L = richLayout(measureCtx, text, LS, 700);
  const w = Math.ceil(L.w) + 2 * LPAD, h = Math.ceil(LS * (isTall(text) ? 2.2 : 1.5));
  if (w > u.cv.width || h > u.cv.height) labelCanvas(sp, Math.max(w, u.cv.width), Math.max(h, u.cv.height));
  const { cv, ctx } = u;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(14,20,32,.9)';
  ctx.fillStyle = color;
  const x0 = (cv.width - L.w) / 2, y = cv.height / 2;
  richDraw(ctx, L, x0, y, 22);
  richDraw(ctx, L, x0, y, 0);
  u.tex.needsUpdate = true;
}
function fitLabel(sp) { const u = sp.userData, s = u.h * u.k; sp.scale.set(s * u.aspect, s, 1); }

// ------------------------------------------------------------------ βοηθητικά γεωμετρίας
const plateGeo = new THREE.PlaneGeometry(1, 1);
const unitBox = new THREE.BoxGeometry(1, 1, 1);
function kouti(sx, sy, sz, c, mat) {
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(sx, sy, sz);
  m.position.copy(c);
  return m;
}
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 12, 1);
function setBar(m, a, b, r) {
  m.position.copy(a).add(b).multiplyScalar(0.5);
  const d = b.clone().sub(a), l = d.length();
  if (l > 1e-6) m.quaternion.setFromUnitVectors(UP, d.multiplyScalar(1 / l));
  m.scale.set(r, Math.max(l, 1e-4), r);
  m.visible = l > 0.05;
}
function bar(a, b, r, mat) { const m = new THREE.Mesh(unitCyl, mat); setBar(m, a, b, r); return m; }
function dashedBar(a, b, r, mat, dash = 1.0, gap = 0.7) {
  const g = new THREE.Group(), d = b.clone().sub(a), l = d.length();
  for (let s = 0; s < l; s += dash + gap) {
    const e = Math.min(s + dash, l);
    g.add(bar(a.clone().addScaledVector(d, s / l), a.clone().addScaledVector(d, e / l), r, mat));
  }
  return g;
}
const ballGeo = new THREE.SphereGeometry(1, 24, 16);
function ball(r, mat) { const m = new THREE.Mesh(ballGeo, mat); m.scale.setScalar(r); return m; }
// σωλήνας κατά μήκος της καμπύλης fn(t), t από t0 έως t1· με reveal φαίνεται μόνο το κομμάτι ως το t
class FnCurve extends THREE.Curve {
  constructor(fn, t0, t1) { super(); this.fn = fn; this.t0 = t0; this.t1 = t1; }
  getPoint(u, target = new THREE.Vector3()) { return target.copy(this.fn(this.t0 + (this.t1 - this.t0) * u)); }
  getPointAt(u, target) { return this.getPoint(u, target); }
  getTangentAt(u, target) { return this.getTangent(u, target); }
}
function tube(fn, t0, t1, seg, r, mat, rs = 6) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new FnCurve(fn, t0, t1), seg, r, rs, false), mat);
  m.userData.tube = { seg, rs, t0, t1, r, fn };
  return m;
}

function mapper(S) {

  return {

// kit(g, m): δημιουργεί αντικείμενα στο group g με συντεταγμένες της γραφικής παράστασης (x, y) μέσω του mapper m
function kit(g, m) {
  const P = (x, y, z = 0.9) => V(m.X(x), m.Y(y), z);
  const K = { P };
  K.vtube = (vec, a, b, seg, r, color) => { const t = tube(vec, a, b, seg, r, bm(COL[color])); g.add(t); return t; };
  K.curve = (f, a, b, seg, r, color, z = 0.6) => K.vtube(t => P(t, f(t), z), a, b, seg, r, color);
  K.dash = (x0, y0, x1, y1, color, r = 0.11, z = 0.5) => { const d = dashedBar(P(x0, y0, z), P(x1, y1, z), r, bm(COL[color])); g.add(d); return d; };
  K.line = (color, r = 0.12, op = 1) => { const b = bar(V(0, 0, 0), V(1, 0, 0), r, bm(COL[color], op)); g.add(b); return b; };
  K.setLine = (b, x0, y0, x1, y1, z = 0.8, r) => setBar(b, P(x0, y0, z), P(x1, y1, z), r !== undefined ? r : b.scale.x);
  K.ball = (color, r = 0.65, z = 0.95) => { const b = ball(r, glow(COL[color])); b.position.z = z; g.add(b); return b; };
  K.put = (o, x, y, z) => { o.position.copy(P(x, y, z === undefined ? o.position.z : z)); };
  K.hole = (x, y, color, r = 0.75) => {         // ανοιχτός κύκλος: το σημείο που λείπει
    const h = new THREE.Group();
    const d = new THREE.Mesh(new THREE.CircleGeometry(r, 32), bm('#ffffff'));
    const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.17, 8, 32), bm(COL[color]));
    d.position.z = 0.8; t.position.z = 0.82;
    h.add(d, t);
    h.position.set(m.X(x), m.Y(y), 0);
    g.add(h);
    return h;
  };
  K.rect = (color, op = 0.25, z = 1.4) => { const r = new THREE.Mesh(plateGeo, bm(COL[color], op)); r.renderOrder = 3; r.userData.z = z; g.add(r); return r; };
  K.setRect = (r, x0, y0, x1, y1) => {
    const a = m.X(x0), b = m.X(x1), c = m.Y(y0), d = m.Y(y1);
    r.position.set((a + b) / 2, (c + d) / 2, r.userData.z);
    r.scale.set(Math.max(Math.abs(b - a), 1e-3), Math.max(Math.abs(d - c), 1e-3), 1);
  };
  K.text = (color, template, h = 1.5) => { const l = label(template, TXT[color], h, template); l.userData.col = TXT[color]; l.position.z = 2.2; g.add(l); return l; };
  K.say = (l, s, color) => setText(l, s, color ? TXT[color] : l.userData.col);
  K.at = (l, x, y) => l.position.copy(P(x, y, 2.2));
  K.fcurve = (f, a, b, seg, r, color, op = 0.35, z = 0.45) => { const t = tube(s => P(s, f(s), z), a, b, seg, r, bm(COL[color], op)); g.add(t); return t; };
  // χωρίο ανάμεσα στις lo(x) και hi(x), για x από a έως b: band.userData.set(a, b, lo, hi)
  K.band = (color, op = 0.4, z = 0.3, parent = g, N = 120) => {
    const pos = new Float32Array((N + 1) * 6), idx = [];
    for (let i = 0; i < N; i++) idx.push(2 * i, 2 * i + 2, 2 * i + 1, 2 * i + 1, 2 * i + 2, 2 * i + 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(idx);
    const b = new THREE.Mesh(geo, bm(COL[color], op));
    b.renderOrder = 2;
    b.frustumCulled = false;
    b.visible = false;
    b.userData.set = (a, c, lo, hi) => {
      b.visible = Math.abs(c - a) > 1e-4;
      if (!b.visible) return;
      for (let i = 0; i <= N; i++) {
        const x = a + (c - a) * i / N, X = m.X(x);
        pos.set([X, m.Y(lo(x)), z, X, m.Y(hi(x)), z], 6 * i);
      }
      geo.attributes.position.needsUpdate = true;
    };
    parent.add(b);
    return b;
  };
  // τουβλάκια (ορθογώνια με πάχος) για τα αθροίσματα: bricks.set([[x0, y0, x1, y1], …])
  K.bricks = (color, n, z0 = 0.15, z1 = 1.35) => {
    const pool = [];
    for (let i = 0; i < n; i++) { const b = new THREE.Mesh(unitBox, glow(COL[color])); b.visible = false; g.add(b); pool.push(b); }
    return {
      set(list) {
        pool.forEach((b, i) => {
          const r = list[i];
          if (!r) { b.visible = false; return; }
          const x0 = m.X(r[0]), x1 = m.X(r[2]), y0 = m.Y(r[1]), y1 = m.Y(r[3]);
          const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
          b.visible = h > 0.02;
          b.scale.set(Math.max(w - Math.min(0.12, w * 0.08), 0.01), Math.max(h, 0.01), z1 - z0);
          b.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
        });
      }
    };
  };
  return K;
}

async function startXR(kind) {
  if (renderer.xr.isPresenting) return;
  try {

    let ref = 'local-floor';
    try { await session.requestReferenceSpace('local-floor'); } catch { ref = 'local'; }
    renderer.xr.setReferenceSpaceType(ref);

    camera.near = 0.02;
    camera.far = 50;
    camera.updateProjectionMatrix();
    await renderer.xr.setSession(session);
    placed = false;
    const opaque = (session.environmentBlendMode || 'opaque') === 'opaque';
    room.visible = opaque;
    scene.background = opaque ? new THREE.Color(0x0e1420) : null;
    // μέσα στα γυαλιά δεν υπάρχουν κουμπιά για τον χρόνο: η κίνηση συνεχίζει

function placeInFront(frame) {
  const ref = renderer.xr.getReferenceSpace();
  const pose = frame.getViewerPose(ref);

  const p = pose.transform.position, o = pose.transform.orientation;
  const q = new THREE.Quaternion(o.x, o.y, o.z, o.w);
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  dir.y = 0;
  if (dir.lengthSq() < 1e-6) dir.set(0, 0, -1);
  dir.normalize();
  const floorY = floorRef ? 0 : p.y - 1.6;
  const y = THREE.MathUtils.clamp(floorY + TABLE, p.y - 0.9, p.y - 0.4);
  const yaw = Math.atan2(-dir.x, -dir.z);
  root.position.set(p.x + dir.x * DIST, y, p.z + dir.z * DIST);
  root.rotation.set(0, yaw - rad(AZ), 0);
  root.scale.setScalar(1);
  const desk = room.getObjectByName('desk');
  desk.position.set(root.position.x, y - 0.029, root.position.z);
  desk.rotation.y = yaw - rad(AZ);
  room.getObjectByName('floor').position.y = floorY;
  setLabelScale(1);

  });
  ctl.addEventListener('selectend', () => {
    const held = performance.now() - ctl.userData.t0, grabbed = ctl.userData.grab;
    if (grabbed) { scene.attach(root); ctl.userData.grab = false; }
    if (held < 280 || (!grabbed && held < 800)) next();
  });
  scene.add(ctl);
  return ctl;
}
const ctls = [0, 1, 2, 3].map(makeController);

window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  renderer.setSize(window.innerWidth, window.innerHeight);
  layoutView();
  if (!touched) homeView();
});

let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now();
  const raw = (now - last) / 1000;
  const dt = raw < 1 ? raw : 0;
  last = now;
  if (frame && !placed) placeInFront(frame);
  step(dt);
  if (renderer.xr.isPresenting) {
    faceViewer(renderer.xr.getCamera(), true);
    ctls.forEach(c => {
      const gp = c.userData.source && c.userData.source.gamepad;
      if (gp && gp.axes && gp.axes.length) {
        const ax = gp.axes[3] !== undefined ? gp.axes[3] : gp.axes[1];
        if (Math.abs(ax) > 0.2) root.scale.setScalar(THREE.MathUtils.clamp(root.scale.x * (1 - ax * Math.min(dt, 0.1) * 0.9), 0.5, 3));
      }
    });
  } else {
    controls.update();
    faceViewer(camera, false);
  }
  renderer.render(scene, camera);
});
</script>
